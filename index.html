<!--
  QR SCANNER
  VERSION: 2.0
  After scan:
  - Camera turns off
  - Scanner UI hides
  - Rescan button appears
  - Rescan button refreshes the page
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    #camera {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius: 28px;

      background: #000;
    }

    #reader {
      position: absolute;
      inset: 0;

      width: 100% !important;
      height: 100% !important;

      border: none !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    #reader__header_message {
      display: none !important;
    }

    #reader__scan_region {
      border: none !important;
    }

    #reader__scan_region img {
      display: none !important;
    }

    #reader__scan_region > div {
      border: none !important;
    }

    /*
      FIXED QR BOX
    */

    #scan-box {
      position: absolute;

      width: 250px !important;
      height: 250px !important;

      min-width: 250px;
      min-height: 250px;

      max-width: 250px;
      max-height: 250px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border: 3px solid white;

      border-radius: 18px;

      pointer-events: none;

      z-index: 10;
    }

    /*
      HOLD STILL
    */

    #hold-still {
      position: absolute;

      left: 50%;
      top: calc(50% + 155px);

      transform: translateX(-50%);

      z-index: 15;

      padding: 9px 16px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 15px;
      font-weight: 600;

      white-space: nowrap;

      display: none;
    }

    /*
      LOADING
    */

    #loading {
      position: absolute;
      inset: 0;

      background: #000;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 20;
    }

    .spinner {
      width: 28px;
      height: 28px;

      border: 3px solid #333;

      border-top: 3px solid white;

      border-radius: 50%;

      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

    /*
      RESCAN BUTTON
    */

    #rescan {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 50;

      display: none;

      border: none;

      padding: 13px 25px;

      border-radius: 999px;

      background: white;

      color: #111;

      font-family: Arial, sans-serif;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.25);
    }

    #rescan:active {
      transform:
        translate(-50%, -50%)
        scale(0.95);
    }

  </style>
</head>

<body>

  <div id="app">

    <div id="camera">

      <div id="reader"></div>

      <div id="scan-box"></div>

      <div id="hold-still">
        Hold still
      </div>

      <div id="loading">

        <div class="spinner"></div>

      </div>

      <button
        id="rescan"
        onclick="rescan()"
      >
        Rescan
      </button>

    </div>

  </div>


  <script>

    let scanner = null;

    let firstDetection = null;

    let detectedText = null;

    let scanConfirmed = false;

    const HOLD_TIME = 600;


    async function startScanner() {

      scanner = new Html5Qrcode("reader");


      try {

        await scanner.start(

          {
            facingMode: "environment"
          },

          {
            fps: 30,

            qrbox: {
              width: 250,
              height: 250
            },

            disableFlip: false
          },

          async function(decodedText) {

            if (scanConfirmed) {
              return;
            }


            /*
              QR FIRST DETECTED
            */

            if (firstDetection === null) {

              firstDetection = Date.now();

              detectedText = decodedText;

              document.getElementById(
                "hold-still"
              ).style.display = "block";

              return;
            }


            /*
              DIFFERENT QR
            */

            if (decodedText !== detectedText) {

              firstDetection = Date.now();

              detectedText = decodedText;

              document.getElementById(
                "hold-still"
              ).style.display = "block";

              return;
            }


            /*
              QR CONFIRMED
            */

            if (
              Date.now() - firstDetection
              >= HOLD_TIME
            ) {

              scanConfirmed = true;


              /*
                Hide the Hold Still text.
              */

              document.getElementById(
                "hold-still"
              ).style.display = "none";


              /*
                Turn the camera OFF.
              */

              if (scanner) {

                try {

                  await scanner.stop();

                }
                catch (error) {

                  console.error(
                    "CAMERA STOP ERROR:",
                    error
                  );

                }

              }


              /*
                Hide ALL scanner UI.
              */

              document.getElementById(
                "reader"
              ).style.display = "none";

              document.getElementById(
                "scan-box"
              ).style.display = "none";

              document.getElementById(
                "loading"
              ).style.display = "none";


              /*
                Show Rescan button.
              */

              document.getElementById(
                "rescan"
              ).style.display = "block";


              /*
                Open scanned website
                in a new tab.
              */

              let url = decodedText;


              if (
                !url.startsWith("http://") &&
                !url.startsWith("https://")
              ) {

                url = "https://" + url;

              }


              window.open(
                url,
                "_blank"
              );

            }

          },

          function(errorMessage) {

            /*
              Ignore normal scanning errors.
            */

          }

        );


        document.getElementById("loading")
          .style.display = "none";

      }

      catch(error) {

        console.error(
          "CAMERA ERROR:",
          error
        );

        document.getElementById("loading")
          .style.display = "none";

      }

    }


    /*
      RESCAN

      Refreshes the entire page,
      starting the camera again.
    */

    function rescan() {

      window.location.reload();

    }


    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>
</html>
