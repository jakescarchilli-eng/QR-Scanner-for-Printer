<!--
  PRINTER SCANNER 5000
  VERSION: 5.2

  NEW IN 5.2:
  - Home screen is now the startup screen
  - Small tap-friendly home icon
  - Large app-style Home menu
  - Start Scanning button
  - QR / Barcode scanner modes
  - Barcode mode uses a rectangular scan region
  - QR mode uses a square 250x250 scan region
  - Barcode and QR catalog
  - Custom names for scanned codes
  - Custom names are shown when codes are scanned again
  - Catalog search
  - Catalog sorting
  - QR / Barcode filtering
  - Original code remains visible with custom name
  - Catalog saved locally
  - Existing features retained
-->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Printer Scanner 5000</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #000;

  overflow: hidden;

  font-family: Arial, sans-serif;
}

body {
  color: white;
}

#app {

  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  background: #000;
}


/* =========================================================
   TOP BAR
========================================================= */

#top-bar {

  position: relative;

  width: 100%;
  height: 65px;

  flex-shrink: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #000;

  z-index: 1000;
}

#site-title {

  color: white;

  font-size: 24px;

  font-weight: 700;

  text-align: center;

  white-space: nowrap;

  user-select: none;
}


/* =========================================================
   SMALL HOME ICON
========================================================= */

#home-button {

  position: absolute;

  left: 10px;
  top: 50%;

  transform:
    translateY(-50%);

  width: 38px;
  height: 38px;

  border: none;

  border-radius: 11px;

  background: #222;

  color: white;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 3000;

  padding: 0;
}

#home-button:active {

  transform:
    translateY(-50%)
    scale(.90);
}


/* Simple black-and-white house */

.house-icon {

  position: relative;

  width: 20px;
  height: 20px;

  display: block;
}

.house-icon::before {

  content: "";

  position: absolute;

  left: 3px;
  top: 8px;

  width: 14px;
  height: 10px;

  background: currentColor;

  border-radius: 2px;
}

.house-icon::after {

  content: "";

  position: absolute;

  left: 3px;
  top: 2px;

  width: 14px;
  height: 14px;

  background: currentColor;

  clip-path:
    polygon(
      50% 0%,
      100% 42%,
      100% 58%,
      0% 58%,
      0% 42%
    );
}

.house-door {

  position: absolute;

  left: 8px;
  bottom: 1px;

  width: 4px;
  height: 7px;

  background: #222;

  z-index: 2;

  border-radius: 1px;
}


/* =========================================================
   PAGE SYSTEM
========================================================= */

.page {

  position: absolute;

  inset: 0;

  display: none;

  background: #000;
}

.page.active {
  display: block;
}


/* =========================================================
   HOME PAGE
========================================================= */

#home-page {

  position: absolute;

  inset: 0;

  overflow-y: auto;

  padding:
    85px 18px 30px;

  background: #000;
}

.home-container {

  width: min(900px, 100%);

  margin: 0 auto;
}

.home-title {

  color: white;

  font-size: 38px;

  font-weight: 800;

  text-align: center;

  margin:
    10px 0 8px;
}

.home-subtitle {

  color: #888;

  text-align: center;

  font-size: 15px;

  margin:
    0 0 30px;
}

.home-grid {

  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 14px;

  width: 100%;
}

.home-app {

  min-height: 145px;

  border:
    1px solid #333;

  border-radius: 22px;

  background: #111;

  color: white;

  cursor: pointer;

  padding: 20px;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 10px;

  transition:
    transform .12s,
    background .12s;
}

.home-app:hover {
  background: #181818;
}

.home-app:active {

  transform:
    scale(.97);

  background: #222;
}

.home-app.primary {

  grid-column:
    1 / -1;

  min-height: 165px;

  background: white;

  color: black;

  border-color: white;
}

.home-app.primary:hover {
  background: #eee;
}

.home-app.primary:active {
  background: #ddd;
}

.home-app-icon {

  width: 48px;
  height: 48px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 15px;

  background: #222;

  color: white;

  font-size: 25px;

  font-weight: 700;
}

.home-app.primary
.home-app-icon {

  background: black;

  color: white;
}

.home-app-title {

  font-size: 20px;

  font-weight: 800;

  text-align: center;
}

.home-app-description {

  font-size: 12px;

  color: #888;

  text-align: center;
}

.home-app.primary
.home-app-description {

  color: #555;
}

.home-version {

  text-align: center;

  color: #555;

  font-size: 10px;

  margin-top: 25px;
}


/* =========================================================
   CAMERA PAGE
========================================================= */

#scanner-page {

  position: absolute;

  inset: 0;

  display: none;

  background: #000;
}

#scanner-page.active {
  display: block;
}

#camera {

  position: absolute;

  left: 0;
  right: 0;
  top: 0;
  bottom: 0;

  overflow: hidden;

  border-radius:
    28px 28px 0 0;

  background: #000;

  z-index: 1;
}

#reader {

  position: absolute;

  inset: 0;

  width: 100% !important;
  height: 100% !important;

  border: none !important;

  overflow: hidden;

  z-index: 4;
}

#reader video {

  width: 100% !important;
  height: 100% !important;

  object-fit: cover !important;

  display: block !important;
}

#reader__dashboard,
#reader__header_message {

  display: none !important;
}


/* =========================================================
   SCAN REGIONS
========================================================= */

#reader__scan_region {

  position: absolute !important;

  left: 50% !important;
  top: 50% !important;

  transform:
    translate(-50%, -50%) !important;

  margin: 0 !important;

  padding: 0 !important;

  border: none !important;

  overflow: hidden !important;

  pointer-events: none !important;
}


/* QR MODE */

body.qr-mode
#reader__scan_region {

  width: 250px !important;
  height: 250px !important;

  min-width: 250px !important;
  min-height: 250px !important;

  max-width: 250px !important;
  max-height: 250px !important;
}


/* BARCODE MODE */

body.barcode-mode
#reader__scan_region {

  width: 330px !important;
  height: 145px !important;

  min-width: 330px !important;
  min-height: 145px !important;

  max-width: 330px !important;
  max-height: 145px !important;
}

#reader__scan_region img {
  display: none !important;
}


/* =========================================================
   SCAN BOX
========================================================= */

#scan-box {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  pointer-events: none;

  z-index: 20;

  border:
    3px solid white;
}


/* QR */

body.qr-mode
#scan-box {

  width: 250px;
  height: 250px;

  border-radius: 18px;
}


/* BARCODE */

body.barcode-mode
#scan-box {

  width: 330px;
  height: 145px;

  border-radius: 12px;

  border-width: 3px;
}


/* =========================================================
   MODE LABEL
========================================================= */

#mode-label {

  position: absolute;

  left: 50%;

  top: 85px;

  transform:
    translateX(-50%);

  z-index: 40;

  padding:
    8px 16px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.7);

  color: white;

  font-size: 13px;

  font-weight: 700;

  white-space: nowrap;
}


/* =========================================================
   STATUS
========================================================= */

#status-bar {

  position: absolute;

  left: 50%;

  top:
    calc(50% - 185px);

  transform:
    translateX(-50%);

  z-index: 40;

  padding:
    9px 18px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  color: white;

  font-size: 14px;

  font-weight: 600;

  white-space: nowrap;
}

body.barcode-mode
#status-bar {

  top:
    calc(50% - 115px);
}

#status-bar.detected {

  background:
    rgba(255,170,0,.8);
}


/* =========================================================
   HOLD STILL
========================================================= */

#hold-still {

  position: absolute;

  left: 50%;

  top:
    calc(50% + 155px);

  transform:
    translateX(-50%);

  z-index: 30;

  padding:
    9px 16px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  color: white;

  font-size: 15px;

  font-weight: 600;

  white-space: nowrap;

  display: none;
}


/* =========================================================
   CONTROL BAR
========================================================= */

#control-bar {

  position: absolute;

  left: 50%;
  bottom: 45px;

  transform:
    translateX(-50%);

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  width: min(94%, 600px);
}


/* =========================================================
   ZOOM
========================================================= */

#zoom-container {

  height: 48px;

  flex: 1;

  min-width: 180px;
  max-width: 350px;

  padding:
    10px 16px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  display: flex;

  align-items: center;

  gap: 10px;
}

#zoom-label {

  color: white;

  font-size: 13px;

  font-weight: 600;

  white-space: nowrap;
}

#zoom-slider {

  width: 100%;
  height: 5px;

  accent-color: white;

  cursor: pointer;
}

#zoom-value {

  min-width: 35px;

  color: white;

  font-size: 13px;

  text-align: right;
}


/* =========================================================
   CIRCLE BUTTONS
========================================================= */

.circle-button {

  width: 48px;
  height: 48px;

  flex-shrink: 0;

  border-radius: 50%;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;
}

.circle-button:active {

  transform:
    scale(.9);
}

.circle-button.active {

  background: white;

  color: black;

  border:
    2px solid white;
}

.circle-button:not(.active) {

  background: black;

  color: white;

  border:
    2px solid white;
}


/* =========================================================
   ICONS
========================================================= */

.icon {

  position: relative;

  display: block;

  width: 22px;
  height: 22px;

  color: currentColor;

  pointer-events: none;
}

.flashlight-icon::before {

  content: "";

  position: absolute;

  left: 7px;
  top: 2px;

  width: 9px;
  height: 15px;

  border:
    2px solid currentColor;

  border-radius: 3px;
}

.flashlight-icon::after {

  content: "";

  position: absolute;

  left: 8px;
  bottom: 1px;

  width: 7px;
  height: 5px;

  border-left:
    2px solid currentColor;

  border-right:
    2px solid currentColor;
}

.sound-icon::before {

  content: "";

  position: absolute;

  left: 2px;
  top: 8px;

  width: 7px;
  height: 7px;

  background:
    currentColor;

  border-radius: 1px;
}

.sound-icon::after {

  content: "";

  position: absolute;

  left: 7px;
  top: 4px;

  width: 9px;
  height: 14px;

  background:
    currentColor;

  clip-path:
    polygon(
      0 35%,
      35% 35%,
      100% 0,
      100% 100%,
      35% 65%,
      0 65%
    );
}


/* =========================================================
   LOADING
========================================================= */

#loading {

  position: absolute;

  inset: 0;

  background: #000;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 50;
}

.spinner {

  width: 28px;
  height: 28px;

  border:
    3px solid #333;

  border-top:
    3px solid white;

  border-radius: 50%;

  animation:
    spin .6s linear infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================================================
   RESULT
========================================================= */

#result-text {

  position: absolute;

  left: 50%;
  top: 18%;

  transform:
    translateX(-50%);

  z-index: 50;

  width: 90%;

  max-width: 700px;

  color: white;

  font-size: 34px;

  font-weight: 700;

  text-align: center;

  line-height: 1.25;

  display: none;
}

#result-code {

  position: absolute;

  left: 50%;
  top: 43%;

  transform:
    translateX(-50%);

  z-index: 50;

  width: 90%;

  max-width: 700px;

  color: #999;

  font-size: 15px;

  text-align: center;

  word-break: break-all;

  display: none;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.action-button {

  position: absolute;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 50;

  border: none;

  padding:
    18px 38px;

  border-radius: 999px;

  background: white;

  color: #111;

  font-size: 20px;

  font-weight: 600;

  cursor: pointer;
}

.action-button:active {

  transform:
    translateX(-50%)
    scale(.95);
}

#open-button {

  top: 55%;

  display: none;
}

#rescan {

  top: 70%;

  display: none;
}


/* =========================================================
   VERSION
========================================================= */

#version-number {

  position: absolute;

  left: 50%;
  bottom: 6px;

  transform:
    translateX(-50%);

  z-index: 100;

  color:
    rgba(255,255,255,.45);

  font-size: 9px;

  pointer-events: none;
}


/* =========================================================
   GENERIC FULL PAGE
========================================================= */

.full-page {

  position: absolute;

  inset: 0;

  overflow-y: auto;

  padding:
    90px 18px 35px;

  background: #000;
}

.page-container {

  width: min(900px, 100%);

  margin: 0 auto;
}

.page-title {

  color: white;

  text-align: center;

  font-size: 32px;

  font-weight: 800;

  margin:
    0 0 8px;
}

.page-subtitle {

  color: #888;

  text-align: center;

  margin:
    0 0 25px;

  font-size: 14px;
}

.back-button {

  display: block;

  width: min(500px, 100%);

  margin:
    0 auto 18px;

  padding: 14px;

  border: none;

  border-radius: 14px;

  background: #222;

  color: white;

  font-size: 16px;

  font-weight: 700;

  cursor: pointer;
}


/* =========================================================
   CATALOG
========================================================= */

#catalog-page {
  display: none;
}

#catalog-page.active {
  display: block;
}

.catalog-tools {

  width: 100%;

  display: flex;

  flex-direction: column;

  gap: 10px;

  margin-bottom: 18px;
}

.catalog-input,
.catalog-select {

  width: 100%;

  padding: 14px;

  border:
    1px solid #444;

  border-radius: 13px;

  background: #111;

  color: white;

  font-size: 15px;

  outline: none;
}

.catalog-input:focus,
.catalog-select:focus {

  border-color: white;
}

.catalog-list {

  display: flex;

  flex-direction: column;

  gap: 10px;
}

.catalog-item {

  background: #111;

  border:
    1px solid #333;

  border-radius: 17px;

  padding: 15px;
}

.catalog-item-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;
}

.catalog-item-name {

  font-size: 19px;

  font-weight: 800;

  color: white;
}

.catalog-type {

  padding:
    5px 9px;

  border-radius: 999px;

  background: #222;

  color: #aaa;

  font-size: 10px;

  font-weight: 700;

  white-space: nowrap;
}

.catalog-code {

  margin-top: 8px;

  color: #aaa;

  font-size: 12px;

  word-break: break-all;

  line-height: 1.4;
}

.catalog-date {

  margin-top: 6px;

  color: #555;

  font-size: 10px;
}

.catalog-actions {

  display: flex;

  gap: 7px;

  margin-top: 12px;
}

.catalog-action {

  flex: 1;

  border: none;

  border-radius: 10px;

  padding: 10px;

  background: #222;

  color: white;

  font-weight: 700;

  cursor: pointer;
}

.catalog-action.delete {

  background: #321515;

  color: #ffaaaa;
}

.catalog-empty {

  padding: 30px;

  text-align: center;

  color: #777;

  background: #111;

  border-radius: 17px;
}


/* =========================================================
   NAME DIALOG
========================================================= */

#name-dialog {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.75);

  z-index: 5000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

#name-dialog-box {

  width: min(450px, 100%);

  background: #111;

  border:
    1px solid #444;

  border-radius: 20px;

  padding: 22px;
}

#name-dialog-title {

  color: white;

  font-size: 22px;

  font-weight: 800;

  margin-bottom: 8px;
}

#name-dialog-code {

  color: #888;

  font-size: 11px;

  word-break: break-all;

  margin-bottom: 15px;
}

#name-input {

  width: 100%;

  padding: 14px;

  border:
    1px solid #444;

  border-radius: 12px;

  background: #000;

  color: white;

  font-size: 16px;

  outline: none;
}

.dialog-buttons {

  display: flex;

  gap: 8px;

  margin-top: 12px;
}

.dialog-button {

  flex: 1;

  border: none;

  border-radius: 12px;

  padding: 13px;

  background: #222;

  color: white;

  font-weight: 700;

  cursor: pointer;
}

.dialog-button.save {

  background: white;

  color: black;
}


/* =========================================================
   HISTORY
========================================================= */

#history-panel {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: min(90%, 420px);

  max-height: 75%;

  overflow-y: auto;

  padding: 16px;

  background: #111;

  border:
    1px solid #333;

  border-radius: 20px;

  z-index: 500;

  display: none;
}

#history-title {

  color: white;

  font-size: 20px;

  font-weight: 700;

  margin-bottom: 12px;
}

.history-item {

  padding: 12px;

  margin: 6px 0;

  background: #222;

  border-radius: 12px;

  color: white;

  cursor: pointer;
}

.history-name {
  font-weight: 700;
}

.history-url {

  margin-top: 4px;

  font-size: 11px;

  color: #aaa;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.history-time {

  margin-top: 4px;

  font-size: 10px;

  color: #777;
}

.history-close {

  width: 100%;

  margin-top: 10px;

  border: none;

  border-radius: 12px;

  padding: 12px;

  background: #333;

  color: white;

  font-weight: 600;
}


/* =========================================================
   NOTES
========================================================= */

#notes-panel {

  position: absolute;

  inset: 0;

  z-index: 2000;

  background: #000;

  padding:
    90px 20px 30px;

  overflow-y: auto;

  display: none;

  pointer-events: none;
}

#notes-title {

  color: white;

  font-size: 30px;

  font-weight: 700;

  text-align: center;

  margin-bottom: 30px;
}

.note-section {

  width: 100%;

  max-width: 600px;

  margin:
    0 auto 22px;
}

.note-section label {

  display: block;

  color: white;

  font-size: 18px;

  font-weight: 700;

  margin-bottom: 8px;
}

.status-select {

  width: 100%;

  padding:
    14px 16px;

  border:
    2px solid #444;

  border-radius: 14px;

  background: #111;

  color: white;

  font-size: 17px;

  font-weight: 600;

  outline: none;

  cursor: pointer;
}

.notes-save,
.notes-back {

  position: relative;

  left: auto;
  top: auto;

  transform: none;

  display: block;

  width: min(90%, 400px);

  margin:
    12px auto;
}


/* =========================================================
   DEV PANEL
========================================================= */

#dev-panel {

  display: none;

  width: 100%;

  height: 50%;

  flex-shrink: 0;

  background: #000;

  border-top:
    2px solid #333;

  color: white;

  overflow: hidden;

  flex-direction: column;
}

#dev-header {

  height: 40px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  padding-left: 14px;

  background: #111;

  border-bottom:
    1px solid #333;

  font-size: 14px;

  font-weight: 700;
}

#dev-output {

  flex: 1;

  overflow-y: auto;

  padding: 10px;

  font-family:
    "Courier New",
    monospace;

  font-size: 12px;

  line-height: 1.5;

  white-space: pre-wrap;

  word-break: break-word;
}

.dev-line {
  margin-bottom: 3px;
}

#dev-stats {

  padding: 10px;

  border-top:
    1px solid #333;

  background: #111;

  color: #aaa;

  font-family:
    "Courier New",
    monospace;

  font-size: 11px;
}

#dev-buttons {

  display: flex;

  gap: 6px;

  padding: 8px;

  background: #111;
}

.dev-button {

  flex: 1;

  border: none;

  border-radius: 8px;

  padding: 8px;

  background: #222;

  color: white;

  font-size: 11px;
}


/* =========================================================
   LIGHT MODE

<script>

/* =========================================================
   VARIABLES
========================================================= */

let scanner = null;

let scannerRunning = false;

let scannerMode =
  localStorage.getItem(
    "scannerMode"
  ) || "qr";

let firstDetection = null;

let detectedText = null;

let scanConfirmed = false;

let scannedURL = null;

let scannedFormat = null;

let isPrinterLink = false;

let cameraTrack = null;

let devMode = false;

let lightMode = false;

let flashlightOn = false;

let soundEnabled = true;

let scanCount = 0;

let successfulScans = 0;

let failedScans = 0;

let scanStartTime = null;

let lastScanTime = 0;

let editingCatalogCode = null;

const HOLD_TIME = 600;

const QR_SIZE = 250;

const BARCODE_WIDTH = 330;

const BARCODE_HEIGHT = 145;


/* =========================================================
   DEV LOG
========================================================= */

function devLog(message) {

  const output =
    document.getElementById(
      "dev-output"
    );

  if (!output) return;

  const line =
    document.createElement(
      "div"
    );

  line.className =
    "dev-line";

  line.textContent =
    "[" +
    new Date().toLocaleTimeString() +
    "] " +
    message;

  output.appendChild(line);

  output.scrollTop =
    output.scrollHeight;

  updateStats();
}


function updateStats() {

  const stats =
    document.getElementById(
      "dev-stats"
    );

  if (!stats) return;

  stats.textContent =
    "Scans: " +
    scanCount +
    " | Successful: " +
    successfulScans +
    " | Failed: " +
    failedScans +
    " | Last scan: " +
    lastScanTime +
    " ms";
}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function hideAllPages() {

  document
    .querySelectorAll(".page")
    .forEach(
      page => {
        page.classList.remove(
          "active"
        );
      }
    );
}


function goHome() {

  stopScanner();

  hideAllPages();

  document
    .getElementById(
      "home-page"
    )
    .classList.add(
      "active"
    );

  document
    .getElementById(
      "top-bar"
    )
    .style.display =
    "flex";

  document
    .getElementById(
      "site-title"
    )
    .textContent =
    "Printer Scanner 5000";

  document
    .getElementById(
      "dev-panel"
    )
    .style.display =
    devMode
      ? "flex"
      : "none";

  devLog(
    "Returned to Home"
  );
}


/* =========================================================
   START SCANNING
========================================================= */

function startScanning() {

  hideAllPages();

  document
    .getElementById(
      "scanner-page"
    )
    .classList.add(
      "active"
    );

  document
    .getElementById(
      "top-bar"
    )
    .style.display =
    "flex";

  resetScannerInterface();

  applyScannerMode();

  startScanner();

}


/* =========================================================
   SELECT SCANNER MODE
========================================================= */

function selectScannerMode(mode) {

  scannerMode =
    mode === "barcode"
      ? "barcode"
      : "qr";

  localStorage.setItem(
    "scannerMode",
    scannerMode
  );

  devLog(
    "Scanner mode changed to " +
    scannerMode
  );

  startScanning();
}


/* =========================================================
   APPLY SCANNER MODE
========================================================= */

function applyScannerMode() {

  document.body.classList.toggle(
    "qr-mode",
    scannerMode === "qr"
  );

  document.body.classList.toggle(
    "barcode-mode",
    scannerMode === "barcode"
  );


  const label =
    document.getElementById(
      "mode-label"
    );


  if (scannerMode === "barcode") {

    label.textContent =
      "Barcode Mode";

  } else {

    label.textContent =
      "QR Mode";

  }


  positionScanRegion();
}


/* =========================================================
   RESET SCANNER INTERFACE
========================================================= */

function resetScannerInterface() {

  scanConfirmed =
    false;

  firstDetection =
    null;

  detectedText =
    null;

  scannedURL =
    null;

  scannedFormat =
    null;

  isPrinterLink =
    false;

  flashlightOn =
    false;

  document.getElementById(
    "reader"
  ).style.display =
    "block";

  document.getElementById(
    "scan-box"
  ).style.display =
    "block";

  document.getElementById(
    "control-bar"
  ).style.display =
    "flex";

  document.getElementById(
    "status-bar"
  ).style.display =
    "block";

  document.getElementById(
    "hold-still"
  ).style.display =
    "none";

  document.getElementById(
    "result-text"
  ).style.display =
    "none";

  document.getElementById(
    "result-code"
  ).style.display =
    "none";

  document.getElementById(
    "open-button"
  ).style.display =
    "none";

  document.getElementById(
    "rescan"
  ).style.display =
    "none";

  document.getElementById(
    "version-number"
  ).style.display =
    "block";

  document.getElementById(
    "loading"
  ).style.display =
    "flex";

  document.getElementById(
    "flashlight-button"
  ).classList.remove(
    "active"
  );

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner() {

  if (!scanner) {

    scannerRunning =
      false;

    return;

  }


  try {

    if (scannerRunning) {

      await scanner.stop();

    }

  } catch(error) {

    devLog(
      "Scanner stop: " +
      error.message
    );

  }


  try {

    scanner.clear();

  } catch {}


  scanner =
    null;

  scannerRunning =
    false;

  cameraTrack =
    null;

}


/* =========================================================
   CATALOG STORAGE
========================================================= */

function getCatalog() {

  try {

    return JSON.parse(

      localStorage.getItem(
        "printerScannerCatalog"
      )

    ) || [];

  } catch {

    return [];

  }

}


function saveCatalog(catalog) {

  localStorage.setItem(

    "printerScannerCatalog",

    JSON.stringify(
      catalog
    )

  );
}


/* =========================================================
   FIND CATALOG ENTRY
========================================================= */

function findCatalogEntry(code) {

  const catalog =
    getCatalog();

  return catalog.find(
    item =>
      item.code === code
  ) || null;
}


/* =========================================================
   ADD CODE TO CATALOG
========================================================= */

function addToCatalog(
  code,
  type
) {

  const catalog =
    getCatalog();

  const existing =
    catalog.find(
      item =>
        item.code === code
    );


  if (existing) {

    existing.lastScanned =
      Date.now();

    saveCatalog(
      catalog
    );

    return existing;

  }


  const entry = {

    code:
      code,

    type:
      type,

    name:
      "",

    firstScanned:
      Date.now(),

    lastScanned:
      Date.now()

  };


  catalog.unshift(
    entry
  );


  saveCatalog(
    catalog
  );


  devLog(
    "Added " +
    type +
    " to catalog"
  );


  return entry;
}


/* =========================================================
   GET DISPLAY NAME
========================================================= */

function getCatalogDisplayName(code) {

  const entry =
    findCatalogEntry(
      code
    );


  if (
    entry &&
    entry.name &&
    entry.name.trim()
  ) {

    return entry.name.trim();

  }


  return null;
}


/* =========================================================
   OPEN CATALOG
========================================================= */

function openCatalog() {

  stopScanner();

  hideAllPages();

  document
    .getElementById(
      "catalog-page"
    )
    .classList.add(
      "active"
    );

  renderCatalog();

  devLog(
    "Opened Code Catalog"
  );
}


/* =========================================================
   RENDER CATALOG
========================================================= */

function renderCatalog() {

  const list =
    document.getElementById(
      "catalog-list"
    );

  if (!list)
    return;


  let catalog =
    getCatalog();


  const search =
    (
      document.getElementById(
        "catalog-search"
      ).value || ""
    )
      .trim()
      .toLowerCase();


  const filter =
    document.getElementById(
      "catalog-filter"
    ).value;


  const sort =
    document.getElementById(
      "catalog-sort"
    ).value;


  catalog =
    catalog.filter(
      item => {

        const matchesSearch =

          !search ||

          item.code
            .toLowerCase()
            .includes(search) ||

          (
            item.name || ""
          )
            .toLowerCase()
            .includes(search);


        const matchesFilter =

          filter === "all" ||

          item.type === filter;


        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );


  catalog.sort(
    (a,b) => {

      if (
        sort === "name"
      ) {

        return (
          (a.name || a.code)
            .localeCompare(
              b.name || b.code
            )
        );

      }


      if (
        sort === "nameReverse"
      ) {

        return (
          (b.name || b.code)
            .localeCompare(
              a.name || a.code
            )
        );

      }


      if (
        sort === "code"
      ) {

        return a.code.localeCompare(
          b.code
        );

      }


      if (
        sort === "oldest"
      ) {

        return (
          a.firstScanned -
          b.firstScanned
        );

      }


      return (
        b.firstScanned -
        a.firstScanned
      );

    }
  );


  list.innerHTML =
    "";


  if (
    catalog.length === 0
  ) {

    list.innerHTML =

      '<div class="catalog-empty">' +

      "No codes found." +

      "<br><br>" +

      "Scan a QR code or barcode and it will appear here." +

      "</div>";

    return;

  }


  catalog.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "catalog-item";


      const displayName =
        item.name &&
        item.name.trim()
          ? item.name
          : "Unnamed Code";


      const typeLabel =
        item.type === "barcode"
          ? "BARCODE"
          : "QR CODE";


      div.innerHTML =

        '<div class="catalog-item-header">' +

          '<div class="catalog-item-name">' +

            escapeHTML(
              displayName
            ) +

          "</div>" +

          '<div class="catalog-type">' +

            typeLabel +

/* =========================================================

========================================================= */

function deleteCatalogCode(
  encodedCode
) {

  const code =
    decodeURIComponent(
      encodedCode
    );


  const catalog =
    getCatalog();


  const filtered =
    catalog.filter(
      item =>
        item.code !== code
    );


  saveCatalog(
    filtered

  devLog(
    "Removed code from catalog"
  );


  renderCatalog();
}

/* =========================================================
   SITE NAME
========================================================= */

function getSiteName(url) {

  try {

    let fixedURL =
      url;


    if (

      !fixedURL.startsWith(
        "http://"
      )

      &&

      !fixedURL.startsWith(
        "https://"
      )

    ) {

      fixedURL =
        "https://" +
        fixedURL;

    }


    const parsed =
      new URL(
        fixedURL
      );


    let hostname =
      parsed.hostname.replace(
        /^www\./,
        ""
      );


    const knownSites = {

      "youtube.com":
        "YouTube",

      "google.com":
        "Google",

      "github.com":
        "GitHub",

      "amazon.com":
        "Amazon",

      "apple.com":
        "Apple",

      "facebook.com":
        "Facebook",

      "instagram.com":
        "Instagram",

      "tiktok.com":
        "TikTok",

      "reddit.com":
        "Reddit",

      "microsoft.com":
        "Microsoft",

      "bambulab.com":
        "Bambu Lab",

      "makerworld.com":
        "MakerWorld"

    };


    if (
      knownSites[hostname]
    ) {

      return knownSites[
        hostname
      ];

    }


    const parts =
      hostname.split(".");


    if (
      parts.length >= 2
    ) {

      const name =
        parts[
          parts.length - 2
        ];


      return (

        name
          .charAt(0)
          .toUpperCase() +

        name.slice(1)

      );

    }


    return hostname;


  } catch {

    return "Code Found";

  }

}


/* =========================================================
   QR TEXT
========================================================= */

function getQRText(url) {

  try {

    const parsedURL =
      new URL(

        url.startsWith("http")
          ? url
          : "https://" + url

      );


    const cleanURL =
      parsedURL.origin +
      parsedURL.pathname;


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1166269606"

    ) {

      isPrinterLink =
        true;

      return "TOYBOX Found";

    }


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1658133862"

    ) {

      isPrinterLink =
        true;

      return "Ender 3 Found";

    }


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1625671285"

    ) {

      isPrinterLink =
        true;

      return "This is to print with the H2D";

    }


    if (

      parsedURL.origin ===
      "https://makerworld.com"

      &&

      parsedURL.pathname ===
      "/en"

    ) {

      isPrinterLink =
        false;

      return "This opens MakerWorld, which is for the H2D";

    }


    isPrinterLink =
      false;


    return getSiteName(
      url
    );


  } catch {

    isPrinterLink =
      false;

    return "QR Code Found";

  }

}

/* =========================================================
   START SCANNER
========================================================= */

async function startScanner() {

  await stopScanner();


  scanStartTime =
    Date.now();


  resetScannerInterface();


  applyScannerMode();


  const status =
    document.getElementById(
      "status-bar"
    );


  status.textContent =
    scannerMode === "barcode"
      ? "Starting barcode scanner..."
      : "Starting QR scanner...";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  let formats;


  if (
    scannerMode ===
    "barcode"
  ) {

    formats = [

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.CODABAR,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.ITF,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E

    ];

  } else {

    formats = [

      Html5QrcodeSupportedFormats.QR_CODE

    ];

  }


  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {

        fps:
          scannerMode === "barcode"
            ? 20
            : 30,

        qrbox:

          scannerMode === "barcode"

            ? {
                width:
                  BARCODE_WIDTH,

                height:
                  BARCODE_HEIGHT
              }

            : {
                width:
                  QR_SIZE,

                height:
                  QR_SIZE
              },

        formatsToSupport:
          formats,

        disableFlip:
          false

      },


      async function(decodedText) {

        if (
          scanConfirmed
        ) {

          return;

        }


        status.textContent =
          scannerMode === "barcode"
            ? "Barcode detected"
            : "QR detected";


        status.className =
          "detected";


        reacquireCameraTrack();


        if (
          firstDetection ===
          null
        ) {

          firstDetection =
            Date.now();

          detectedText =
            decodedText;


          document.getElementById(
            "hold-still"
          ).style.display =
            "block";


          return;

        }


        if (
          decodedText !==
          detectedText
        ) {

          firstDetection =
            Date.now();

          detectedText =
            decodedText;

          return;

        }


        if (

          Date.now() -
          firstDetection >=
          HOLD_TIME

        ) {

          scanConfirmed =
            true;


          scannedURL =
            decodedText;


          scannedFormat =
            getFormatType();


          successfulScans++;

          scanCount++;


          lastScanTime =
            Date.now() -
            scanStartTime;


          playScanSound();


          const catalogEntry =
            addToCatalog(
              decodedText,
              scannedFormat
            );


          const result =
            getResultDisplay(
              decodedText
            );


          saveHistory(
            decodedText,
            result.title
          );


          document.getElementById(
            "status-bar"
          ).style.display =
            "none";


          document.getElementById(
            "hold-still"
          ).style.display =
            "none";


          document.getElementById(
            "control-bar"
          ).style.display =
            "none";


          document.getElementById(
            "version-number"
          ).style.display =
            "none";


          try {

            await scanner.stop();

          } catch {}


          scannerRunning =
            false;


          cameraTrack =
            null;


          document.getElementById(
            "reader"
          ).style.display =
            "none";


          document.getElementById(
            "scan-box"
          ).style.display =
            "none";


          document.getElementById(
            "result-text"
          ).textContent =
            result.title;


          document.getElementById(
            "result-text"
          ).style.display =
            "block";


          document.getElementById(
            "result-code"
          ).textContent =
            "Code: " +
            result.code;


          document.getElementById(
            "result-code"
          ).style.display =
            "block";


          const openButton =
            document.getElementById(
              "open-button"
            );


          if (
            scannedFormat ===
            "barcode"
          ) {

            openButton.textContent =
              "Open Code";

          } else {

            openButton.textContent =
              isPrinterLink
                ? "Print"
                : "Open";

          }


          openButton.style.display =
            "block";


          document.getElementById(
            "rescan"
          ).style.display =
            "block";


          devLog(

            (
              scannerMode ===
              "barcode"
                ? "Barcode"
                : "QR"
            ) +

            " accepted: " +

            result.title +

            " | Code: " +

            decodedText

          );

        }

      },


      function() {}

    );


    scannerRunning =
      true;


    setTimeout(
      positionScanRegion,
      100
    );

    setTimeout(
      positionScanRegion,
      300
    );

    setTimeout(
      positionScanRegion,
      700
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    status.textContent =
      scannerMode === "barcode"
        ? "Ready to scan barcode"
        : "Ready to scan QR code";


    status.className =
      "";


    setTimeout(
      reacquireCameraTrack,
      700
    );


    devLog(

      scannerMode === "barcode"
        ? "Barcode scanner started"
        : "QR scanner started"

    );


  } catch(error) {

    failedScans++;


    scannerRunning =
      false;


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    status.textContent =
      "Camera unavailable";


    devLog(
      "CAMERA ERROR: " +
      error.message
    );

  }

}


/* =========================================================
   CAMERA TRACK RECOVERY
========================================================= */

function reacquireCameraTrack() {

  const video =
    document.querySelector(
      "#reader video"
    );


  if (
    video &&
    video.srcObject
  ) {

    const tracks =
      video.srcObject
        .getVideoTracks();


    if (
      tracks.length > 0
    ) {

      cameraTrack =
        tracks[0];

      return true;

    }

  }


  return false;
}


/* =========================================================
   FLASHLIGHT
========================================================= */

async function toggleFlashlight() {

  if (!cameraTrack) {

    reacquireCameraTrack();

  }


  if (!cameraTrack) {

    devLog(
      "Flashlight unavailable"
    );

    return;

  }


  try {

    const capabilities =
      cameraTrack.getCapabilities();


    if (
      !capabilities.torch
    ) {

      devLog(
        "Camera does not support flashlight"
      );

      return;

    }


    flashlightOn =
      !flashlightOn;


    await cameraTrack.applyConstraints({

      advanced: [

        {
          torch:
            flashlightOn
        }

      ]

    });


    document
      .getElementById(
        "flashlight-button"
      )
      .classList.toggle(
        "active",
        flashlightOn
      );


  } catch(error) {

    flashlightOn =
      false;


    devLog(
      "Flashlight error: " +
      error.message
    );

  }

}


/* =========================================================
   SOUND
========================================================= */

function toggleSound() {

  soundEnabled =
    !soundEnabled;


  document
    .getElementById(
      "sound-button"
    )
    .classList.toggle(
      "active",
      soundEnabled
    );

}


function playScanSound() {

  if (!soundEnabled)
    return;


  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext)
      return;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.frequency.value =
      scannerMode === "barcode"
        ? 660
        : 880;


    oscillator.type =
      "sine";


    gain.gain.value =
      0.08;


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.start();


    oscillator.stop(
      audio.currentTime +
      0.12
    );

  } catch {

    devLog(
      "Sound error"
    );

  }

}


/* =========================================================
   ZOOM
========================================================= */

async function setZoom(value) {

  const zoom =
    parseFloat(
      value
    );


  document.getElementById(
    "zoom-value"
  ).textContent =

    zoom.toFixed(1) +
    "×";


  if (!cameraTrack) {

    reacquireCameraTrack();

  }


  if (!cameraTrack)
    return;


  try {

    const capabilities =
      cameraTrack
        .getCapabilities();


    if (!capabilities.zoom) {

      devLog(
        "Camera does not support zoom"
      );

      return;

    }


    const actualZoom =

      capabilities.zoom.min +

      (
        (zoom - 1) / 4
      ) *

      (
        capabilities.zoom.max -
        capabilities.zoom.min
      );


    await cameraTrack.applyConstraints({

      advanced: [

        {
          zoom:
            actualZoom
        }

      ]

    });


  } catch(error) {

    devLog(
      "Zoom error: " +
      error.message
    );

  }

}

        document.getElementById(
          "dev-output"
        ).innerText
      ],

      {
        type:
          "text/plain"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    "printer-scanner-log.txt";


  link.click();


  URL.revokeObjectURL(
    url
  );

}


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer =
  null;


function keepScannerLocked() {

  clearTimeout(
    resizeTimer
  );


  resizeTimer =
    setTimeout(

      function() {

        positionScanRegion();

      },

      50

    );

}


window.addEventListener(
  "resize",
  keepScannerLocked
);


window.addEventListener(

  "orientationchange",

  function() {

    setTimeout(

      keepScannerLocked,

      100

    );

  }

);


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Escape"
    ) {

      closeNameDialog();

    }

    if (
      event.key ===
      "Enter"
    ) {

      const dialog =
        document.getElementById(
          "name-dialog"
        );


      if (
        dialog.style.display ===
        "flex"
      ) {

        saveCodeName();

      }

    }

  }
);


/* =========================================================
   STARTUP
========================================================= */

window.addEventListener(

  "load",

  function() {

    const savedLightMode =
      localStorage.getItem(
        "lightMode"
      );


    if (
      savedLightMode ===
      "on"
    ) {

      lightMode =
        true;

      document.body.classList.add(
        "light-mode"
      );

    }


    applyScannerMode();

    loadNotes();


    devLog(
      "Printer Scanner 5000"
    );

    devLog(
      "Version 5.2"
    );

    devLog(
      "Home screen startup enabled"
    );

    devLog(
      "QR / Barcode catalog enabled"
    );

    devLog(
      "Custom code names enabled"
    );

    devLog(
      "Barcode rectangular scan region enabled"
    );

  }

);

</script>

</body>

</html>
