<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Printer Scanner 5000</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    background:#000;
    color:#fff;
    overflow:hidden
}

#app{
    height:100%;
    display:flex;
    flex-direction:column
}

#top{
    height:65px;
    flex:none;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000
}

#title{
    font-size:24px;
    font-weight:bold
}

#home{
    position:absolute;
    left:12px;
    background:#222;
    color:#fff;
    border:0;
    border-radius:12px;
    width:42px;
    height:42px;
    font-size:22px
}

.menu{
    display:none;
    position:absolute;
    z-index:100;
    left:12px;
    top:58px;
    width:205px;
    background:#111;
    border:1px solid #333;
    border-radius:16px;
    padding:8px
}

.menu button{
    width:100%;
    margin:4px 0;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#222;
    color:#fff;
    font-size:16px;
    font-weight:bold
}

.menu button:active{
    background:#444
}

#camera{
    position:relative;
    flex:1;
    overflow:hidden;
    border-radius:28px 28px 0 0;
    background:#000
}

#reader{
    position:absolute;
    inset:0
}

#reader video{
    width:100%!important;
    height:100%!important;
    object-fit:cover!important
}

#reader__dashboard,
#reader__header_message{
    display:none!important
}

#scanbox{
    position:absolute;
    z-index:10;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:250px;
    height:250px;
    border:3px solid #fff;
    border-radius:18px;
    pointer-events:none
}

body.barcode #scanbox{
    width:350px;
    height:150px
}

#status{
    position:absolute;
    z-index:20;
    top:calc(50% - 185px);
    left:50%;
    transform:translateX(-50%);
    background:#000b;
    padding:9px 18px;
    border-radius:30px;
    font-weight:bold;
    white-space:nowrap
}

body.barcode #status{
    top:calc(50% - 115px)
}

#controls{
    position:absolute;
    z-index:20;
    bottom:45px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    align-items:center;
    width:min(94%,600px)
}

.circle{
    width:48px;
    height:48px;
    border-radius:50%;
    border:2px solid #fff;
    background:#000;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0
}

.circle.active{
    background:#fff;
    color:#000
}

.zoom{
    height:48px;
    flex:1;
    max-width:350px;
    min-width:180px;
    background:#000b;
    border-radius:30px;
    padding:10px 15px;
    display:flex;
    align-items:center;
    gap:10px
}

.zoom input{
    width:100%
}

.zoom span{
    font-size:13px
}

.flash{
    font-size:20px
}

#rotate{
    font-size:27px;
    line-height:1
}

#result,
#notes,
#history{
    display:none;
    position:absolute;
    inset:0;
    z-index:80;
    background:#000;
    padding:30px 20px;
    text-align:center
}

.result-name{
    font-size:34px;
    font-weight:bold;
    margin-top:12vh
}

.result-code{
    color:#aaa;
    margin:25px auto;
    max-width:90%;
    word-break:break-all
}

.action{
    border:0;
    border-radius:30px;
    background:#fff;
    color:#000;
    padding:16px 35px;
    font-size:18px;
    font-weight:bold;
    margin:10px
}

.notes-inner{
    max-width:600px;
    margin:auto
}

.notes-inner h1{
    margin-bottom:30px
}

.note{
    margin:20px 0;
    text-align:left
}

.note label{
    display:block;
    font-weight:bold;
    font-size:18px;
    margin-bottom:8px
}

.note select{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:#111;
    color:#fff;
    border:2px solid #444;
    font-size:16px
}

.history-list{
    text-align:left;
    max-width:600px;
    margin:auto;
    max-height:65vh;
    overflow:auto
}

.history-item{
    background:#222;
    padding:12px;
    border-radius:10px;
    margin:7px 0
}

.dev{
    display:none;
    height:50%;
    flex:none;
    background:#000;
    border-top:2px solid #333;
    flex-direction:column
}

.devhead{
    padding:10px;
    background:#111;
    font-weight:bold
}

.output{
    flex:1;
    overflow:auto;
    padding:10px;
    font:12px monospace;
    white-space:pre-wrap
}

.devbuttons{
    padding:8px;
    display:flex;
    gap:6px
}

.devbuttons button{
    flex:1;
    background:#222;
    color:#fff;
    border:0;
    padding:8px;
    border-radius:8px
}

body.dev #top{
    height:50px
}

body.dev #camera{
    height:calc(50% - 25px);
    flex:none
}

body.dev .dev{
    display:flex
}

.light{
    background:#eee;
    color:#000
}

.light #top{
    background:#eee;
    color:#000
}

.light #home{
    background:#ddd;
    color:#000
}

.light .menu{
    background:#eee;
    border-color:#bbb
}

.light .menu button{
    background:#ddd;
    color:#000
}

.light .zoom,
.light .circle{
    background:#fff;
    color:#000
}

.light #status{
    background:#fffc;
    color:#000
}

.light #notes,
.light #history,
.light #result{
    background:#eee;
    color:#000
}

.light .note select{
    background:#fff;
    color:#000
}
</style>
</head>

<body>

<div id="app">

<div id="top">

<button id="home">☰</button>

<div id="title">
Printer Scanner 5000
</div>

<div class="menu" id="menu">

<button onclick="printer('H2D')">
H2D
</button>

<button onclick="printer('TOYBOX')">
TOYBOX
</button>

<button onclick="printer('Ender 3')">
Ender 3
</button>

<button onclick="notes()">
Notes
</button>

<button onclick="toggleMode()">
Scanning Mode
</button>

<button onclick="location.reload()">
Refresh
</button>

<button onclick="historyPanel()">
Scan History
</button>

<button onclick="devMode()">
Dev Mode
</button>

<button onclick="lightMode()">
Light Mode
</button>

</div>

</div>

<div id="camera">

<div id="reader"></div>

<div id="scanbox"></div>

<div id="status">
Starting camera...
</div>

<div id="controls">

<!-- FLASHLIGHT -->
<button
class="circle flash"
id="flash"
title="Flashlight">
♧
</button>

<!-- CAMERA ROTATE -->
<button
class="circle"
id="rotate"
title="Rotate camera"
aria-label="Rotate camera">
↻
</button>

<!-- ZOOM -->
<div class="zoom">

Zoom

<input
id="zoom"
type="range"
min="1"
max="5"
step=".1"
value="1">

<span id="zv">
1×
</span>

</div>

<!-- SOUND -->
<button
class="circle active"
id="sound"
title="Scan sound">
◖
</button>

</div>

<!-- RESULT -->

<div id="result">

<div
class="result-name"
id="resultName">
</div>

<div
class="result-code"
id="resultCode">
</div>

<button
class="action"
id="open">
Open
</button>

<button
class="action"
onclick="location.reload()">
Rescan
</button>

</div>

<!-- NOTES -->

<div id="notes">

<div class="notes-inner">

<h1>
Printer Status
</h1>

<div class="note">

<label>
H2D status =
</label>

<select id="h2d">

<option>
Online
</option>

<option>
Printing
</option>

<option>
Offline
</option>

</select>

</div>

<div class="note">

<label>
TOYBOX status =
</label>

<select id="toy">

<option>
Online
</option>

<option>
Printing
</option>

<option>
Offline
</option>

</select>

</div>

<div class="note">

<label>
Ender 3 status =
</label>

<select id="ender">

<option>
Online
</option>

<option>
Printing
</option>

<option>
Offline
</option>

</select>

</div>

<button
class="action"
onclick="saveNotes()">
Save Status
</button>

<button
class="action"
onclick="closePanels()">
Back
</button>

</div>

</div>

<!-- HISTORY -->

<div id="history">

<h1>
Scan History
</h1>

<div
class="history-list"
id="historyList">
</div>

<button
class="action"
onclick="closePanels()">
Close
</button>

</div>

</div>

<!-- DEV MODE -->

<div class="dev">

<div class="devhead">
Developer Output
</div>

<div
class="output"
id="output">
</div>

<div class="devbuttons">

<button onclick="copyLog()">
Copy
</button>

<button onclick="clearLog()">
Clear
</button>

</div>

</div>

</div>

<script>

let mode = 'qr';

let scanner = null;

let lastURL = '';

let sound = true;

let torch = false;

/* Current camera:
   environment = rear camera
   user = front camera
*/

let facing = 'environment';

const $ = id => document.getElementById(id);


/* DEV LOG */

function log(x){

    $('output').textContent +=
    `[${new Date().toLocaleTimeString()}] ${x}\n`;

    $('output').scrollTop =
    $('output').scrollHeight;

}


/* HOME MENU */

function menu(){

    $('menu').style.display =
    $('menu').style.display === 'block'
    ? 'none'
    : 'block';

}

$('home').onclick = menu;


/* PRINTER LINKS */

function printer(name){

    $('menu').style.display = 'none';

    const urls = {

        H2D:
        'https://www.bambulab.com',

        TOYBOX:
        'https://www.make.toys/toys',

        'Ender 3':
        'https://www.creality.com'

    };

    window.open(urls[name], '_blank');

    log('Opened ' + name);

}


/* CAMERA ROTATION */

async function rotateCamera(){

    if(facing === 'environment'){

        facing = 'user';

        log('Switching to front camera');

    }else{

        facing = 'environment';

        log('Switching to rear camera');

    }

    await start();

}


/* CONNECT ROTATE BUTTON */

$('rotate').onclick = rotateCamera;


/* SCANNING MODE */

function toggleMode(){

    mode =
    mode === 'qr'
    ? 'barcode'
    : 'qr';

    document.body.classList.toggle(
        'barcode',
        mode === 'barcode'
    );

    $('menu').style.display = 'none';

    log('Mode: ' + mode);

    start();

}


/* LIGHT MODE */

function lightMode(){

    document.body.classList.toggle(
        'light'
    );

    $('menu').style.display = 'none';

    log('Light mode toggled');

}


/* DEV MODE */

function devMode(){

    document.body.classList.toggle(
        'dev'
    );

    $('menu').style.display = 'none';

    log('Dev mode toggled');

}


/* NOTES */

function notes(){

    loadNotes();

    $('notes').style.display =
    'block';

    $('menu').style.display =
    'none';

    log('Notes opened');

}


function closePanels(){

    $('notes').style.display =
    'none';

    $('history').style.display =
    'none';

}


/* SAVE PRINTER STATUS */

function saveNotes(){

    localStorage.setItem(
        'printerNotes',

        JSON.stringify({

            h2d:
            $('h2d').value,

            toy:
            $('toy').value,

            ender:
            $('ender').value

        })

    );

    log(
        'Printer statuses saved'
    );

}


/* LOAD PRINTER STATUS */

function loadNotes(){

    try{

        let x =
        JSON.parse(
            localStorage.getItem(
                'printerNotes'
            )
        );

        if(x){

            $('h2d').value =
            x.h2d;

            $('toy').value =
            x.toy;

            $('ender').value =
            x.ender;

        }

    }catch{}

}


/* HISTORY */

function historyPanel(){

    let h =
    JSON.parse(
        localStorage.getItem(
            'scanHistory'
        ) || '[]'
    );

    $('historyList').innerHTML =
    h.length

    ?

    h.map(x =>

        `<div class="history-item">

        <b>${x.name}</b>

        <br>

        ${x.code}

        <br>

        <small>
        ${x.time}
        </small>

        </div>`

    ).join('')

    :

    '<div class="history-item">No scans yet.</div>';

    $('history').style.display =
    'block';

    $('menu').style.display =
    'none';

}


/* ADD HISTORY */

function addHistory(name,code){

    let h =
    JSON.parse(
        localStorage.getItem(
            'scanHistory'
        ) || '[]'
    );

    h.unshift({

        name:name,

        code:code,

        time:
        new Date().toLocaleString()

    });

    localStorage.setItem(
        'scanHistory',

        JSON.stringify(
            h.slice(0,20)
        )
    );

}


/* DEV LOG BUTTONS */

function copyLog(){

    navigator.clipboard?.writeText(
        $('output').textContent
    );

    log('Log copied');

}


function clearLog(){

    $('output').textContent =
    '';

    log('Log cleared');

}


/* ZOOM */

$('zoom').oninput =
async e => {

    let v =
    +e.target.value;

    $('zv').textContent =
    v.toFixed(1) + '×';

    let video =
    document.querySelector(
        '#reader video'
    );

    try{

        let t =
        video
        ?.srcObject
        ?.getVideoTracks()[0];

        let c =
        t?.getCapabilities();

        if(
            t &&
            c?.zoom
        ){

            let z =
            c.zoom.min +
            (v-1)/4 *
            (c.zoom.max-c.zoom.min);

            await t.applyConstraints({

                advanced:[
                    {
                        zoom:z
                    }
                ]

            });

        }

    }catch(e){

        log(
            'Zoom: ' +
            e.message
        );

    }

};


/* SOUND */

$('sound').onclick = () => {

    sound =
    !sound;

    $('sound').classList.toggle(
        'active',
        sound
    );

    log(
        'Sound ' +
        (sound ? 'on' : 'off')
    );

};


/* FLASHLIGHT */

$('flash').onclick =
async () => {

    try{

        let t =
        document
        .querySelector(
            '#reader video'
        )
        ?.srcObject
        ?.getVideoTracks()[0];

        let c =
        t?.getCapabilities();

        if(c?.torch){

            torch =
            !torch;

            await t.applyConstraints({

                advanced:[
                    {
                        torch:torch
                    }
                ]

            });

            $('flash').classList.toggle(
                'active',
                torch
            );

            log(
                'Flashlight ' +
                (torch ? 'on' : 'off')
            );

        }else{

            log(
                'Flashlight unavailable'
            );

        }

    }catch(e){

        log(
            'Flashlight: ' +
            e.message
        );

    }

};


/* SCAN SOUND */

function beep(){

    if(!sound)
        return;

    try{

        let A =
        AudioContext ||
        webkitAudioContext;

        let a =
        new A();

        let o =
        a.createOscillator();

        let g =
        a.createGain();

        o.frequency.value =
        880;

        g.gain.value =
        .06;

        o.connect(g);

        g.connect(
            a.destination
        );

        o.start();

        o.stop(
            a.currentTime +
            .12
        );

    }catch{}

}


/* BARCODE DATABASE */

const products = {

    '012345678905':
    'Water Bottle',

    '123456789012':
    'H2D Filament',

    '987654321098':
    'TOYBOX Filament'

};


/* START SCANNER */

async function start(){

    if(scanner){

        try{
            await scanner.stop();
        }catch{}

        scanner = null;

    }

    $('result').style.display =
    'none';

    $('reader').style.display =
    'block';

    $('controls').style.display =
    'flex';

    $('scanbox').style.display =
    'block';

    $('status').style.display =
    'block';

    $('status').textContent =
    mode === 'qr'
    ? 'Ready to scan'
    : 'Ready to scan barcode';

    scanner =
    new Html5Qrcode(
        'reader'
    );

    try{

        let formats =
        mode === 'qr'

        ?

        [
            Html5QrcodeSupportedFormats.QR_CODE
        ]

        :

        [

            Html5QrcodeSupportedFormats.CODE_128,

            Html5QrcodeSupportedFormats.CODE_39,

            Html5QrcodeSupportedFormats.EAN_13,

            Html5QrcodeSupportedFormats.EAN_8,

            Html5QrcodeSupportedFormats.UPC_A,

            Html5QrcodeSupportedFormats.UPC_E

        ];


        await scanner.start(

            {
                facingMode:facing
            },

            {

                fps:20,

                qrbox:
                mode === 'qr'

                ?

                {
                    width:250,
                    height:250
                }

                :

                {
                    width:350,
                    height:150
                },

                formatsToSupport:
                formats

            },

            async text => {

                await found(text);

            },

            () => {}

        );


        log(
            'Camera started: ' +
            (
                facing === 'environment'
                ? 'rear'
                : 'front'
            )
        );


    }catch(e){

        $('status').textContent =
        'Camera unavailable';

        log(
            'Camera error: ' +
            e.message
        );

    }

}


/* SCAN RESULT */

async function found(text){

    if(!scanner)
        return;


    try{

        await scanner.stop();

    }catch{}


    beep();


    addHistory(

        mode === 'qr'
        ? siteName(text)
        : (
            products[text]
            ||
            'Unknown Product'
        ),

        text

    );


    $('reader').style.display =
    'none';

    $('scanbox').style.display =
    'none';

    $('controls').style.display =
    'none';

    $('status').style.display =
    'none';

    $('result').style.display =
    'block';


    if(mode === 'barcode'){

        $('resultName').textContent =
        products[text]
        ||
        'Unknown Product';

        $('resultCode').textContent =
        'Barcode: ' + text;

        $('open').style.display =
        'none';

    }else{

        let name =
        siteName(text);

        $('resultName').textContent =
        name;

        $('resultCode').style.display =
        'none';

        lastURL =
        text;

        $('open').style.display =
        'inline-block';

        $('open').onclick =
        () => {

            let u =
            text.startsWith('http')
            ? text
            : 'https://' + text;

            window.open(
                u,
                '_blank'
            );

        };

    }


    log(
        'Detected ' +
        text
    );

}


/* WEBSITE NAME */

function siteName(u){

    try{

        let x =
        new URL(
            u.startsWith('http')
            ? u
            : 'https://' + u
        );

        let h =
        x.hostname.replace(
            /^www\./,
            ''
        );


        if(
            h === 'make.toys' &&
            x.pathname === '/toys'
        ){

            return 'TOYBOX';

        }


        let known = {

            'google.com':
            'Google',

            'youtube.com':
            'YouTube',

            'github.com':
            'GitHub',

            'amazon.com':
            'Amazon',

            'apple.com':
            'Apple',

            'bambulab.com':
            'Bambu Lab',

            'make.toys':
            'TOYBOX',

            'creality.com':
            'Creality'

        };


        return (

            known[h]

            ||

            h
            .split('.')[0]
            .replace(
                /^./,
                c => c.toUpperCase()
            )

        );

    }catch{

        return 'QR Code';

    }

}


/* START */

window.onload =
() => {

    loadNotes();

    log(
        'Printer Scanner 5000 v4.8 loaded'
    );

    start();

};


/* KEEP SCAN BOX FIXED */

window.onresize =
() => {

    let b =
    $('scanbox');

    b.style.width =
    mode === 'qr'
    ? '250px'
    : '350px';

    b.style.height =
    mode === 'qr'
    ? '250px'
    : '150px';

};

</script>

</body>
</html>
