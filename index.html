<!--
  QR SCANNER
  VERSION: 1.95
  Hold-still text appears every time a QR code is detected
  Opens confirmed QR codes in a new tab
  Camera behavior unchanged
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    #camera {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius: 28px;

      background: #000;
    }

    #reader {
      position: absolute;
      inset: 0;

      width: 100% !important;
      height: 100% !important;

      border: none !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    #reader__header_message {
      display: none !important;
    }

    #reader__scan_region {
      border: none !important;
    }

    #reader__scan_region img {
      display: none !important;
    }

    #reader__scan_region > div {
      border: none !important;
    }

    #scan-box {
      position: absolute;

      width: 250px !important;
      height: 250px !important;

      min-width: 250px;
      min-height: 250px;

      max-width: 250px;
      max-height: 250px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border: 3px solid white;

      border-radius: 18px;

      pointer-events: none;

      z-index: 10;
    }

    #hold-still {
      position: absolute;

      left: 50%;
      top: calc(50% + 155px);

      transform: translateX(-50%);

      z-index: 15;

      padding: 9px 16px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 15px;
      font-weight: 600;

      white-space: nowrap;

      display: none;
    }

    #loading {
      position: absolute;
      inset: 0;

      background: #000;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 20;
    }

    .spinner {
      width: 28px;
      height: 28px;

      border: 3px solid #333;

      border-top: 3px solid white;

      border-radius: 50%;

      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>
</head>

<body>

  <div id="app">

    <div id="camera">

      <div id="reader"></div>

      <div id="scan-box"></div>

      <div id="hold-still">
        Hold still
      </div>

      <div id="loading">

        <div class="spinner"></div>

      </div>

    </div>

  </div>


  <script>

    let scanner = null;

    let firstDetection = null;

    let detectedText = null;

    let scanConfirmed = false;

    const HOLD_TIME = 600;


    async function startScanner() {

      scanner = new Html5Qrcode("reader");


      try {

        await scanner.start(

          {
            facingMode: "environment"
          },

          {
            fps: 30,

            qrbox: {
              width: 250,
              height: 250
            },

            disableFlip: false
          },

          function(decodedText) {

            if (scanConfirmed) {
              return;
            }


            /*
              EVERY TIME A QR CODE IS FIRST SEEN,
              SHOW "HOLD STILL".
            */

            if (firstDetection === null) {

              firstDetection = Date.now();

              detectedText = decodedText;

              document.getElementById(
                "hold-still"
              ).style.display = "block";

              return;
            }


            /*
              If a different QR is detected,
              restart the hold-still process.
            */

            if (decodedText !== detectedText) {

              firstDetection = Date.now();

              detectedText = decodedText;

              document.getElementById(
                "hold-still"
              ).style.display = "block";

              return;
            }


            /*
              QR has stayed detected long enough.
            */

            if (
              Date.now() - firstDetection
              >= HOLD_TIME
            ) {

              scanConfirmed = true;

              document.getElementById(
                "hold-still"
              ).style.display = "none";


              let url = decodedText;


              if (
                !url.startsWith("http://") &&
                !url.startsWith("https://")
              ) {

                url = "https://" + url;

              }


              /*
                Open the scanned website
                in a new tab.
              */

              window.open(
                url,
                "_blank"
              );

            }

          },

          function(errorMessage) {

            /*
              Ignore normal camera/decode errors.
            */

          }

        );


        document.getElementById("loading")
          .style.display = "none";

      }

      catch(error) {

        console.error(
          "CAMERA ERROR:",
          error
        );

        document.getElementById("loading")
          .style.display = "none";

      }

    }


    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>
</html>
