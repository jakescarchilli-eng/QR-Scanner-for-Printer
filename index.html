<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #000;

  overflow: hidden;

  font-family: Arial, sans-serif;
}

#app {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  background: #000;
}


/* =========================
   TOP BAR
========================= */

#top-bar {

  position: relative;

  width: 100%;
  height: 65px;

  flex-shrink: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #000;

  z-index: 1000;
}

#site-title {

  color: white;

  font-size: 24px;

  font-weight: 700;

  text-align: center;

  white-space: nowrap;

  user-select: none;
}


/* =========================
   HOME BUTTON
========================= */

#home-button {

  position: absolute;

  left: 12px;
  top: 50%;

  transform:
    translateY(-50%);

  width: 42px;
  height: 42px;

  border: none;

  border-radius: 12px;

  background: #222;

  color: white;

  font-size: 22px;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 3000;
}

#home-button:active {

  transform:
    translateY(-50%)
    scale(.94);
}


/* =========================
   HOME MENU
========================= */

#home-menu {

  position: absolute;

  left: 12px;
  top: 58px;

  width: 190px;

  max-height:
    calc(100vh - 75px);

  overflow-y: auto;

  padding: 10px;

  background: #111;

  border:
    1px solid #333;

  border-radius: 18px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.5);

  z-index: 3000;

  display: none;
}

.menu-button {

  width: 100%;

  border: none;

  border-radius: 12px;

  padding: 13px 10px;

  margin: 4px 0;

  background: #222;

  color: white;

  font-size: 17px;

  font-weight: 600;

  cursor: pointer;
}

.menu-button:active {

  background: #333;

  transform:
    scale(.98);
}


/* =========================
   CAMERA
========================= */

#camera {

  position: relative;

  width: 100%;

  height:
    calc(100% - 65px);

  overflow: hidden;

  border-radius:
    28px 28px 0 0;

  background: #000;

  z-index: 1;
}

#reader {

  position: absolute;

  inset: 0;

  width: 100% !important;
  height: 100% !important;

  border: none !important;

  overflow: hidden;

  z-index: 4;
}

#reader video {

  width: 100% !important;
  height: 100% !important;

  object-fit: cover !important;

  display: block !important;
}

#reader__dashboard,
#reader__header_message {

  display: none !important;
}


/* =========================
   FIXED SCAN REGION
========================= */

#reader__scan_region {

  width: 250px !important;
  height: 250px !important;

  min-width: 250px !important;
  min-height: 250px !important;

  max-width: 250px !important;
  max-height: 250px !important;

  position: absolute !important;

  left: 50% !important;
  top: 50% !important;

  transform:
    translate(-50%, -50%) !important;

  margin: 0 !important;

  padding: 0 !important;

  border: none !important;

  overflow: hidden !important;

  pointer-events: none !important;
}

#reader__scan_region img {

  display: none !important;
}


/* =========================
   SCAN BOX
========================= */

#scan-box {

  position: absolute;

  width: 250px !important;
  height: 250px !important;

  min-width: 250px !important;
  min-height: 250px !important;

  max-width: 250px !important;
  max-height: 250px !important;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border:
    3px solid white;

  border-radius: 18px;

  pointer-events: none;

  z-index: 20;
}


/* =========================
   STATUS
========================= */

#status-bar {

  position: absolute;

  left: 50%;

  top:
    calc(50% - 185px);

  transform:
    translateX(-50%);

  z-index: 40;

  padding:
    9px 18px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  color: white;

  font-size: 14px;

  font-weight: 600;

  white-space: nowrap;
}

#status-bar.detected {

  background:
    rgba(255,170,0,.8);
}


/* =========================
   BLUR MESSAGE
========================= */

#hold-still {

  position: absolute;

  left: 50%;

  top:
    calc(50% + 155px);

  transform:
    translateX(-50%);

  z-index: 30;

  padding:
    9px 16px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  color: white;

  font-size: 15px;

  font-weight: 600;

  white-space: nowrap;

  display: none;
}


/* =========================
   CONTROL BAR
========================= */

#control-bar {

  position: absolute;

  left: 50%;
  bottom: 45px;

  transform:
    translateX(-50%);

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  width: min(94%, 600px);
}


/* =========================
   ZOOM
========================= */

#zoom-container {

  height: 48px;

  flex: 1;

  min-width: 180px;
  max-width: 350px;

  padding:
    10px 16px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  display: flex;

  align-items: center;

  gap: 10px;
}

#zoom-label {

  color: white;

  font-size: 13px;

  font-weight: 600;

  white-space: nowrap;
}

#zoom-slider {

  width: 100%;
  height: 5px;

  accent-color: white;

  cursor: pointer;
}

#zoom-value {

  min-width: 35px;

  color: white;

  font-size: 13px;

  text-align: right;
}


/* =========================
   CIRCLE BUTTONS
========================= */

.circle-button {

  width: 48px;
  height: 48px;

  flex-shrink: 0;

  border-radius: 50%;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  transition: .15s;
}

.circle-button:active {

  transform:
    scale(.9);
}

.circle-button.active {

  background: white;

  color: black;

  border:
    2px solid white;
}

.circle-button:not(.active) {

  background: black;

  color: white;

  border:
    2px solid white;
}


/* =========================
   ICONS
========================= */

.icon {

  position: relative;

  display: block;

  width: 22px;
  height: 22px;

  color: currentColor;

  pointer-events: none;
}

.flashlight-icon::before {

  content: "";

  position: absolute;

  left: 7px;
  top: 2px;

  width: 9px;
  height: 15px;

  border:
    2px solid currentColor;

  border-radius: 3px;
}

.flashlight-icon::after {

  content: "";

  position: absolute;

  left: 8px;
  bottom: 1px;

  width: 7px;
  height: 5px;

  border-left:
    2px solid currentColor;

  border-right:
    2px solid currentColor;
}

.sound-icon::before {

  content: "";

  position: absolute;

  left: 2px;
  top: 8px;

  width: 7px;
  height: 7px;

  background:
    currentColor;

  border-radius: 1px;
}

.sound-icon::after {

  content: "";

  position: absolute;

  left: 7px;
  top: 4px;

  width: 9px;
  height: 14px;

  background:
    currentColor;

  clip-path:
    polygon(
      0 35%,
      35% 35%,
      100% 0,
      100% 100%,
      35% 65%,
      0 65%
    );
}


/* =========================
   LOADING
========================= */

#loading {

  position: absolute;

  inset: 0;

  background: #000;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 50;
}

.spinner {

  width: 28px;
  height: 28px;

  border:
    3px solid #333;

  border-top:
    3px solid white;

  border-radius: 50%;

  animation:
    spin .6s linear infinite;
}

@keyframes spin {

  to {

    transform:
      rotate(360deg);
  }

}


/* =========================
   RESULT
========================= */

#result-text {

  position: absolute;

  left: 50%;
  top: 12%;

  transform:
    translateX(-50%);

  z-index: 50;

  width: 85%;

  max-width: 700px;

  color: white;

  font-size: 36px;

  font-weight: 700;

  text-align: center;

  display: none;
}


/* =========================
   ACTION BUTTONS
========================= */

.action-button {

  left: 50%;

  transform:

  border: none;

  padding:
    18px 38px;

  background: white;

  color: #111;

  font-size: 20px;

  font-weight: 600;

  cursor: pointer;
}

.action-button:active {

  transform:
    translateX(-50%)

}

#open-button {

  top: 55%;

  display: none;
}

#rescan {

  top: 70%;

  display: none;
}


/* =========================
   VERSION
========================= */

#version-number {

  position: absolute;

  left: 50%;
  bottom: 6px;

  transform:

  z-index: 100;

  pointer-events: none;
}


/* =========================
   HISTORY
========================= */

#history-panel {

  top: 50%;

  transform:

  border-radius: 20px;

}

#history-title {

.history-item {

.history-name {

}

.history-time {

.history-close {

/* =========================

#notes-panel {

  padding:

========================= */

#dev-panel {

  background: #000;

</style>

<script>

/* =========================
   VARIABLES
========================= */

let scanner = null;

let firstDetection = null;

let detectedText = null;

let scanConfirmed = false;

let scannedURL = null;

let isPrinterLink = false;

let cameraTrack = null;

let devMode = false;

let lightMode = false;

let flashlightOn = false;

let soundEnabled = true;

let scanCount = 0;

let successfulScans = 0;

let failedScans = 0;

let scanStartTime = null;

let lastScanTime = 0;

const HOLD_TIME = 600;

const QR_SIZE = 250;


/* =========================
   DEV LOG
========================= */

function devLog(message) {

  const output =
    document.getElementById(
      "dev-output"
    );

  if (!output) return;

  const line =
    document.createElement(
      "div"
    );

  line.className =
    "dev-line";

  line.textContent =
    "[" +
    new Date().toLocaleTimeString() +
    "] " +
    message;

  output.appendChild(line);

  output.scrollTop =
    output.scrollHeight;

  updateStats();

}


function updateStats() {

  const stats =
    document.getElementById(
      "dev-stats"
    );

  if (!stats) return;

  stats.textContent =
    "Scans: " +
    scanCount +
    " | Successful: " +
    successfulScans +
    " | Failed: " +
    failedScans +
    " | Last scan: " +
    lastScanTime +
    " ms";

}

/* =========================
   NOTES
========================= */

function showNotes() {

      "home-menu"
    );

    document.getElementById(
      "notes-panel"
    );

    "none";

  );

function hideNotes() {

  const notes =
    document.getElementById(
      "notes-panel"
    );


  /*
    IMPORTANT:

    We only hide the Notes page.

    We DO NOT:
    - reload the page
    - stop the scanner
    - restart the scanner
    - change the video element
  */

  notes.style.display =

  notes.style.pointerEvents =
    "none";


  document.getElementById(
    "home-menu"
  ).style.display =
    "none";


  devLog(
    "Closed printer status"
  );


  /*
    Give the browser a moment to
    finish removing the overlay,
    then reconnect our reference
    to the existing camera track.
  */

  setTimeout(
    reacquireCameraTrack,
    50
  );

}


/* =========================
   SAVE NOTES
========================= */

function saveNotes() {

  const h2d =
    document.getElementById(
      "h2d-status"
    ).value;


  const toybox =
    document.getElementById(
      "toybox-status"
    ).value;


  const ender =
    document.getElementById(
      "ender-status"
    ).value;


  const data = {

    h2d:
      h2d,

    toybox:
      toybox,

    ender:
      ender

  };


  try {

    localStorage.setItem(

      "printerNotes",

      JSON.stringify(
        data
      )

    );


    /*
      This is intentionally the ONLY
      thing Save Status does to the data.

      It does NOT reload the page.

      It does NOT stop the camera.

      It does NOT restart the scanner.
    */

    devLog(
      "Printer statuses saved"
    );


  } catch(error) {

    devLog(

      "Could not save statuses: " +
      error.message

    );

  }

}


/* =========================
   LOAD NOTES
========================= */

function loadNotes() {

  try {

    const saved =
      JSON.parse(

        localStorage.getItem(
          "printerNotes"
        )

      );


    if (!saved)
      return;


    document.getElementById(
      "h2d-status"
    ).value =
      saved.h2d ||
      "online";


    document.getElementById(
      "toybox-status"
    ).value =
      saved.toybox ||
      "online";


    document.getElementById(
      "ender-status"
    ).value =
      saved.ender ||
      "online";


  } catch(error) {

    devLog(

      "Could not load printer statuses: " +
      error.message

    );

  }

}


/* =========================
   CAMERA TRACK RECOVERY
========================= */

function reacquireCameraTrack() {

  /*
    We don't create a new camera.

    We simply find the existing
    video stream again.
  */

  const video =
    document.querySelector(
      "#reader video"
    );


  if (
    video &&
    video.srcObject
  ) {

    const tracks =
      video.srcObject
        .getVideoTracks();


    if (
      tracks.length > 0
    ) {

      cameraTrack =
        tracks[0];


      devLog(
        "Camera track reference restored"
      );

      return true;

    }

  }


  return false;

}


/* =========================
   HISTORY
========================= */

function getHistory() {

  try {

    return JSON.parse(

      localStorage.getItem(
        "printerScannerHistory"
      )

    ) || [];

  } catch {

    return [];

  }

}


function saveHistory(
  url,
  name
) {

  const history =
    getHistory();


  history.unshift({

    url:
      url,

    name:
      name,

    time:
      new Date()
        .toLocaleString()

  });


  localStorage.setItem(

    "printerScannerHistory",

    JSON.stringify(
      history.slice(
        0,
        20
      )
    )

  );


  devLog(
    "Saved scan to history"
  );

}


function showHistory() {

  const panel =
    document.getElementById(
      "history-panel"
    );

  const list =
    document.getElementById(
      "history-list"
    );

  const history =
    getHistory();


  list.innerHTML =
    "";


  if (
    history.length ===
    0
  ) {

    list.innerHTML =
      '<div class="history-item">' +
      'No scans yet.' +
      '</div>';

  } else {

    history.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "history-item";


        div.innerHTML =

          '<div class="history-name">' +
          escapeHTML(
            item.name
          ) +
          "</div>" +

          '<div class="history-url">' +
          escapeHTML(
            item.url
          ) +
          "</div>" +

          '<div class="history-time">' +
          escapeHTML(
            item.time
          ) +
          "</div>";


        div.onclick =
          function() {

            window.open(
              item.url,
              "_blank"
            );

          };


        list.appendChild(
          div
        );

      }
    );

  }


  panel.style.display =
    "block";


  document.getElementById(
    "home-menu"
  ).style.display =
    "none";

}


function hideHistory() {

  document.getElementById(
    "history-panel"
  ).style.display =
    "none";

}


function clearHistory() {

  localStorage.removeItem(
    "printerScannerHistory"
  );


  devLog(
    "Scan history cleared"
  );


  document.getElementById(
    "home-menu"
  ).style.display =
    "none";

}


function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================
   FLASHLIGHT
========================= */

async function toggleFlashlight() {

  if (!cameraTrack) {

    reacquireCameraTrack();

  }


  if (!cameraTrack) {

    devLog(
      "Flashlight unavailable"
    );

    return;

  }


  try {

    const capabilities =
      cameraTrack.getCapabilities();


    if (
      !capabilities.torch
    ) {

      devLog(
        "Camera does not support flashlight"
      );

      return;

    }


    flashlightOn =
      !flashlightOn;


    await cameraTrack.applyConstraints({

      advanced: [

        {
          torch:
            flashlightOn
        }

      ]

    });


    document
      .getElementById(
        "flashlight-button"
      )
      .classList.toggle(
        "active",
        flashlightOn
      );


  } catch(error) {

    flashlightOn =
      false;


    devLog(
      "Flashlight error: " +
      error.message
    );

  }

}


/* =========================
   SOUND
========================= */

function toggleSound() {

  soundEnabled =
    !soundEnabled;


  document
    .getElementById(
      "sound-button"
    )
    .classList.toggle(
      "active",
      soundEnabled
    );

}


function playScanSound() {

  if (!soundEnabled)
    return;


  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext)
      return;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.frequency.value =
      880;


    oscillator.type =
      "sine";


    gain.gain.value =
      0.08;


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.start();


    oscillator.stop(
      audio.currentTime +
      0.12
    );


  } catch {

    devLog(
      "Sound error"
    );

  }

}

/* =========================
   SITE NAME
========================= */

function getSiteName(url) {

  try {

    let fixedURL =
      url;


    if (

      !fixedURL.startsWith(
        "http://"
      )

      &&

      !fixedURL.startsWith(
        "https://"
      )

    ) {

      fixedURL =
        "https://" +
        fixedURL;

    }


    const parsed =
      new URL(
        fixedURL
      );


    let hostname =
      parsed.hostname.replace(
        /^www\./,
        ""
      );


    const knownSites = {

      "youtube.com":
        "YouTube",

      "google.com":
        "Google",

      "github.com":
        "GitHub",

      "amazon.com":
        "Amazon",

      "apple.com":
        "Apple",

      "facebook.com":
        "Facebook",

      "instagram.com":
        "Instagram",

      "tiktok.com":
        "TikTok",

      "reddit.com":
        "Reddit",

      "microsoft.com":
        "Microsoft",

      "bambulab.com":
        "Bambu Lab",

      "makerworld.com":
        "MakerWorld"

    };


    if (
      knownSites[hostname]
    ) {

      return knownSites[
        hostname
      ];

    }


    const parts =
      hostname.split(".");


    if (
      parts.length >= 2
    ) {

      const name =
        parts[
          parts.length - 2
        ];


      return (

        name
          .charAt(0)
          .toUpperCase() +

        name.slice(1)

      );

    }


    return hostname;


  } catch {

    return "QR Code Found";

  }

}


/* =========================
   QR RESULT
========================= */

function getQRText(url) {

  try {

    const parsedURL =
      new URL(

        url.startsWith("http")
          ? url
          : "https://" + url

      );


    const cleanURL =
      parsedURL.origin +
      parsedURL.pathname;


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1166269606"

    ) {

      isPrinterLink =
        true;

      return "TOYBOX Found";

    }


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1658133862"

    ) {

      isPrinterLink =
        true;

      return "Ender 3 Found";

    }


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1625671285"

    ) {

      isPrinterLink =
        true;

      return "This is to print with the H2D";

    }


    if (

      parsedURL.origin ===
      "https://makerworld.com"

      &&

      parsedURL.pathname ===
      "/en"

    ) {

      isPrinterLink =
        false;

      return "This opens MakerWorld, which is for the H2D, I just put the wrong text on the QR code :/";

    }


    isPrinterLink =
      false;


    return getSiteName(
      url
    );


  } catch {

    isPrinterLink =
      false;

    return "QR Code Found";

  }

}


/* =========================
   ZOOM
========================= */

async function setZoom(value) {

  const zoom =
    parseFloat(
      value
    );


  document.getElementById(
    "zoom-value"
  ).textContent =

    zoom.toFixed(1) +
    "×";


  if (!cameraTrack) {

    reacquireCameraTrack();

  }


  if (!cameraTrack)
    return;


  try {

    const capabilities =
      cameraTrack
        .getCapabilities();


    if (!capabilities.zoom) {

      devLog(
        "Camera does not support zoom"
      );

      return;

    }


    const actualZoom =

      capabilities.zoom.min +

      (
        (zoom - 1) / 4
      ) *

      (
        capabilities.zoom.max -
        capabilities.zoom.min
      );


    await cameraTrack.applyConstraints({

      advanced: [

        {
          zoom:
            actualZoom
        }

      ]

    });


  } catch(error) {

    devLog(
      "Zoom error: " +
      error.message
    );

  }

}


/* =========================
   LOCK SCAN REGION
========================= */

function positionScanRegion() {

  const region =
    document.getElementById(
      "reader__scan_region"
    );


  if (!region)
    return;


  region.style.position =
    "absolute";

  region.style.width =
    QR_SIZE + "px";

  region.style.height =
    QR_SIZE + "px";

  region.style.minWidth =
    QR_SIZE + "px";

  region.style.minHeight =
    QR_SIZE + "px";

  region.style.maxWidth =
    QR_SIZE + "px";

  region.style.maxHeight =
    QR_SIZE + "px";

  region.style.left =
    "50%";

  region.style.top =
    "50%";

  region.style.transform =
    "translate(-50%, -50%)";

  region.style.margin =
    "0";

  region.style.padding =
    "0";

  region.style.border =
    "none";

}


/* =========================
   START SCANNER
========================= */

async function startScanner() {

  scanStartTime =
    Date.now();


  const status =
    document.getElementById(
      "status-bar"
    );


  status.textContent =
    "Starting camera...";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {

        fps:
          30,

        qrbox: {

          width:
            QR_SIZE,

          height:
            QR_SIZE

        },

        disableFlip:
          false

      },


      async function(decodedText) {

        if (
          scanConfirmed
        ) {

          return;

        }


        status.textContent =
          "QR detected";


        status.className =
          "detected";


        reacquireCameraTrack();


        if (
          firstDetection ===
          null
        ) {

          firstDetection =
            Date.now();

          detectedText =
            decodedText;


          document.getElementById(
            "hold-still"
          ).style.display =
            "block";


          return;

        }


        if (
          decodedText !==
          detectedText
        ) {

          firstDetection =
            Date.now();

          detectedText =
            decodedText;


          return;

        }


        if (

          Date.now() -
          firstDetection >=
          HOLD_TIME

        ) {

          scanConfirmed =
            true;


          scannedURL =
            decodedText;


          successfulScans++;

          scanCount++;


          lastScanTime =
            Date.now() -
            scanStartTime;


          playScanSound();


          const result =
            getQRText(
              decodedText
            );


          saveHistory(
            decodedText,
            result
          );


          document.getElementById(
            "status-bar"
          ).style.display =
            "none";


          document.getElementById(
            "hold-still"
          ).style.display =
            "none";


          document.getElementById(
            "control-bar"
          ).style.display =
            "none";


          document.getElementById(
            "version-number"
          ).style.display =
            "none";


          try {

            await scanner.stop();

          } catch {}


          cameraTrack =
            null;


          document.getElementById(
            "reader"
          ).style.display =
            "none";


          document.getElementById(
            "scan-box"
          ).style.display =
            "none";


          document.getElementById(
            "result-text"
          ).textContent =
            result;


          document.getElementById(
            "result-text"
          ).style.display =
            "block";


          const openButton =
            document.getElementById(
              "open-button"
            );


          openButton.textContent =
            isPrinterLink
              ? "Print"
              : "Open";


          openButton.style.display =
            "block";


          document.getElementById(
            "rescan"
          ).style.display =
            "block";


          devLog(
            "QR accepted: " +
            result
          );

        }

      },


      function() {}

    );


    setTimeout(
      positionScanRegion,
      100
    );

    setTimeout(
      positionScanRegion,
      300
    );

    setTimeout(
      positionScanRegion,
      700
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    status.textContent =
      "Ready to scan";


    status.className =
      "";


    setTimeout(
      reacquireCameraTrack,
      700
    );


    devLog(
      "Camera started"
    );


  } catch(error) {

    failedScans++;


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    status.textContent =
      "Camera unavailable";


    devLog(
      "CAMERA ERROR: " +
      error.message
    );

  }

}


/* =========================
   OPEN SCANNED SITE
========================= */

function openScannedSite() {

  if (!scannedURL)
    return;


  let url =
    scannedURL;


  if (

    !url.startsWith(
      "http://"
    )

    &&

    !url.startsWith(
      "https://"
    )

  ) {

    url =
      "https://" +
      url;

  }


  window.open(
    url,
    "_blank"
  );

}

   RESCAN
========================= */

function rescan() {

}

   RESIZE
========================= */

let resizeTimer =
  null;


function keepScannerLocked() {

  clearTimeout(
    resizeTimer
  );


  resizeTimer =
    setTimeout(

      function() {

        positionScanRegion();

      },

      50

    );

}


window.addEventListener(
  "resize",
  keepScannerLocked
);

  "orientationchange",

  function() {

    setTimeout(

      100

    );

  }

);

========================= */

window.addEventListener(

    );


    devLog(
      "QR area: FIXED 250x250"
    );


    devLog(
      "Vibration: REMOVED"
    );


    devLog(
      "Scan success status: REMOVED"
    );


    devLog(
      "Printer status dropdowns enabled"
    );


    devLog(

    loadNotes();

  }

);
