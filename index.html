<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #camera {
      position: relative;

      width: 100%;
      height: 100%;

      max-width: 900px;
      max-height: 900px;

      overflow: hidden;

      border-radius: 28px;

      background: #000;
    }

    #reader {
      position: absolute;

      inset: 0;

      width: 100% !important;
      height: 100% !important;

      border: none !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;
    }

    #reader__dashboard,
    #reader__header_message,
    #reader img {
      display: none !important;
    }

    /* Loading screen */

    #loading {
      position: absolute;

      inset: 0;

      background: #000;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 10;
    }

    .spinner {
      width: 28px;
      height: 28px;

      border: 3px solid #333;
      border-top: 3px solid #fff;

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Website */

    #website {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      border: none;

      display: none;

      background: white;

      z-index: 5;
    }

    /* Scan button */

    #rescan {
      position: absolute;

      bottom: 22px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      display: none;

      border: none;

      border-radius: 999px;

      padding: 12px 25px;

      background: rgba(255, 255, 255, 0.95);

      color: #111;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.25);

      transition:
        transform 0.15s ease;
    }

    #rescan:active {
      transform:
        translateX(-50%)
        scale(0.95);
    }

  </style>
</head>

<body>

  <div id="app">

    <div id="camera">

      <div id="reader"></div>

      <div id="loading">
        <div class="spinner"></div>
      </div>

      <iframe
        id="website"
        src="about:blank"
        allow="fullscreen">
      </iframe>

      <button
        id="rescan"
        onclick="rescan()">

        Scan

      </button>

    </div>

  </div>


  <script>

    let scanner = null;
    let scanning = false;


    async function startScanner() {

      document.getElementById("loading")
        .style.display = "flex";

      document.getElementById("rescan")
        .style.display = "none";

      document.getElementById("reader")
        .style.display = "block";


      scanner = new Html5Qrcode("reader");


      try {

        await scanner.start(

          {
            facingMode: "environment"
          },

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },

          function(decodedText) {

            openQR(decodedText);

          },

          function() {

            // Ignore normal scanning errors.

          }

        );


        scanning = true;


        document.getElementById("loading")
          .style.display = "none";

      }

      catch(error) {

        console.error(error);

        document.getElementById("loading")
          .style.display = "none";

      }

    }


    async function openQR(url) {

      if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
      ) {

        url = "https://" + url;

      }


      if (scanning) {

        try {

          await scanner.stop();

        }

        catch(error) {}

        scanning = false;

      }


      document.getElementById("reader")
        .style.display = "none";


      document.getElementById("website")
        .src = url;


      document.getElementById("website")
        .style.display = "block";


      document.getElementById("rescan")
        .style.display = "block";

    }


    async function rescan() {

      document.getElementById("website")
        .style.display = "none";


      document.getElementById("website")
        .src = "about:blank";


      document.getElementById("rescan")
        .style.display = "none";


      document.getElementById("reader")
        .style.display = "block";


      if (scanner) {

        try {

          await scanner.clear();

        }

        catch(error) {}

      }


      scanner = null;

      scanning = false;


      startScanner();

    }


    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>
</html>
