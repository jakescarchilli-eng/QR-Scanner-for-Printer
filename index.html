<!--
  QR SCANNER
  VERSION: 1.5
  Square GitHub Pages site
  Fixed 250×250 scanning box
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #f2f2f2;

      overflow: hidden;
    }

    /*
      ENTIRE GITHUB PAGE

      The page itself is square.
    */

    #page {
      position: fixed;

      width: 90vmin;
      height: 90vmin;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      overflow: hidden;

      border-radius: 28px;

      background: #000;
    }

    /*
      CAMERA
    */

    #reader {
      position: absolute;

      inset: 0;

      width: 100% !important;
      height: 100% !important;

      border: none !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;
    }

    /*
      Hide html5-qrcode controls.
    */

    #reader__dashboard {
      display: none !important;
    }

    #reader__header_message {
      display: none !important;
    }

    #reader__scan_region {
      border: none !important;
    }

    #reader__scan_region img {
      display: none !important;
    }

    #reader__scan_region > div {
      border: none !important;
    }

    /*
      FIXED QR SCANNING BOX

      Exactly 250 × 250 pixels.
    */

    #scan-box {
      position: absolute;

      width: 250px !important;
      height: 250px !important;

      min-width: 250px;
      min-height: 250px;

      max-width: 250px;
      max-height: 250px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border: 3px solid white;

      border-radius: 18px;

      pointer-events: none;

      z-index: 10;
    }

    /*
      LOADING
    */

    #loading {
      position: absolute;

      inset: 0;

      background: #000;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 20;
    }

    .spinner {
      width: 28px;
      height: 28px;

      border: 3px solid #333;

      border-top: 3px solid white;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

  </style>
</head>

<body>

  <!--
    This is the entire square website.
  -->

  <div id="page">

    <div id="reader"></div>

    <div id="scan-box"></div>

    <div id="loading">

      <div class="spinner"></div>

    </div>

  </div>


  <script>

    let scanner = null;


    async function startScanner() {

      scanner = new Html5Qrcode("reader");


      try {

        await scanner.start(

          {
            facingMode: "environment"
          },

          {

            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            },

            disableFlip: false

          },

          function(decodedText) {

            console.log(
              "QR CODE:",
              decodedText
            );

          },

          function(errorMessage) {

            // Ignore normal scanning errors.

          }

        );


        document.getElementById("loading")
          .style.display = "none";

      }

      catch(error) {

        console.error(
          "CAMERA ERROR:",
          error
        );

        document.getElementById("loading")
          .style.display = "none";

      }

    }


    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>
</html>
