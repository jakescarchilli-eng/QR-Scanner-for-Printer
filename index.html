<!DOCTYPE html>

<style>

/* =========================
   GENERAL
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;

/* =========================

========================= */

/* =========================

========================= */

#home-menu {

/* =========================

/* =========================

#control-bar {

/* =========================

#zoom-container {

#zoom-value {

/* =========================

========================= */

.circle-button:not(.active) {

/* =========================
   ORIGINAL ICONS
========================= */

.icon {

  display: block;

  width: 22px;
  height: 22px;

  color: currentColor;

  pointer-events: none;
}


/* =========================
   FLASHLIGHT ICON
========================= */

.flashlight-icon::before {
  content: "";

  position: absolute;

  left: 7px;
  top: 2px;

  width: 9px;
  height: 15px;

  border:
    2px solid currentColor;

  border-radius: 3px;
}

.flashlight-icon::after {
  content: "";

  position: absolute;

  left: 8px;
  bottom: 1px;

  width: 7px;
  height: 5px;

  border-left:
    2px solid currentColor;

  border-right:
    2px solid currentColor;
}


/* =========================

========================= */

.sound-icon::before {
  content: "";

  position: absolute;

  left: 2px;
  top: 8px;

  width: 7px;
  height: 7px;

  background:
    currentColor;

  border-radius: 1px;
}

.sound-icon::after {
  content: "";

  position: absolute;

  left: 7px;
  top: 4px;

  width: 9px;
  height: 14px;

  background:
    currentColor;

  clip-path:
    polygon(
      0 35%,
      35% 35%,
      100% 0,
      100% 100%,
      35% 65%,
      0 65%

}

<script>

/* =========================
   VARIABLES
========================= */

let scanner = null;

let firstDetection = null;

let detectedText = null;

let scanConfirmed = false;

let scannedURL = null;

let isPrinterLink = false;

let cameraTrack = null;

let devMode = false;

let lightMode = false;

let flashlightOn = false;

let soundEnabled = true;

let scanCount = 0;

let successfulScans = 0;

let failedScans = 0;

let scanStartTime = null;

let lastScanTime = 0;

const HOLD_TIME = 600;

const QR_SIZE = 250;


/* =========================
   DEV LOG
========================= */

function devLog(message) {

  const output =
    document.getElementById(
      "dev-output"
    );

  if (!output) return;

  const now =
    new Date();

  const time =
    now.toLocaleTimeString();

  const line =
    document.createElement(
      "div"
    );

  line.className =
    "dev-line";

  line.textContent =
    "[" +
    time +
    "] " +
    message;

  output.appendChild(
    line
  );

  output.scrollTop =
    output.scrollHeight;

  updateStats();
}


/* =========================
   STATS
========================= */

function updateStats() {

  const stats =
    document.getElementById(
      "dev-stats"
    );

  if (!stats) return;

  stats.textContent =
    "Scans: " +
    scanCount +
    " | Successful: " +
    successfulScans +
    " | Failed: " +
    failedScans +
    " | Last scan: " +
    lastScanTime +
    " ms";
}


/* =========================
   HOME MENU
========================= */

function toggleHomeMenu() {

  const menu =
    document.getElementById(
      "home-menu"
    );

  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";
}


function openPrinterLink(url) {

  devLog(
    "Printer shortcut: " +
    url
  );

  window.open(
    url,
    "_blank"
  );

  document.getElementById(
    "home-menu"
  ).style.display =
    "none";
}


function refreshPage() {

  window.location.reload();
}


/* =========================
   HISTORY
========================= */

function getHistory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "printerScannerHistory"
      )
    ) || [];

  } catch {

    return [];

  }

}


function saveHistory(
  url,
  name
) {

  const history =
    getHistory();

  history.unshift({

    url: url,

    name: name,

    time:
      new Date()
        .toLocaleString()

  });

  const limited =
    history.slice(0, 20);

  localStorage.setItem(
    "printerScannerHistory",
    JSON.stringify(limited)
  );

  devLog(
    "Saved scan to history"
  );
}


function showHistory() {

  const panel =
    document.getElementById(
      "history-panel"
    );

  const list =
    document.getElementById(
      "history-list"
    );

  const history =
    getHistory();

  list.innerHTML = "";

  if (
    history.length === 0
  ) {

    list.innerHTML =
      '<div class="history-item">' +
      "No scans yet." +
      "</div>";

  } else {

    history.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "history-item";

        div.innerHTML =

          '<div class="history-name">' +
          escapeHTML(item.name) +
          "</div>" +

          '<div class="history-url">' +
          escapeHTML(item.url) +
          "</div>" +

          '<div class="history-time">' +
          escapeHTML(item.time) +
          "</div>";

        div.onclick =
          function() {

            window.open(
              item.url,
              "_blank"
            );

          };

        list.appendChild(
          div
        );

      }
    );

  }

/* =========================
   FLASHLIGHT
========================= */

async function toggleFlashlight() {

  const button =
    document.getElementById(
      "flashlight-button"
    );

  if (!cameraTrack) {

    devLog(
      "Flashlight unavailable: camera not ready"
    );

    return;
  }

  try {

    const capabilities =
      cameraTrack.getCapabilities();

    if (
      !capabilities.torch
    ) {

      devLog(
        "This camera does not expose torch control"
      );

      return;
    }

    flashlightOn =
      !flashlightOn;

    await cameraTrack.applyConstraints({

      advanced: [
        {
          torch:
            flashlightOn
        }
      ]

    });

    button.classList.toggle(
      "active",
      flashlightOn
    );

    devLog(
      "Flashlight: " +
      (
        flashlightOn
          ? "ON"
          : "OFF"
      )
    );

  } catch(error) {

    flashlightOn =
      false;

    button.classList.remove(
      "active"
    );

    devLog(
      "Flashlight error: " +
      error.message
    );

  }

}

function playScanSound() {

  if (!soundEnabled) return;

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.frequency.value =
      880;

    oscillator.type =
      "sine";

    gain.gain.value =
      0.08;

    oscillator.connect(
      gain
    );

    gain.connect(
      audio.destination
    );

    oscillator.start();

    oscillator.stop(
      audio.currentTime +
      0.12
    );

  } catch {

    devLog(
      "Sound error"
    );

  }

}

/* =========================
   SITE NAME
========================= */

function getSiteName(url) {

  try {

    let fixedURL =
      url;

    if (
      !fixedURL.startsWith(
        "http://"
      ) &&
      !fixedURL.startsWith(
        "https://"
      )
    ) {

      fixedURL =
        "https://" +
        fixedURL;

    }

    const parsed =
      new URL(
        fixedURL
      );

    let hostname =
      parsed.hostname.replace(
        /^www\./,
        ""
      );

    const knownSites = {

      "youtube.com":
        "YouTube",

      "google.com":
        "Google",

      "github.com":
        "GitHub",

      "amazon.com":
        "Amazon",

      "apple.com":
        "Apple",

      "facebook.com":
        "Facebook",

      "instagram.com":
        "Instagram",

      "tiktok.com":
        "TikTok",

      "reddit.com":
        "Reddit",

      "x.com":
        "X",

      "twitter.com":
        "Twitter",

      "microsoft.com":
        "Microsoft",

      "bambulab.com":
        "Bambu Lab",

      "makerworld.com":
        "MakerWorld"

    };

    if (
      knownSites[hostname]
    ) {

      return knownSites[
        hostname
      ];

    }

    const parts =
      hostname.split(".");

    if (
      parts.length >= 2
    ) {

      const name =
        parts[
          parts.length - 2
        ];

      return (
        name
          .charAt(0)
          .toUpperCase() +
        name.slice(1)
      );

    }

    return hostname;

  } catch {

    return "QR Code Found";

  }

}


/* =========================
   QR TYPE
========================= */

function getQRType(url) {

  try {

    const parsed =
      new URL(
        url.startsWith("http")
          ? url
          : "https://" + url
      );

    if (
      parsed.protocol ===
      "mailto:"
    ) {

      return "Email";

    }

    if (
      parsed.protocol ===
      "tel:"
    ) {

      return "Phone Number";

    }

    if (
      parsed.protocol ===
      "http:" ||
      parsed.protocol ===
      "https:"
    ) {

      return "Website";

    }

    return "Text";

  } catch {

    if (
      url.startsWith(
        "WIFI:"
      )
    ) {

      return "Wi-Fi";

    }

    return "Text";

  }

}


/* =========================
   QR RESULT
========================= */

function getQRText(url) {

  try {

    const parsedURL =
      new URL(
        url.startsWith("http")
          ? url
          : "https://" + url
      );

    const cleanURL =
      parsedURL.origin +
      parsedURL.pathname;


    if (
      cleanURL ===
      "https://apps.apple.com/app/id1166269606"
    ) {

      isPrinterLink =
        true;

      return "TOYBOX Found";

    }


    if (
      cleanURL ===
      "https://apps.apple.com/app/id1658133862"
    ) {

      isPrinterLink =
        true;

      return "Ender 3 Found";

    }


    if (
      cleanURL ===
      "https://apps.apple.com/app/id1625671285"
    ) {

      isPrinterLink =
        true;

      return "This is to print with the H2D";

    }


    if (
      parsedURL.origin ===
        "https://makerworld.com" &&
      parsedURL.pathname ===
        "/en"
    ) {

      isPrinterLink =
        false;

      return "This opens MakerWorld, which is for the H2D, I just put the wrong text on the QR code :/";

    }


    isPrinterLink =
      false;

    return getSiteName(
      url
    );

  } catch {

    isPrinterLink =
      false;

    return "QR Code Found";

  }

}


/* =========================
   ZOOM
========================= */

async function setZoom(value) {

  const zoom =
    parseFloat(value);

  document.getElementById(
    "zoom-value"
  ).textContent =
    zoom.toFixed(1) +
    "×";

  if (!cameraTrack)
    return;

  try {

    const capabilities =
      cameraTrack
        .getCapabilities();

    if (!capabilities.zoom) {

      devLog(
        "Camera does not support zoom"
      );

      return;

    }

    const min =
      capabilities.zoom.min;

    const max =
      capabilities.zoom.max;

    const actualZoom =
      min +
      ((zoom - 1) / 4) *
      (max - min);

    await cameraTrack
      .applyConstraints({

        advanced: [
          {
            zoom:
              actualZoom
          }
        ]

      });

  } catch(error) {

    devLog(
      "Zoom error: " +
      error.message
    );

  }

}

/* =========================
   START SCANNER
========================= */

async function startScanner() {

  scanStartTime =
    Date.now();

  const status =
    document.getElementById(
      "status-bar"
    );

  status.textContent =
    "Starting camera...";

  scanner =
    new Html5Qrcode(
      "reader"
    );

  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 30,

        qrbox: {
          width:
            QR_SIZE,

          height:
            QR_SIZE
        },

        disableFlip:
          false

      },

      async function(
        decodedText
      ) {

        if (
          scanConfirmed
        ) {

          return;

        }


        /*
          Keep "QR detected".
          No "Scan complete" message.
        */

        status.textContent =
          "QR detected";

        status.className =
          "detected";

        devLog(
          "QR detected"
        );


        if (!cameraTrack) {

          const video =
            document.querySelector(
              "#reader video"
            );

          if (
            video &&
            video.srcObject
          ) {

            const tracks =
              video.srcObject
                .getVideoTracks();

            if (
              tracks.length
            ) {

              cameraTrack =
                tracks[0];

            }

          }

        }


        if (
          firstDetection ===
          null
        ) {

          firstDetection =
            Date.now();

          detectedText =
            decodedText;

          document.getElementById(
            "hold-still"
          ).style.display =
            "block";

          return;

        }


        if (
          decodedText !==
          detectedText
        ) {

          firstDetection =
            Date.now();

          detectedText =
            decodedText;

          return;

        }


        if (
          Date.now() -
          firstDetection >=
          HOLD_TIME
        ) {

          scanConfirmed =
            true;

          scannedURL =
            decodedText;

          successfulScans++;

          scanCount++;

          lastScanTime =
            Date.now() -
            scanStartTime;

          playScanSound();


          /*
            IMPORTANT:
            There is intentionally
            NO vibration here.
          */


          const type =
            getQRType(
              decodedText
            );

          const typeBox =
            document.getElementById(
              "qr-type"
            );

          typeBox.textContent =
            type;

          typeBox.style.display =
            "block";


          const result =
            getQRText(
              decodedText
            );


          saveHistory(
            decodedText,
            result
          );


          document.getElementById(
            "hold-still"
          ).style.display =
            "none";

          document.getElementById(
            "control-bar"
          ).style.display =
            "none";

          document.getElementById(
            "version-number"
          ).style.display =
            "none";


          try {

            await scanner.stop();

          } catch {}


          cameraTrack =
            null;


          document.getElementById(
            "reader"
          ).style.display =
            "none";

          document.getElementById(
            "scan-box"
          ).style.display =
            "none";


          document.getElementById(
            "result-text"
          ).textContent =
            result;

          document.getElementById(
            "result-text"
          ).style.display =
            "block";


          const openButton =
            document.getElementById(
              "open-button"
            );

          openButton.textContent =
            isPrinterLink
              ? "Print"
              : "Open";

          openButton.style.display =
            "block";


          document.getElementById(
            "rescan"
          ).style.display =
            "block";


          devLog(
            "QR accepted: " +
            result
          );

        }

      },

      function() {}

    );


    setTimeout(
      positionScanRegion,
      100
    );

    setTimeout(
      positionScanRegion,
      300
    );

    setTimeout(
      positionScanRegion,
      700
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    /*
      Keep "Ready to scan".
    */

    status.textContent =
      "Ready to scan";

    status.className =
      "";


    setTimeout(
      function() {

        const video =
          document.querySelector(
            "#reader video"
          );

        if (
          video &&
          video.srcObject
        ) {

          const tracks =
            video.srcObject
              .getVideoTracks();

          if (
            tracks.length
          ) {

            cameraTrack =
              tracks[0];

            devLog(
              "Camera track ready"
            );

          }

        }

      },
      700
    );


    devLog(
      "Camera started"
    );

  } catch(error) {

    failedScans++;

    document.getElementById(
      "loading"
    ).style.display =
      "none";

    status.textContent =
      "Camera unavailable";

    devLog(
      "CAMERA ERROR: " +
      error.message
    );

  }

}
