<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    #camera {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 28px;
      background: #000;
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    /* Hide only the controls generated by the scanner library */
    #reader__dashboard {
      display: none !important;
    }

    #reader__header_message {
      display: none !important;
    }

    #loading {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #333;
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <div id="camera">

      <div id="reader"></div>

      <div id="loading">
        <div class="spinner"></div>
      </div>

    </div>

  </div>


  <script>

    let scanner = null;

    async function startScanner() {

      scanner = new Html5Qrcode("reader");

      try {

        await scanner.start(

          {
            facingMode: "environment"
          },

          {
            fps: 10,
            qrbox: 250
          },

          function(decodedText) {

            console.log(
              "QR CODE:",
              decodedText
            );

          },

          function(errorMessage) {

            // Normal scanning errors are ignored.

          }

        );

        document.getElementById("loading")
          .style.display = "none";

      }

      catch(error) {

        console.error(
          "CAMERA ERROR:",
          error
        );

        document.getElementById("loading")
          .style.display = "none";

      }

    }


    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>
</html>
