<!--
  PRINTER SCANNER 5000
  VERSION: 5.4

  NEW IN VERSION 5.4:
  - Replaced hamburger menu with a house icon
  - Added full Home screen
  - Home screen uses large app-style buttons
  - Added Barcode / QR scanner mode switching
  - Barcode mode uses a rectangular scan region
  - QR mode uses a square 250x250 scan region
  - Added Barcode & QR Catalog
  - Catalog remembers every scanned code
  - Catalog supports custom names
  - Custom names are displayed when codes are scanned again
  - Raw barcode / QR value remains visible
  - Catalog supports sorting
  - Scanner mode is saved locally
  - Printer status remains saved locally
  - Scan history remains saved locally
-->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Printer Scanner 5000</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #000;

  overflow: hidden;

  font-family:
    Arial,
    sans-serif;
}

body {
  color: white;
}

#app {

  width: 100%;
  height: 100%;

  display: flex;

  flex-direction: column;

  background: #000;
}


/* =========================================================
   TOP BAR
========================================================= */

#top-bar {

  position: relative;

  width: 100%;
  height: 65px;

  flex-shrink: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #000;

  z-index: 1000;
}

#site-title {

  color: white;

  font-size: 24px;

  font-weight: 700;

  text-align: center;

  white-space: nowrap;

  user-select: none;
}


/* =========================================================
   HOUSE BUTTON
========================================================= */

#home-button {

  position: absolute;

  left: 12px;
  top: 50%;

  transform:
    translateY(-50%);

  width: 44px;
  height: 44px;

  border: none;

  background: transparent;

  color: white;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 5000;

  padding: 0;
}

#home-button:active {

  transform:
    translateY(-50%)
    scale(.90);
}


/*
  Simple black-and-white house icon
*/

.house-icon {

  position: relative;

  display: block;

  width: 27px;
  height: 27px;

  border:
    3px solid currentColor;

  border-top: none;

  border-radius:
    2px 2px 5px 5px;

  margin-top: 7px;
}

.house-icon::before {

  content: "";

  position: absolute;

  width: 19px;
  height: 19px;

  left: 1px;
  top: -10px;

  border-left:
    3px solid currentColor;

  border-top:
    3px solid currentColor;

  transform:
    rotate(45deg);

  background: #000;

  border-radius: 2px;
}

.house-icon::after {

  content: "";

  position: absolute;

  width: 7px;
  height: 12px;

  left: 7px;
  bottom: 0;

  border:
    2px solid currentColor;

  border-bottom: none;

  border-radius:
    4px 4px 0 0;
}


/* =========================================================
   CAMERA
========================================================= */

#camera {

  position: relative;

  width: 100%;

  height:
    calc(100% - 65px);

  overflow: hidden;

  border-radius:
    28px 28px 0 0;

  background: #000;

  z-index: 1;
}

#reader {

  position: absolute;

  inset: 0;

  width: 100% !important;
  height: 100% !important;

  border: none !important;

  overflow: hidden;

  z-index: 4;
}

#reader video {

  width: 100% !important;
  height: 100% !important;

  object-fit: cover !important;

  display: block !important;
}

#reader__dashboard,
#reader__header_message {

  display: none !important;
}


/* =========================================================
   SCAN REGIONS
========================================================= */

/*
  QR MODE
  Square 250x250
*/

body.qr-mode #reader__scan_region {

  width: 250px !important;
  height: 250px !important;

  min-width: 250px !important;
  min-height: 250px !important;

  max-width: 250px !important;
  max-height: 250px !important;
}


/*
  BARCODE MODE
  Wide rectangular region
*/

body.barcode-mode #reader__scan_region {

  width: 330px !important;
  height: 145px !important;

  min-width: 330px !important;
  min-height: 145px !important;

  max-width: 330px !important;
  max-height: 145px !important;
}


#reader__scan_region {

  position: absolute !important;

  left: 50% !important;
  top: 50% !important;

  transform:
    translate(-50%, -50%) !important;

  margin: 0 !important;

  padding: 0 !important;

  border: none !important;

  overflow: hidden !important;

  pointer-events: none !important;
}

#reader__scan_region img {

  display: none !important;
}


/* =========================================================
   SCAN BOX
========================================================= */

#scan-box {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  pointer-events: none;

  z-index: 20;

  border:
    3px solid white;

  background:
    transparent;
}

body.qr-mode #scan-box {

  width: 250px;
  height: 250px;

  border-radius: 18px;
}

body.barcode-mode #scan-box {

  width: 330px;
  height: 145px;

  border-radius: 14px;
}


/* =========================================================
   MODE INDICATOR
========================================================= */

#mode-indicator {

  position: absolute;

  left: 50%;

  top: 20px;

  transform:
    translateX(-50%);

  z-index: 40;

  padding:
    7px 15px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  color: white;

  font-size: 12px;

  font-weight: 700;

  letter-spacing: .5px;

  text-transform: uppercase;

  white-space: nowrap;
}


/* =========================================================
   STATUS
========================================================= */

#status-bar {

  position: absolute;

  left: 50%;

  top:
    calc(50% - 185px);

  transform:
    translateX(-50%);

  z-index: 40;

  padding:
    9px 18px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  color: white;

  font-size: 14px;

  font-weight: 600;

  white-space: nowrap;
}

#status-bar.detected {

  background:
    rgba(255,170,0,.8);
}


/* =========================================================
   HOLD STILL
========================================================= */

#hold-still {

  position: absolute;

  left: 50%;

  top:
    calc(50% + 155px);

  transform:
    translateX(-50%);

  z-index: 30;

  padding:
    9px 16px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  color: white;

  font-size: 15px;

  font-weight: 600;

  white-space: nowrap;

  display: none;
}


/* =========================================================
   CONTROL BAR
========================================================= */

#control-bar {

  position: absolute;

  left: 50%;
  bottom: 45px;

  transform:
    translateX(-50%);

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  width: min(94%, 600px);
}


/* =========================================================
   ZOOM
========================================================= */

#zoom-container {

  height: 48px;

  flex: 1;

  min-width: 180px;
  max-width: 350px;

  padding:
    10px 16px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  display: flex;

  align-items: center;

  gap: 10px;
}

#zoom-label {

  color: white;

  font-size: 13px;

  font-weight: 600;

  white-space: nowrap;
}

#zoom-slider {

  width: 100%;
  height: 5px;

  accent-color: white;

  cursor: pointer;
}

#zoom-value {

  min-width: 35px;

  color: white;

  font-size: 13px;

  text-align: right;
}


/* =========================================================
   CIRCLE BUTTONS
========================================================= */

.circle-button {

  width: 48px;
  height: 48px;

  flex-shrink: 0;

  border-radius: 50%;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  transition: .15s;
}

.circle-button:active {

  transform:
    scale(.9);
}

.circle-button.active {

  background: white;

  color: black;

  border:
    2px solid white;
}

.circle-button:not(.active) {

  background: black;

  color: white;

  border:
    2px solid white;
}


/* =========================================================
   ICONS
========================================================= */

.icon {

  position: relative;

  display: block;

  width: 22px;
  height: 22px;

  color: currentColor;

  pointer-events: none;
}

.flashlight-icon::before {

  content: "";

  position: absolute;

  left: 7px;
  top: 2px;

  width: 9px;
  height: 15px;

  border:
    2px solid currentColor;

  border-radius: 3px;
}

.flashlight-icon::after {

  content: "";

  position: absolute;

  left: 8px;
  bottom: 1px;

  width: 7px;
  height: 5px;

  border-left:
    2px solid currentColor;

  border-right:
    2px solid currentColor;
}

.sound-icon::before {

  content: "";

  position: absolute;

  left: 2px;
  top: 8px;

  width: 7px;
  height: 7px;

  background:
    currentColor;

  border-radius: 1px;
}

.sound-icon::after {

  content: "";

  position: absolute;

  left: 7px;
  top: 4px;

  width: 9px;
  height: 14px;

  background:
    currentColor;

  clip-path:
    polygon(
      0 35%,
      35% 35%,
      100% 0,
      100% 100%,
      35% 65%,
      0 65%
    );
}


/* =========================================================
   LOADING
========================================================= */

#loading {

  position: absolute;

  inset: 0;

  background: #000;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 50;
}

.spinner {

  width: 28px;
  height: 28px;

  border:
    3px solid #333;

  border-top:
    3px solid white;

  border-radius: 50%;

  animation:
    spin .6s linear infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================================================
   RESULT
========================================================= */

#result-text {

  position: absolute;

  left: 50%;
  top: 12%;

  transform:
    translateX(-50%);

  z-index: 50;

  width: 85%;

  max-width: 700px;

  color: white;

  font-size: 36px;

  font-weight: 700;

  text-align: center;

  line-height: 1.25;

  display: none;
}

#result-code {

  position: absolute;

  left: 50%;

  top: 34%;

  transform:
    translateX(-50%);

  z-index: 50;

  width: 85%;

  max-width: 700px;

  color:
    rgba(255,255,255,.65);

  font-size: 15px;

  text-align: center;

  word-break: break-all;

  display: none;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.action-button {

  position: absolute;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 50;

  border: none;

  padding:
    18px 38px;

  border-radius: 999px;

  background: white;

  color: #111;

  font-size: 20px;

  font-weight: 600;

  cursor: pointer;
}

.action-button:active {

  transform:
    translateX(-50%)
    scale(.95);
}

#open-button {

  top: 55%;

  display: none;
}

#rescan {

  top: 70%;

  display: none;
}


/* =========================================================
   VERSION
========================================================= */

#version-number {

  position: absolute;

  left: 50%;
  bottom: 6px;

  transform:
    translateX(-50%);

  z-index: 100;

  color:
    rgba(255,255,255,.45);

  font-size: 9px;

  pointer-events: none;
}


/* =========================================================
   HOME PAGE
========================================================= */

#home-page {

  position: absolute;

  inset: 0;

  z-index: 4000;

  background: #000;

  display: none;

  overflow-y: auto;

  padding:
    30px 18px 40px;
}

#home-page.visible {

  display: block;
}

#home-page-header {

  display: flex;

  align-items: center;
  justify-content: space-between;

  width: 100%;

  max-width: 850px;

  margin:
    0 auto 25px;
}

#home-page-title {

  font-size: 34px;

  font-weight: 800;

  color: white;
}

.home-close {

  width: 48px;
  height: 48px;

  border:
    2px solid white;

  border-radius: 50%;

  background: #000;

  color: white;

  font-size: 25px;

  cursor: pointer;
}

.home-close:active {

  transform: scale(.9);
}


/* =========================================================
   HOME APP GRID
========================================================= */

#home-grid {

  width: 100%;

  max-width: 850px;

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(150px, 1fr)
    );

  gap: 14px;
}

.home-app {

  min-height: 135px;

  border:
    2px solid #333;

  border-radius: 22px;

  background: #111;

  color: white;

  cursor: pointer;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 12px;

  transition: .15s;

  padding: 15px;
}

.home-app:hover {

  border-color: white;

  background: #181818;
}

.home-app:active {

  transform: scale(.96);
}

.home-app-icon {

  font-size: 38px;

  line-height: 1;
}

.home-app-title {

  font-size: 16px;

  font-weight: 700;

  text-align: center;
}

.home-app-description {

  font-size: 11px;

  color: #888;

  text-align: center;
}


/* =========================================================
   SCANNER MODE APP
========================================================= */

#mode-card {

  grid-column:
    1 / -1;

  min-height: 100px;

  flex-direction: row;

  justify-content: space-between;

  padding:
    20px 25px;
}

#mode-card-left {

  display: flex;

  align-items: center;

  gap: 15px;
}

#current-mode-name {

  font-size: 18px;

  font-weight: 700;
}

#current-mode-description {

  color: #888;

  font-size: 12px;

  margin-top: 4px;
}

.mode-switch {

  min-width: 135px;

  border:
    2px solid white;

  border-radius: 999px;

  background: white;

  color: black;

  padding:
    12px 16px;

  font-size: 14px;

  font-weight: 700;

  cursor: pointer;
}


/* =========================================================
   HISTORY
========================================================= */

#history-panel {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: min(90%, 420px);

  max-height: 75%;

  overflow-y: auto;

  padding: 16px;

  background: #111;

  border:
    1px solid #333;

  border-radius: 20px;

  z-index: 500;

  display: none;
}

#history-title {

  color: white;

  font-size: 20px;

  font-weight: 700;

  margin-bottom: 12px;
}

.history-item {

  padding: 12px;

  margin: 6px 0;

  background: #222;

  border-radius: 12px;

  color: white;

  cursor: pointer;
}

.history-name {

  font-weight: 700;
}

.history-url {

  margin-top: 4px;

  font-size: 11px;

  color: #aaa;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.history-time {

  margin-top: 4px;

  font-size: 10px;

  color: #777;
}

.history-close {

  width: 100%;

  margin-top: 10px;

  border: none;

  border-radius: 12px;

  padding: 12px;

  background: #333;

  color: white;

  font-weight: 600;
}


/* =========================================================
   CATALOG
========================================================= */

#catalog-panel {

  position: absolute;

  inset: 0;

  z-index: 3500;

  background: #000;

  display: none;

  overflow-y: auto;

  padding:
    25px 18px 40px;
}

#catalog-panel.visible {

  display: block;
}

#catalog-header {

  width: 100%;

  max-width: 850px;

  margin:
    0 auto 20px;

  display: flex;

  align-items: center;

  justify-content: space-between;
}

#catalog-title {

  font-size: 30px;

  font-weight: 800;
}

.catalog-back {

  border:
    2px solid white;

  background: #000;

  color: white;

  border-radius: 999px;

  padding:
    10px 18px;

  font-weight: 700;

  cursor: pointer;
}


/* =========================================================
   CATALOG CONTROLS
========================================================= */

#catalog-controls {

  width: 100%;

  max-width: 850px;

  margin: 0 auto 18px;

  display: flex;

  gap: 10px;

  flex-wrap: wrap;
}

.catalog-select,
.catalog-search {

  flex: 1;

  min-width: 160px;

  padding:
    13px 14px;

  border:
    2px solid #333;

  border-radius: 13px;

  background: #111;

  color: white;

  font-size: 14px;

  outline: none;
}

.catalog-select:focus,
.catalog-search:focus {

  border-color: white;
}


/* =========================================================
   CATALOG LIST
========================================================= */

#catalog-list {

  width: 100%;

  max-width: 850px;

  margin: 0 auto;
}

.catalog-item {

  background: #111;

  border:
    1px solid #333;

  border-radius: 18px;

  padding: 17px;

  margin-bottom: 10px;
}

.catalog-item-top {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  gap: 10px;
}

.catalog-item-name {

  font-size: 18px;

  font-weight: 800;

  word-break: break-word;
}

.catalog-item-type {

  flex-shrink: 0;

  border-radius: 999px;

  background: #222;

  color: #aaa;

  padding:
    5px 9px;

  font-size: 10px;

  font-weight: 700;

  text-transform: uppercase;
}

.catalog-item-code {

  margin-top: 9px;

  color: #aaa;

  font-size: 12px;

  word-break: break-all;

  line-height: 1.4;
}

.catalog-item-time {

  margin-top: 7px;

  color: #666;

  font-size: 10px;
}

.catalog-item-buttons {

  display: flex;

  gap: 8px;

  margin-top: 12px;
}

.catalog-small-button {

  flex: 1;

  border: none;

  border-radius: 10px;

  background: #222;

  color: white;

  padding: 10px;

  font-weight: 700;

  cursor: pointer;
}

.catalog-small-button:active {

  background: #333;
}

.catalog-empty {

  padding: 40px 20px;

  text-align: center;

  color: #777;

  border:
    1px dashed #333;

  border-radius: 18px;
}


/* =========================================================
   CATALOG EDITOR
========================================================= */

#catalog-editor {

  position: fixed;

  inset: 0;

  z-index: 6000;

  background:
    rgba(0,0,0,.85);

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

#catalog-editor.visible {

  display: flex;
}

#catalog-editor-box {

  width: min(95%, 500px);

  background: #111;

  border:
    1px solid #444;

  border-radius: 22px;

  padding: 22px;
}

#catalog-editor-title {

  font-size: 22px;

  font-weight: 800;

  margin-bottom: 15px;
}

#catalog-editor-code {

  color: #888;

  font-size: 12px;

  word-break: break-all;

  margin-bottom: 15px;
}

#catalog-name-input {

  width: 100%;

  padding: 15px;

  border:
    2px solid #444;

  border-radius: 13px;

  background: #000;

  color: white;

  font-size: 17px;

  outline: none;
}

#catalog-name-input:focus {

  border-color: white;
}

.catalog-editor-buttons {

  display: flex;

  gap: 10px;

  margin-top: 15px;
}

.catalog-editor-button {

  flex: 1;

  border: none;

  border-radius: 12px;

  padding: 13px;

  font-weight: 700;

  cursor: pointer;
}

.catalog-save {

  background: white;

  color: black;
}

.catalog-cancel {

  background: #333;

  color: white;
}


/* =========================================================
   NOTES
========================================================= */

#notes-panel {

  position: absolute;

  inset: 0;

  z-index: 2000;

  background: #000;

  padding:
    30px 20px;

  overflow-y: auto;

  display: none;

  pointer-events: none;
}

#notes-title {

  color: white;

  font-size: 30px;

  font-weight: 700;

  text-align: center;

  margin-bottom: 30px;
}

.note-section {

  width: 100%;

  max-width: 600px;

  margin:
    0 auto 22px;
}

.note-section label {

  display: block;

  color: white;

  font-size: 18px;

  font-weight: 700;

  margin-bottom: 8px;
}

.status-select {

  width: 100%;

  padding:
    14px 16px;

  border:
    2px solid #444;

  border-radius: 14px;

  background: #111;

  color: white;

  font-family: Arial, sans-serif;

  font-size: 17px;

  font-weight: 600;

  outline: none;

  cursor: pointer;

  appearance: auto;
}

.status-select:focus {

  border-color: white;
}

.notes-save,
.notes-back {

  position: relative;

  left: auto;
  top: auto;

  transform: none;

  display: block;

  width: min(90%, 400px);

  margin:
    12px auto;
}

.notes-save:active,
.notes-back:active {

  transform:
    scale(.95);
}


/* =========================================================
   DEV PANEL
========================================================= */

#dev-panel {

  display: none;

  width: 100%;

  height: 50%;

  flex-shrink: 0;

  background: #000;

  border-top:
    2px solid #333;

  color: white;

  overflow: hidden;

  flex-direction: column;
}

#dev-header {

  height: 40px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  padding-left: 14px;

  background: #111;

  border-bottom:
    1px solid #333;

  font-size: 14px;

  font-weight: 700;
}

#dev-output {

  flex: 1;

  overflow-y: auto;

  padding: 10px;

  font-family:
    "Courier New",
    monospace;

  font-size: 12px;

  line-height: 1.5;

  white-space: pre-wrap;

  word-break: break-word;
}

.dev-line {

  margin-bottom: 3px;
}

#dev-stats {

  padding: 10px;

<script>

/* =========================================================
   VARIABLES
========================================================= */

let scanner = null;

let firstDetection = null;

let detectedText = null;

let detectedFormat = null;

let scanConfirmed = false;

let scannedURL = null;

let isPrinterLink = false;

let cameraTrack = null;

let devMode = false;

let lightMode = false;

let flashlightOn = false;

let soundEnabled = true;

let scanCount = 0;

let successfulScans = 0;

let failedScans = 0;

let scanStartTime = null;

let lastScanTime = 0;

let currentCatalogCode = null;

let currentCatalogType = null;

let scannerStarting = false;

let scannerRestarting = false;


/* =========================================================
   SCANNER CONSTANTS
========================================================= */

const HOLD_TIME = 600;

const QR_SIZE = 250;

const BARCODE_WIDTH = 330;

const BARCODE_HEIGHT = 145;


/* =========================================================
   SCANNER MODE
========================================================= */

let scannerMode =
  localStorage.getItem(
    "printerScannerMode"
  ) || "qr";


/*
  QR formats
*/

function getQRFormats() {

  return [

    Html5QrcodeSupportedFormats.QR_CODE

  ];

}


/*
  Barcode formats

  This deliberately does NOT include QR_CODE.
*/

function getBarcodeFormats() {

  const formats = [];

  const possibleFormats = [

    "CODE_128",
    "CODE_39",
    "CODE_93",
    "CODABAR",
    "EAN_13",
    "EAN_8",
    "ITF",
    "UPC_A",
    "UPC_E",
    "DATA_MATRIX",
    "PDF_417"

  ];


  possibleFormats.forEach(
    function(name) {

      if (
        Html5QrcodeSupportedFormats[name]
        !== undefined
      ) {

        formats.push(
          Html5QrcodeSupportedFormats[name]
        );

      }

    }
  );


  /*
    Remove QR_CODE if somehow
    included by the library.
  */

  return formats.filter(
    function(format) {

      return (
        format !==
        Html5QrcodeSupportedFormats.QR_CODE
      );

    }
  );

}


/* =========================================================
   APPLY MODE
========================================================= */

function applyScannerModeUI() {

  document.body.classList.toggle(
    "qr-mode",
    scannerMode === "qr"
  );

  document.body.classList.toggle(
    "barcode-mode",
    scannerMode === "barcode"
  );


  const indicator =
    document.getElementById(
      "mode-indicator"
    );


  const name =
    document.getElementById(
      "current-mode-name"
    );


  const description =
    document.getElementById(
      "current-mode-description"
    );


  const icon =
    document.getElementById(
      "mode-card-icon"
    );


  if (
    scannerMode === "barcode"
  ) {

    indicator.textContent =
      "BARCODE MODE";

    name.textContent =
      "Barcode Scanner";

    description.textContent =
      "Wide rectangular scanning area";

    icon.textContent =
      "▤";

  } else {

    indicator.textContent =
      "QR MODE";

    name.textContent =
      "QR Scanner";

    description.textContent =
      "Square 250×250 scanning area";

    icon.textContent =
      "▣";

  }

}


/* =========================================================
   SWITCH MODE
========================================================= */

async function toggleScannerMode() {

  if (scannerRestarting)
    return;


  scannerMode =
    scannerMode === "qr"
      ? "barcode"
      : "qr";


  localStorage.setItem(

    "printerScannerMode",

    scannerMode

  );


  applyScannerModeUI();


  devLog(
    "Scanner mode changed to " +
    scannerMode.toUpperCase()
  );


  hideHomePage();


  /*
    Restart the scanner so the
    decoding format changes too.
  */

  await restartScanner();

}


/* =========================================================
   RESTART SCANNER
========================================================= */

async function restartScanner() {

  if (scannerRestarting)
    return;


  scannerRestarting = true;


  const loading =
    document.getElementById(
      "loading"
    );


  loading.style.display =
    "flex";


  scanConfirmed =
    false;

  firstDetection =
    null;

  detectedText =
    null;

  detectedFormat =
    null;

  scannedURL =
    null;

  isPrinterLink =
    false;


  document.getElementById(
    "result-text"
  ).style.display =
    "none";


  document.getElementById(
    "result-code"
  ).style.display =
    "none";


  document.getElementById(
    "open-button"
  ).style.display =
    "none";


  document.getElementById(
    "rescan"
  ).style.display =
    "none";


  document.getElementById(
    "control-bar"
  ).style.display =
    "flex";


  document.getElementById(
    "version-number"
  ).style.display =
    "block";


  document.getElementById(
    "scan-box"
  ).style.display =
    "block";


  document.getElementById(
    "reader"
  ).style.display =
    "block";


  if (scanner) {

    try {

      await scanner.stop();

    } catch(error) {

      devLog(
        "Scanner stop during mode change: " +
        error.message
      );

    }

    try {

      scanner.clear();

    } catch {}

    scanner =
      null;

  }


  cameraTrack =
    null;


  /*
    Give html5-qrcode a moment to
    clean up its video element.
  */

  await new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        200
      );

    }
  );


  scannerRestarting =
    false;


  startScanner();

}


/* =========================================================
   DEV LOG
========================================================= */

function devLog(message) {

  const output =
    document.getElementById(
      "dev-output"
    );

  if (!output)
    return;


  const line =
    document.createElement(
      "div"
    );


  line.className =
    "dev-line";


  line.textContent =
    "[" +
    new Date().toLocaleTimeString() +
    "] " +
    message;


  output.appendChild(
    line
  );


  output.scrollTop =
    output.scrollHeight;


  updateStats();

}


function updateStats() {

  const stats =
    document.getElementById(
      "dev-stats"
    );

  if (!stats)
    return;


  stats.textContent =
    "Scans: " +
    scanCount +
    " | Successful: " +
    successfulScans +
    " | Failed: " +
    failedScans +
    " | Last scan: " +
    lastScanTime +
    " ms";

}


/* =========================================================
   HOME PAGE
========================================================= */

function showHomePage() {

  document.body.classList.add(
    "home-open"
  );


  document.getElementById(
    "home-page"
  ).classList.add(
    "visible"
  );


  document.getElementById(
    "home-page"
  ).scrollTop = 0;


  applyScannerModeUI();


  devLog(
    "Home screen opened"
  );

}


function hideHomePage() {

  document.body.classList.remove(
    "home-open"
  );


  document.getElementById(
    "home-page"
  ).classList.remove(

function reacquireCameraTrack() {

  const video =
    document.querySelector(
      "#reader video"
    );


  if (
    video &&
    video.srcObject
  ) {

    const tracks =
      video.srcObject
        .getVideoTracks();


    if (
      tracks.length > 0
    ) {

      cameraTrack =
        tracks[0];


      return true;

    }

  }


  return false;

}

async function toggleFlashlight() {

  if (!cameraTrack) {

    reacquireCameraTrack();

  }


  if (!cameraTrack) {

    devLog(
      "Flashlight unavailable"
    );

    return;

  }


  try {

    const capabilities =
      cameraTrack.getCapabilities();


    if (
      !capabilities.torch
    ) {

      devLog(
        "Camera does not support flashlight"
      );

      return;

    }


    flashlightOn =
      !flashlightOn;


    await cameraTrack.applyConstraints({

      advanced: [

        {
          torch:
            flashlightOn
        }

      ]

    });


    document
      .getElementById(
        "flashlight-button"
      )
      .classList.toggle(
        "active",
        flashlightOn
      );


  } catch(error) {

    flashlightOn =

/* =========================================================
   SOUND
========================================================= */

function toggleSound() {

  soundEnabled =
    !soundEnabled;


  document
    .getElementById(
      "sound-button"
    )
    .classList.toggle(
      "active",
      soundEnabled
    );

}


function playScanSound() {

  if (!soundEnabled)
    return;


  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext)
      return;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.frequency.value =
      880;


    oscillator.type =
      "sine";


    gain.gain.value =
      0.08;


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.start();


    oscillator.stop(
      audio.currentTime +
      0.12
    );


  } catch {

    devLog(
      "Sound error"
    );

  }

}

========================================================= */

function getCatalog() {

    return JSON.parse(

      localStorage.getItem(
        "printerScannerCatalog"

    ) || [];

  } catch {

/*
  Find a code in the catalog.
*/

function findCatalogItem(
  code
) {

  const catalog =
    getCatalog();


  return catalog.find(
    function(item) {

      return item.code === code;

    }
  );

}


/*
  Add or update a scanned code.
*/

function registerCatalogScan(
  code,
  type
) {

  if (!code)
    return;


  const catalog =
    getCatalog();


  let item =
    catalog.find(
      function(entry) {

        return entry.code === code;

      }
    );


  if (item) {

    item.lastScanned =
      Date.now();

    item.type =
      type;

  } else {

    item = {

      code:
        code,

      type:
        type,

      name:
        "",

      firstScanned:
        Date.now(),

      lastScanned:
        Date.now()

    };


    catalog.push(
      item
    );

  }


  saveCatalog(
    catalog
  );


  return item;

}


/*
  What should appear when a code
  is scanned?
*/

function getDisplayName(
  code,
  type
) {

  const item =
    findCatalogItem(
      code
    );


  /*
    If user named the code,
    ALWAYS use their name.
  */

  if (
    item &&
    item.name &&
    item.name.trim()
  ) {

    return item.name;

  }


  /*
    QR codes can still use the
    existing website recognition.
  */

  if (type === "qr") {

    return getQRText(
      code
    );

  }


  /*
    Unnamed barcode:
    show the barcode number.
  */

  return code;

}

/* =========================================================
   RENDER CATALOG
========================================================= */

function renderCatalog() {

  const list =
    document.getElementById(
      "catalog-list"
    );


  const search =
    (
      document.getElementById(
        "catalog-search"
      ).value || ""
    )
      .toLowerCase()
      .trim();


  const sort =
    document.getElementById(
      "catalog-sort"
    ).value;


  const filter =
    document.getElementById(
      "catalog-filter"
    ).value;


  let catalog =
    getCatalog();


  /*
    Filter type
  */

  if (
    filter !== "all"
  ) {

    catalog =
      catalog.filter(
        function(item) {

          return item.type === filter;

        }
      );

  }


  /*
    Search
  */

  if (search) {

    catalog =
      catalog.filter(
        function(item) {

          return (

            item.code
              .toLowerCase()
              .includes(search)

            ||

            (
              item.name || ""
            )
              .toLowerCase()
              .includes(search)

          );

        }
      );

  }


  /*
    Sort
  */

  catalog.sort(
    function(a, b) {

      if (
        sort === "name"
      ) {

        return (
          (
            a.name ||
            a.code
          )
            .toLowerCase()
            .localeCompare(
              (
                b.name ||
                b.code
              )
                .toLowerCase()
            )
        );

      }


      if (
        sort === "code"
      ) {

        return a.code
          .localeCompare(
            b.code
          );

      }


      if (
        sort === "type"
      ) {

        return a.type
          .localeCompare(
            b.type
          );

      }


      return (
        b.lastScanned -
        a.lastScanned
      );

    }
  );


  list.innerHTML =
    "";


  if (
    catalog.length === 0
  ) {

    list.innerHTML =
      '<div class="catalog-empty">' +
      'No codes in your catalog yet.<br><br>' +
      'Scan a QR code or barcode and it will appear here.' +
      '</div>';

    return;

  }


  catalog.forEach(
    function(item) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "catalog-item";


      const displayName =
        item.name &&
        item.name.trim()
          ? item.name
          : (
              item.type === "qr"
                ? getQRText(
                    item.code
                  )
                : item.code
            );


      div.innerHTML =

        '<div class="catalog-item-top">' +

          '<div class="catalog-item-name">' +
            escapeHTML(
              displayName
            ) +
          '</div>' +

          '<div class="catalog-item-type">' +
            escapeHTML(
              item.type
            ) +
          '</div>' +

        '</div>' +

        '<div class="catalog-item-code">' +
          escapeHTML(
            item.code
          ) +
        '</div>' +

        '<div class="catalog-item-time">' +
          'Last scanned: ' +
          escapeHTML(
            new Date(
              item.lastScanned
            ).toLocaleString()
          ) +
        '</div>' +

        '<div class="catalog-item-buttons">' +

          '<button ' +
            'class="catalog-small-button" ' +
            'onclick="openCatalogEditor(\'' +
              encodeURIComponent(
                item.code
              ) +
            '\')"' +
          '>' +
            (
              item.name
                ? "Rename"
                : "Name Code"
            ) +
          '</button>' +

          '<button ' +
            'class="catalog-small-button" ' +
            'onclick="deleteCatalogItem(\'' +
              encodeURIComponent(
                item.code
              ) +
            '\')"' +
          '>' +
            'Delete' +
          '</button>' +

        '</div>';


      list.appendChild(
        div
      );

    }
  );

}

function saveCatalogName() {

  if (!currentCatalogCode)
    return;


  const input =
    document.getElementById(
      "catalog-name-input"
    );


  const name =
    input.value.trim();


  const catalog =
    getCatalog();


  const item =

          entry.code ===
          currentCatalogCode
        );

      }
    );

      name ||
      "[unnamed]"
    )
  );

  renderCatalog();

function deleteCatalogItem(
  encodedCode
) {

  const code =
    decodeURIComponent(
      encodedCode
    );


  const catalog =
    getCatalog();


  const newCatalog =
    catalog.filter(
      function(item) {

        return item.code !== code;

      }
    );


  saveCatalog(
    newCatalog
  );


  devLog(
    "Deleted catalog item"
  );


  renderCatalog();

}


/* =========================================================
   SITE NAME
========================================================= */

function getSiteName(url) {

  try {

    let fixedURL =
      url;


    if (

      !fixedURL.startsWith(
        "http://"
      )

      &&

      !fixedURL.startsWith(
        "https://"
      )

    ) {

      fixedURL =
        "https://" +
        fixedURL;

    }


    const parsed =
      new URL(
        fixedURL
      );


    let hostname =
      parsed.hostname.replace(
        /^www\./,
        ""
      );


    const knownSites = {

      "youtube.com":
        "YouTube",

      "google.com":
        "Google",

      "github.com":
        "GitHub",

      "amazon.com":
        "Amazon",

      "apple.com":
        "Apple",

      "facebook.com":
        "Facebook",

      "instagram.com":
        "Instagram",

      "tiktok.com":
        "TikTok",

      "reddit.com":
        "Reddit",

      "microsoft.com":
        "Microsoft",

      "bambulab.com":
        "Bambu Lab",

      "makerworld.com":
        "MakerWorld"

    };


    if (
      knownSites[hostname]
    ) {

      return knownSites[
        hostname
      ];

    }


    const parts =
      hostname.split(".");


    if (
      parts.length >= 2
    ) {

      const name =
        parts[
          parts.length - 2
        ];


      return (

        name
          .charAt(0)
          .toUpperCase() +

        name.slice(1)

      );

    }


    return hostname;


  } catch {

    return "QR Code Found";

  }

}


/* =========================================================
   QR RESULT
========================================================= */

function getQRText(url) {

  try {

    const parsedURL =
      new URL(

        url.startsWith("http")
          ? url
          : "https://" + url

      );


    const cleanURL =
      parsedURL.origin +
      parsedURL.pathname;


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1166269606"

    ) {

      isPrinterLink =
        true;

      return "TOYBOX Found";

    }


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1658133862"

    ) {

      isPrinterLink =
        true;

      return "Ender 3 Found";

    }


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1625671285"

    ) {

      isPrinterLink =
        true;

      return "This is to print with the H2D";

    }


    if (

      parsedURL.origin ===
      "https://makerworld.com"

      &&

      parsedURL.pathname ===
      "/en"

    ) {

      isPrinterLink =
        false;

      return "This opens MakerWorld, which is for the H2D, I just put the wrong text on the QR code :/";

    }


    isPrinterLink =
      false;


    return getSiteName(
      url
    );


  } catch {

    isPrinterLink =
      false;

    return "QR Code Found";

  }

}


/* =========================================================
   ZOOM
========================================================= */

async function setZoom(value) {

  const zoom =
    parseFloat(
      value
    );


  document.getElementById(
    "zoom-value"
  ).textContent =

    zoom.toFixed(1) +
    "×";


  if (!cameraTrack) {

    reacquireCameraTrack();

  }


  if (!cameraTrack)
    return;


  try {

    const capabilities =
      cameraTrack
        .getCapabilities();


    if (!capabilities.zoom) {

      devLog(
        "Camera does not support zoom"
      );

      return;

    }


    const actualZoom =

      capabilities.zoom.min +

      (
        (zoom - 1) / 4
      ) *

      (
        capabilities.zoom.max -
        capabilities.zoom.min
      );


    await cameraTrack.applyConstraints({

      advanced: [

        {
          zoom:
            actualZoom
        }

      ]

    });


  } catch(error) {

    devLog(
      "Zoom error: " +
      error.message
    );

  }

}


/* =========================================================
   POSITION SCAN REGION
========================================================= */

function positionScanRegion() {

  const region =
    document.getElementById(
      "reader__scan_region"
    );


  if (!region)
    return;


  region.style.position =
    "absolute";


  if (
    scannerMode === "barcode"
  ) {

    const width =
      window.innerWidth <= 500
        ? Math.min(
            BARCODE_WIDTH,
            window.innerWidth * .88
          )
        : BARCODE_WIDTH;


    region.style.width =
      width + "px";

    region.style.height =
      BARCODE_HEIGHT + "px";

    region.style.minWidth =
      width + "px";

    region.style.minHeight =
      BARCODE_HEIGHT + "px";

    region.style.maxWidth =
      width + "px";

    region.style.maxHeight =
      BARCODE_HEIGHT + "px";

  } else {

    region.style.width =
      QR_SIZE + "px";

    region.style.height =
      QR_SIZE + "px";

    region.style.minWidth =
      QR_SIZE + "px";

    region.style.minHeight =
      QR_SIZE + "px";

    region.style.maxWidth =
      QR_SIZE + "px";

    region.style.maxHeight =
      QR_SIZE + "px";

  }


  region.style.left =
    "50%";

  region.style.top =
    "50%";

  region.style.transform =
    "translate(-50%, -50%)";

  region.style.margin =
    "0";

  region.style.padding =
    "0";

  region.style.border =
    "none";

}


/* =========================================================
   FORMAT NAME
========================================================= */

function getFormatName(
  decodedResult
) {

  try {

    if (
      decodedResult &&
      decodedResult.result &&
      decodedResult.result.format
    ) {

      return String(
        decodedResult.result.format.formatName ||
        decodedResult.result.format
      );

    }

  } catch {}


  return scannerMode === "barcode"
    ? "barcode"
    : "qr";

}


/* =========================================================
   START SCANNER
========================================================= */

async function startScanner() {

  if (scannerStarting)
    return;


  scannerStarting =
    true;


  scanStartTime =
    Date.now();


  const status =
    document.getElementById(
      "status-bar"
    );


  status.textContent =
    "Starting camera...";


  applyScannerModeUI();


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const formats =
    scannerMode === "barcode"
      ? getBarcodeFormats()
      : getQRFormats();


  devLog(
    "Starting " +
    scannerMode.toUpperCase() +
    " scanner"
  );


  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {

        fps:
          scannerMode === "barcode"
            ? 20
            : 30,

        qrbox:

          scannerMode === "barcode"

            ? {

                width:
                  BARCODE_WIDTH,

                height:
                  BARCODE_HEIGHT

              }

            : {

                width:
                  QR_SIZE,

                height:
                  QR_SIZE

              },

        formatsToSupport:
          formats,

        disableFlip:
          false

      },


      async function(
        decodedText,
        decodedResult
      ) {

        if (
          scanConfirmed
        ) {

          return;

        }


        status.textContent =
          scannerMode === "barcode"
            ? "Barcode detected"
            : "QR detected";


        status.className =
          "detected";


        reacquireCameraTrack();


        if (
          firstDetection ===
          null
        ) {

          firstDetection =
            Date.now();

          detectedText =
            decodedText;

          detectedFormat =
            getFormatName(
              decodedResult
            );


          document.getElementById(
            "hold-still"
          ).style.display =
            "block";


          return;

        }


        if (
          decodedText !==
          detectedText
        ) {

          firstDetection =
            Date.now();

          detectedText =
            decodedText;

          detectedFormat =
            getFormatName(
              decodedResult
            );


          return;

        }


        if (

          Date.now() -
          firstDetection >=
          HOLD_TIME

        ) {

          scanConfirmed =
            true;


          scannedURL =
            decodedText;


          const scanType =
            scannerMode;


          successfulScans++;

          scanCount++;


          lastScanTime =
            Date.now() -
            scanStartTime;


          playScanSound();


          /*
            Put the code into the catalog
            before deciding what to display.
          */

          const catalogItem =
            registerCatalogScan(
              decodedText,
              scanType
            );


          /*
            IMPORTANT:

            If the user has assigned a
            custom name, it wins.

            Otherwise QR codes use the
            existing website recognition
            and barcodes show their value.
          */

          const result =
            getDisplayName(
              decodedText,
              scanType
            );


          /*
            For printer QR codes,
            getDisplayName() may set
            isPrinterLink.
          */

          saveHistory(
            decodedText,
            result,
            scanType
          );


          document.getElementById(
            "status-bar"
          ).style.display =
            "none";


          document.getElementById(
            "hold-still"
          ).style.display =
            "none";


          document.getElementById(
            "control-bar"
          ).style.display =
            "none";


          document.getElementById(
            "version-number"
          ).style.display =
            "none";


          try {

            await scanner.stop();

          } catch {}


          cameraTrack =
            null;


          document.getElementById(
            "reader"
          ).style.display =
            "none";


          document.getElementById(
            "scan-box"
          ).style.display =
            "none";


          document.getElementById(
            "mode-indicator"
          ).style.display =
            "none";


          /*
            Main custom name / result
          */

          document.getElementById(
            "result-text"
          ).textContent =
            result;


          document.getElementById(
            "result-text"
          ).style.display =
            "block";


          /*
            Always show the raw code
            underneath the name.
          */

          document.getElementById(
            "result-code"
          ).textContent =
            decodedText;


          document.getElementById(
            "result-code"
          ).style.display =
            "block";


          const openButton =
            document.getElementById(
              "open-button"
            );


          /*
            Barcodes generally aren't
            URLs, so don't offer Open
            unless the value looks like
            a URL.
          */

          const looksLikeURL =

            decodedText.startsWith(
              "http://"
            )

            ||

            decodedText.startsWith(
              "https://"
            )

            ||

            decodedText.includes(
              ".com"
            )

            ||

            decodedText.includes(
              ".net"
            )

            ||

            decodedText.includes(
              ".org"
            );


          if (
            scanType === "qr" ||
            looksLikeURL
          ) {

            openButton.textContent =
              isPrinterLink
                ? "Print"
                : "Open";

            openButton.style.display =
              "block";

          }


          document.getElementById(
            "rescan"
          ).style.display =
            "block";


          devLog(

            (
              scanType === "barcode"
                ? "Barcode"
                : "QR"
            ) +

            " accepted: " +

            result +

            " | Code: " +

            decodedText

          );

        }

      },


      function() {}

    );


    setTimeout(
      positionScanRegion,
      100
    );

    setTimeout(
      positionScanRegion,
      300
    );

    setTimeout(
      positionScanRegion,
      700
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    status.textContent =
      scannerMode === "barcode"
        ? "Ready to scan barcode"
        : "Ready to scan QR code";


    status.className =
      "";


    setTimeout(
      reacquireCameraTrack,
      700
    );


    devLog(
      "Camera started successfully"
    );


  } catch(error) {

    failedScans++;


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    status.textContent =
      "Camera unavailable";


    devLog(
      "CAMERA ERROR: " +
      error.message
    );

  }


  scannerStarting =
    false;

}


/* =========================================================
   OPEN SCANNED SITE
========================================================= */

function openScannedSite() {

  if (!scannedURL)
    return;


  let url =
    scannedURL;


  if (

    !url.startsWith(
      "http://"
    )

    &&

    !url.startsWith(
      "https://"
    )

  ) {

    url =
      "https://" +
      url;

  }


  window.open(
    url,
    "_blank"
  );

}


/* =========================================================
   RESCAN
========================================================= */

async function rescan() {

  /*
    Instead of reloading the whole
    page, restart the scanner.
  */

  await restartScanner();

}


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer =
  null;


function keepScannerLocked() {

  clearTimeout(
    resizeTimer
  );


  resizeTimer =
    setTimeout(

      function() {

        positionScanRegion();

      },

      50

    );

}


window.addEventListener(
  "resize",
  keepScannerLocked
);


window.addEventListener(

  "orientationchange",

  function() {

    setTimeout(

      keepScannerLocked,

      100

    );

  }

);


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(

  "keydown",

  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeCatalogEditor();

      hideCatalog();

      hideHistory();

      hideNotes();

      hideHomePage();

    }

  }

);


/* =========================================================
   START
========================================================= */

window.addEventListener(

  "load",

  function() {

    /*
      Make sure Notes starts hidden.
    */

    const notes =
      document.getElementById(
        "notes-panel"
      );


    notes.style.display =
      "none";


    notes.style.pointerEvents =
      "none";


    /*
      Apply saved scanner mode.
    */

    applyScannerModeUI();


    devLog(
      "Printer Scanner 5000"
    );


    devLog(
      "Version 5.4"
    );


    devLog(
      "Scanner mode: " +
      scannerMode.toUpperCase()
    );


    devLog(
      "QR area: FIXED 250x250"
    );


    devLog(
      "Barcode area: RECTANGULAR"
    );


    devLog(
      "Barcode catalog enabled"
    );


    devLog(
      "QR catalog enabled"
    );


    devLog(
      "Custom code names enabled"
    );


    devLog(
      "Home screen enabled"
    );


    loadNotes();


    startScanner();

  }

);

</script>
