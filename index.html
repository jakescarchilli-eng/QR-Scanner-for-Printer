<!--
  QR SCANNER
  VERSION: 1.7
  Hold-still QR confirmation
  Fixed 250×250 scanning box
  Based on Version 1.3 layout
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    #camera {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius: 28px;

      background: #000;
    }

    #reader {
      position: absolute;
      inset: 0;

      width: 100% !important;
      height: 100% !important;

      border: none !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;
    }

    /* Hide html5-qrcode UI */

    #reader__dashboard {
      display: none !important;
    }

    #reader__header_message {
      display: none !important;
    }

    #reader__scan_region {
      border: none !important;
    }

    #reader__scan_region img {
      display: none !important;
    }

    #reader__scan_region > div {
      border: none !important;
    }

    /*
      FIXED QR BOX

      Always exactly 250 × 250 pixels.
    */

    #scan-box {
      position: absolute;

      width: 250px !important;
      height: 250px !important;

      min-width: 250px;
      min-height: 250px;

      max-width: 250px;
      max-height: 250px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border: 3px solid white;

      border-radius: 18px;

      pointer-events: none;

      z-index: 10;

      transition:
        border-color 0.15s ease;
    }

    /*
      HOLD STILL MESSAGE
    */

    #hold-still {
      position: absolute;

      left: 50%;
      top: calc(50% + 155px);

      transform: translateX(-50%);

      z-index: 15;

      padding: 9px 16px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 15px;
      font-weight: 600;

      white-space: nowrap;

      display: none;
    }

    /*
      Loading
    */

    #loading {
      position: absolute;
      inset: 0;

      background: #000;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 20;
    }

    .spinner {
      width: 28px;
      height: 28px;

      border: 3px solid #333;

      border-top: 3px solid white;

      border-radius: 50%;

      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

  </style>
</head>

<body>

  <div id="app">

    <div id="camera">

      <div id="reader"></div>

      <div id="scan-box"></div>

      <div id="hold-still">
        Hold still
      </div>

      <div id="loading">

        <div class="spinner"></div>

      </div>

    </div>

  </div>


  <script>

    let scanner = null;

    let firstDetection = null;

    let detectedText = null;

    let scanConfirmed = false;

    /*
      How long the QR must remain detected
      before it is confirmed.
    */

    const HOLD_TIME = 600;


    async function startScanner() {

      scanner = new Html5Qrcode("reader");


      try {

        await scanner.start(

          {
            facingMode: {
              ideal: "environment"
            }
          },

          {
            fps: 30,

            qrbox: {
              width: 250,
              height: 250
            },

            disableFlip: false
          },

          function(decodedText) {

            if (scanConfirmed) {
              return;
            }

            /*
              First detection.
            */

            if (
              firstDetection === null
            ) {

              firstDetection =
                Date.now();

              detectedText =
                decodedText;

              document.getElementById(
                "hold-still"
              ).style.display = "block";

              document.getElementById(
                "scan-box"
              ).style.borderColor = "#ffffff";

              return;
            }

            /*
              Make sure we're still seeing
              the same QR code.
            */

            if (
              decodedText !== detectedText
            ) {

              firstDetection =
                Date.now();

              detectedText =
                decodedText;

              return;
            }

            /*
              QR has stayed detected long enough.
            */

            if (
              Date.now() - firstDetection
              >= HOLD_TIME
            ) {

              scanConfirmed = true;

              document.getElementById(
                "hold-still"
              ).style.display = "none";

              document.getElementById(
                "scan-box"
              ).style.borderColor = "white";

              console.log(
                "QR CODE CONFIRMED:",
                decodedText
              );

              /*
                The decoded QR URL is available here
                as decodedText.

                Website-opening behavior can be
                added here later.
              */

            }

          },

          function(errorMessage) {

            /*
              If the QR disappears before
              confirmation, reset.
            */

            if (!scanConfirmed) {

              firstDetection = null;
              detectedText = null;

              document.getElementById(
                "hold-still"
              ).style.display = "none";

            }

          }

        );


        document.getElementById("loading")
          .style.display = "none";

      }

      catch(error) {

        console.error(
          "CAMERA ERROR:",
          error
        );

        document.getElementById("loading")
          .style.display = "none";

      }

    }


    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>
</html>
