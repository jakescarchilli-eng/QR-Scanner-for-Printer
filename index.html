<!--
  PRINTER SCANNER 5000
  VERSION: 5.6

  VERSION HISTORY:
  - v5.5: Home screen/menu redesign and Start Scanning button
  - v5.6: Added status colors, destructive-button colors, catalog styling,
          barcode/QR catalog support, named scans, and rectangular barcode mode

  FEATURES:
  - Home screen loads first
  - Small tap-friendly home icon
  - Start Scanning button
  - QR scanning mode
  - Barcode-only scanning mode with rectangular scan area
  - Barcode/QR mode selector
  - Catalog of saved QR codes and barcodes
  - Custom names for saved codes
  - Known codes display their custom names when scanned
  - Scan history
  - Printer status colors
  - Delete buttons use dark red
  - Notes/status page
  - Flashlight
  - Zoom
  - Sound
  - Light mode
  - Developer mode
  - v5.6
-->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Printer Scanner 5000</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #000;

  overflow: hidden;

  font-family: Arial, sans-serif;
}

button,
select,
input {
  font-family: Arial, sans-serif;
}

#app {
  width: 100%;
  height: 100%;

  background: #000;

  color: white;

  overflow: hidden;
}


/* =========================================================
   HOME SCREEN
========================================================= */

#home-screen {

  position: absolute;

  inset: 0;

  z-index: 5000;

  display: flex;

  flex-direction: column;

  align-items: center;

  background: #000;

  overflow-y: auto;

  padding: 28px 18px 35px;
}

.home-header {

  width: 100%;

  max-width: 900px;

  text-align: center;

  margin-bottom: 25px;
}

.home-logo {

  width: 48px;
  height: 48px;

  margin: 0 auto 12px;

  border: 3px solid white;

  border-radius: 12px;

  position: relative;
}

.home-logo::before {

  content: "";

  position: absolute;

  left: 9px;
  right: 9px;

  bottom: 9px;

  height: 15px;

  border:
    3px solid white;

  border-top: none;

  border-radius: 0 0 5px 5px;
}

.home-logo::after {

  content: "";

  position: absolute;

  left: 13px;
  right: 13px;

  top: 9px;

  height: 10px;

  border:
    3px solid white;

  border-bottom: none;

  border-radius: 5px 5px 0 0;
}

#home-title {

  margin: 0;

  color: white;

  font-size: 30px;

  font-weight: 800;
}

#home-subtitle {

  margin-top: 7px;

  color: #888;

  font-size: 14px;
}

.home-grid {

  width: 100%;

  max-width: 900px;

  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 14px;
}

.home-app {

  min-height: 125px;

  border:
    2px solid #333;

  border-radius: 20px;

  background: #111;

  color: white;

  cursor: pointer;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 9px;

  font-size: 17px;

  font-weight: 700;

  transition: .15s;
}

.home-app:hover {
  background: #181818;
  border-color: #555;
}

.home-app:active {
  transform: scale(.97);
}

.home-app-icon {

  font-size: 30px;

  line-height: 1;
}

.home-app.start {

  grid-column:
    1 / -1;

  min-height: 150px;

  border-color: white;

  background: white;

  color: black;

  font-size: 23px;
}

.home-app.start:hover {
  background: #ddd;
}

.home-app.danger {
  border-color: #5b1515;
}

.home-version {

  margin-top: 25px;

  color: #555;

  font-size: 11px;
}


/* =========================================================
   SCANNER SCREEN
========================================================= */

#scanner-screen {

  position: absolute;

  inset: 0;

  display: none;

  background: #000;

  overflow: hidden;
}


/* =========================================================
   TOP BAR
========================================================= */

#top-bar {

  position: relative;

  width: 100%;
  height: 65px;

  flex-shrink: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #000;

  z-index: 1000;
}

#site-title {

  color: white;

  font-size: 24px;

  font-weight: 700;

  text-align: center;

  white-space: nowrap;
}


/* =========================================================
   SMALL HOME ICON
========================================================= */

#home-button {

  position: absolute;

  left: 10px;
  top: 50%;

  transform:
    translateY(-50%);

  width: 42px;
  height: 42px;

  border:
    2px solid white;

  border-radius: 12px;

  background: #000;

  color: white;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 3000;
}

.home-icon {

  position: relative;

  width: 19px;
  height: 17px;

  border:
    2px solid currentColor;

  border-top: none;

  border-radius: 2px;

  margin-top: 6px;
}

.home-icon::before {

  content: "";

  position: absolute;

  width: 13px;
  height: 13px;

  left: 1px;
  top: -7px;

  border-left:
    2px solid currentColor;

  border-top:
    2px solid currentColor;

  transform:
    rotate(45deg);
}

.home-icon::after {

  content: "";

  position: absolute;

  width: 5px;
  height: 8px;

  left: 5px;
  bottom: 0;

  border:
    2px solid currentColor;

  border-bottom: none;
}

#home-button:active {
  transform:
    translateY(-50%)
    scale(.92);
}


/* =========================================================
   HOME MENU
========================================================= */

#home-menu {

  position: absolute;

  left: 10px;
  top: 58px;

  width: 210px;

  max-height:
    calc(100vh - 75px);

  overflow-y: auto;

  padding: 10px;

  background: #111;

  border:
    1px solid #333;

  border-radius: 18px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.6);

  z-index: 3000;

  display: none;
}

.menu-button {

  width: 100%;

  border: none;

  border-radius: 12px;

  padding: 13px 10px;

  margin: 4px 0;

  background: #222;

  color: white;

  font-size: 16px;

  font-weight: 600;

  cursor: pointer;
}

.menu-button:active {

  background: #333;

  transform:
    scale(.98);
}

.menu-button.danger {

  background: #4d1212;

  color: #fff;
}

.menu-button.danger:hover {
  background: #681818;
}


/* =========================================================
   CAMERA
========================================================= */

#camera {

  position: relative;

  width: 100%;

  height:
    calc(100% - 65px);

  overflow: hidden;

  border-radius:
    28px 28px 0 0;

  background: #000;

  z-index: 1;
}

#reader {

  position: absolute;

  inset: 0;

  width: 100% !important;
  height: 100% !important;

  border: none !important;

  overflow: hidden;

  z-index: 4;
}

#reader video {

  width: 100% !important;
  height: 100% !important;

  object-fit: cover !important;

  display: block !important;
}

#reader__dashboard,
#reader__header_message {

  display: none !important;
}


/* =========================================================
   SCAN REGIONS
========================================================= */

#reader__scan_region {

  position: absolute !important;

  left: 50% !important;
  top: 50% !important;

  transform:
    translate(-50%, -50%) !important;

  margin: 0 !important;

  padding: 0 !important;

  border: none !important;

  overflow: hidden !important;

  pointer-events: none !important;
}

#reader__scan_region img {
  display: none !important;
}


/* QR */

body.qr-mode #reader__scan_region,
body.qr-mode #scan-box {

  width: 250px !important;
  height: 250px !important;

  min-width: 250px !important;
  min-height: 250px !important;

  max-width: 250px !important;
  max-height: 250px !important;
}


/* BARCODE */

body.barcode-mode #reader__scan_region,
body.barcode-mode #scan-box {

  width: min(86vw, 500px) !important;

  height: 150px !important;

  min-width: 260px !important;
  min-height: 150px !important;

  max-width: 500px !important;
  max-height: 150px !important;
}


/* =========================================================
   SCAN BOX
========================================================= */

#scan-box {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border:
    3px solid white;

  border-radius: 18px;

  pointer-events: none;

  z-index: 20;
}

body.barcode-mode #scan-box {
  border-radius: 10px;
}


/* =========================================================
   STATUS
========================================================= */

#status-bar {

  position: absolute;

  left: 50%;

  top:
    calc(50% - 185px);

  transform:
    translateX(-50%);

  z-index: 40;

  padding:
    9px 18px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.7);

  color: white;

  font-size: 14px;

  font-weight: 600;

  white-space: nowrap;
}

#status-bar.detected {
  background:
    rgba(120,80,0,.9);
}


/* =========================================================
   HOLD MESSAGE
========================================================= */

#hold-still {

  position: absolute;

  left: 50%;

  top:
    calc(50% + 105px);

  transform:
    translateX(-50%);

  z-index: 30;

  padding:
    9px 16px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.7);

  color: white;

  font-size: 15px;

  font-weight: 600;

  white-space: nowrap;

  display: none;
}


/* =========================================================
   CONTROL BAR
========================================================= */

#control-bar {

  position: absolute;

  left: 50%;
  bottom: 45px;

  transform:
    translateX(-50%);

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  width: min(94%, 600px);
}


/* =========================================================
   ZOOM
========================================================= */

#zoom-container {

  height: 48px;

  flex: 1;

  min-width: 180px;
  max-width: 350px;

  padding:
    10px 16px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.65);

  display: flex;

  align-items: center;

  gap: 10px;
}

#zoom-label,
#zoom-value {

  color: white;

  font-size: 13px;

  font-weight: 600;

  white-space: nowrap;
}

#zoom-slider {

  width: 100%;
  height: 5px;

  accent-color: white;

  cursor: pointer;
}

#zoom-value {
  min-width: 35px;
  text-align: right;
}


/* =========================================================
   CIRCLE BUTTONS
========================================================= */

.circle-button {

  width: 48px;
  height: 48px;

  flex-shrink: 0;

  border-radius: 50%;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  transition: .15s;
}

.circle-button:active {
  transform: scale(.9);
}

.circle-button.active {

  background: white;

  color: black;

  border:
    2px solid white;
}

.circle-button:not(.active) {

  background: black;

  color: white;

  border:
    2px solid white;
}


/* =========================================================
   ICONS
========================================================= */

.icon {

  position: relative;

  display: block;

  width: 22px;
  height: 22px;

  color: currentColor;

  pointer-events: none;
}

.flashlight-icon::before {

  content: "";

  position: absolute;

  left: 7px;
  top: 2px;

  width: 9px;
  height: 15px;

  border:
    2px solid currentColor;

  border-radius: 3px;
}

.flashlight-icon::after {

  content: "";

  position: absolute;

  left: 8px;
  bottom: 1px;

  width: 7px;
  height: 5px;

  border-left:
    2px solid currentColor;

  border-right:
    2px solid currentColor;
}

.sound-icon::before {

  content: "";

  position: absolute;

  left: 2px;
  top: 8px;

  width: 7px;
  height: 7px;

  background: currentColor;

  border-radius: 1px;
}

.sound-icon::after {

  content: "";

  position: absolute;

  left: 7px;
  top: 4px;

  width: 9px;
  height: 14px;

  background: currentColor;

  clip-path:
    polygon(
      0 35%,
      35% 35%,
      100% 0,
      100% 100%,
      35% 65%,
      0 65%
    );
}


/* =========================================================
   LOADING
========================================================= */

#loading {

  position: absolute;

  inset: 0;

  background: #000;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 50;
}

.spinner {

  width: 28px;
  height: 28px;

  border:
    3px solid #333;

  border-top:
    3px solid white;

  border-radius: 50%;

  animation:
    spin .6s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


/* =========================================================
   RESULTS
========================================================= */

#result-text {

  position: absolute;

  left: 50%;
  top: 12%;

  transform:
    translateX(-50%);

  z-index: 50;

  width: 85%;

  max-width: 700px;

  color: white;

  font-size: 36px;

  font-weight: 700;

  text-align: center;

  line-height: 1.25;

  display: none;
}

#result-code {

  position: absolute;

  left: 50%;
  top: 29%;

  transform:
    translateX(-50%);

  width: 90%;

  max-width: 700px;

  color: #aaa;

  font-size: 14px;

  text-align: center;

  word-break: break-all;

  display: none;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.action-button {

  position: absolute;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 50;

  border: none;

  padding:
    18px 38px;

  border-radius: 999px;

  background: white;

  color: #111;

  font-size: 20px;

  font-weight: 600;

  cursor: pointer;
}

.action-button:active {
  transform:
    translateX(-50%)
    scale(.95);
}

#open-button {
  top: 55%;
  display: none;
}

#rescan {
  top: 70%;
  display: none;
}


/* =========================================================
   VERSION
========================================================= */

#version-number {

  position: absolute;

  left: 50%;
  bottom: 6px;

  transform:
    translateX(-50%);

  z-index: 100;

  color:
    rgba(255,255,255,.45);

  font-size: 9px;

  pointer-events: none;
}


/* =========================================================
   GENERAL PANEL
========================================================= */

.panel {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: min(92%, 700px);

  max-height: 82%;

  overflow-y: auto;

  padding: 20px;

  background: #111;

  border:
    1px solid #333;

  border-radius: 22px;

  z-index: 500;

  display: none;
}

.panel-title {

  color: white;

  font-size: 24px;

  font-weight: 700;

  text-align: center;

  margin-bottom: 18px;
}

.panel-close {

  width: 100%;

  margin-top: 14px;

  border: none;

  border-radius: 12px;

  padding: 13px;

  background: #333;

  color: white;

  font-size: 16px;

  font-weight: 600;

  cursor: pointer;
}


/* =========================================================
   CATALOG
========================================================= */

.catalog-toolbar {

  display: flex;

  gap: 8px;

  margin-bottom: 12px;
}

.catalog-search {

  flex: 1;

  min-width: 0;

  padding: 12px;

  border:
    1px solid #444;

  border-radius: 12px;

  background: #222;

  color: white;

  outline: none;
}

.catalog-filter {

  padding: 12px;

  border:
    1px solid #444;

  border-radius: 12px;

  background: #222;

  color: white;

  outline: none;
}

.catalog-item {

  padding: 14px;

  margin: 8px 0;

  background: #222;

  border:
    1px solid #333;

  border-radius: 14px;
}

.catalog-name {

  color: white;

  font-size: 18px;

  font-weight: 700;

  margin-bottom: 6px;
}

.catalog-type {

  display: inline-block;

  padding: 4px 8px;

  margin-bottom: 7px;

  border-radius: 999px;

  background: #333;

  color: #bbb;

  font-size: 11px;

  font-weight: 700;
}

.catalog-code {

  color: #999;

  font-size: 12px;

  word-break: break-all;

  margin-bottom: 10px;
}

.catalog-actions {

  display: flex;

  gap: 7px;
}

.catalog-button {

  flex: 1;

  border: none;

  border-radius: 10px;

  padding: 10px;

  background: #333;

  color: white;

  cursor: pointer;
}

.catalog-button.delete {

  background: #541414;

  color: white;
}

.catalog-button.delete:hover {
  background: #701a1a;
}

.catalog-empty {

  color: #777;

  text-align: center;

  padding: 30px 10px;
}


/* =========================================================
   ADD / EDIT CODE
========================================================= */

.code-form label {

  display: block;

  color: white;

  font-size: 14px;

  font-weight: 700;

  margin:
    12px 0 6px;
}

.code-form input,
.code-form select {

  width: 100%;

  padding: 13px;

  border:
    1px solid #444;

  border-radius: 12px;

  background: #222;

  color: white;

  outline: none;
}

.form-button {

  width: 100%;

  margin-top: 15px;

  padding: 14px;

  border: none;

  border-radius: 12px;

  background: white;

  color: black;

  font-size: 16px;

  font-weight: 700;

  cursor: pointer;
}


/* =========================================================
   NOTES
========================================================= */

#notes-panel {

  position: absolute;

  inset: 0;

  z-index: 2000;

  background: #000;

  padding:
    30px 20px;

  overflow-y: auto;

  display: none;

  pointer-events: none;
}

#notes-title {

  color: white;

  font-size: 30px;

  font-weight: 700;

  text-align: center;

  margin-bottom: 30px;
}

.note-section {

  width: 100%;

  max-width: 600px;

  margin:
    0 auto 22px;
}

.note-section label {

  display: block;

  color: white;

  font-size: 18px;

  font-weight: 700;

  margin-bottom: 8px;
}

.status-select {

  width: 100%;

  padding:
    14px 16px;

  border:
    2px solid #444;

  border-radius: 14px;

  background: #111;

  color: white;

  font-size: 17px;

  font-weight: 600;

  outline: none;

  cursor: pointer;
}


/* =========================================================
   PRINTER STATUS COLORS
========================================================= */

.status-select.status-online {
  color: #3f9b50;
  border-color: #245f2e;
}

.status-select.status-printing {
  color: #c09a2e;
  border-color: #765e16;
}

.status-select.status-offline {
  color: #c34a4a;
  border-color: #6d2020;
}


/* Native dropdown options */

.status-select option[value="online"] {
  color: #3f9b50;
}

.status-select option[value="printing"] {
  color: #c09a2e;
}

.status-select option[value="offline"] {
  color: #c34a4a;
}

.notes-save,
.notes-back {

  position: relative;

  left: auto;
  top: auto;

  transform: none;

  display: block;

  width: min(90%, 400px);

  margin:
    12px auto;
}

.notes-save:active,
.notes-back:active {
  transform: scale(.95);
}


/* =========================================================
   HISTORY
========================================================= */

.history-item {

  padding: 12px;

  margin: 6px 0;

  background: #222;

  border-radius: 12px;

  color: white;
}

.history-name {
  font-weight: 700;
}

.history-url {

  margin-top: 4px;

  font-size: 11px;

  color: #aaa;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.history-time {

  margin-top: 4px;

  font-size: 10px;

  color: #777;
}


/* =========================================================
   DEV PANEL
========================================================= */

#dev-panel {

  display: none;

  width: 100%;

  height: 50%;

  flex-shrink: 0;

  background: #000;

  border-top:
    2px solid #333;

  color: white;

  overflow: hidden;

  flex-direction: column;
}

#dev-header {

  height: 40px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  padding-left: 14px;

  background: #111;

  border-bottom:
    1px solid #333;

  font-size: 14px;

  font-weight: 700;
}

#dev-output {

  flex: 1;

  overflow-y: auto;

  padding: 10px;

  font-family:
    "Courier New",
    monospace;

  font-size: 12px;

  line-height: 1.5;

  white-space: pre-wrap;

  word-break: break-word;
}

.dev-line {
  margin-bottom: 3px;
}

#dev-stats {

  padding: 10px;

  border-top:
    1px solid #333;

  background: #111;

  color: #aaa;

  font-family:
    "Courier New",
    monospace;

  font-size: 11px;
}

#dev-buttons {

  display: flex;

  gap: 6px;

  padding: 8px;

  background: #111;
}

.dev-button {

  flex: 1;

  border: none;

  border-radius: 8px;

  padding: 8px;

  background: #222;

  color: white;

  font-size: 11px;
}


/* =========================================================
   LIGHT MODE
========================================================= */

body.light-mode,
body.light-mode #scanner-screen {

  background: #f2f2f2;
}

body.light-mode #top-bar {
  background: #f2f2f2;
}

body.light-mode #site-title {
  color: #000;
}

body.light-mode #home-button {

  background: #f2f2f2;

  color: #000;

  border-color: #000;
}

body.light-mode #home-menu {

  background: #f5f5f5;

  border-color: #ccc;
}

body.light-mode .menu-button {

  background: #ddd;

  color: #000;
}

body.light-mode .menu-button.danger {

  background: #9b3030;

  color: white;
}

body.light-mode #zoom-container {
  background: rgba(255,255,255,.85);
}

body.light-mode #zoom-label,

<script>

/* =========================================================
   VERSION
========================================================= */

const APP_VERSION = "5.6";


/* =========================================================
   VARIABLES
========================================================= */

let scanner = null;

let firstDetection = null;

let detectedText = null;

let scanConfirmed = false;

let scannedURL = null;

let scannedType = "qr";

let isPrinterLink = false;

let cameraTrack = null;

let devMode = false;

let lightMode = false;

let flashlightOn = false;

let soundEnabled = true;

let scanCount = 0;

let successfulScans = 0;

let failedScans = 0;

let scanStartTime = null;

let lastScanTime = 0;

let scannerMode =
  localStorage.getItem("scannerMode") || "qr";

const HOLD_TIME = 600;

const QR_SIZE = 250;

const BARCODE_WIDTH = 500;

const BARCODE_HEIGHT = 150;


/* =========================================================
   DEV LOG
========================================================= */

function devLog(message) {

  const output =
    document.getElementById(
      "dev-output"
    );

  if (!output)
    return;

  const line =
    document.createElement(
      "div"
    );

  line.className =
    "dev-line";

  line.textContent =
    "[" +
    new Date().toLocaleTimeString() +
    "] " +
    message;

  output.appendChild(line);

  output.scrollTop =
    output.scrollHeight;

  updateStats();
}


function updateStats() {

  const stats =
    document.getElementById(
      "dev-stats"
    );

  if (!stats)
    return;

  stats.textContent =
    "Scans: " +
    scanCount +
    " | Successful: " +
    successfulScans +
    " | Failed: " +
    failedScans +
    " | Last scan: " +
    lastScanTime +
    " ms";
}


/* =========================================================
   HOME SCREEN
========================================================= */

function startScanningFromHome() {

  document.getElementById(
    "home-screen"
  ).style.display =
    "none";

  document.getElementById(
    "scanner-screen"
  ).style.display =
    "block";

  devLog(
    "Opened scanner"
  );

  startScanner();
}


function returnToHome() {

  stopScanner();

  document.getElementById(
    "scanner-screen"
  ).style.display =
    "none";

  document.getElementById(
    "home-screen"
  ).style.display =
    "flex";

  hideAllPanels();

  hideNotes();

  devLog(
    "Returned to Home"
  );
}


/* =========================================================
   HOME PANELS
========================================================= */

function openHomePanel(panel) {

  document.getElementById(
    "home-screen"
  ).style.display =
    "none";

  document.getElementById(
    "scanner-screen"
  ).style.display =
    "block";

  if (panel === "catalog") {
    showCatalog();
  }

  if (panel === "history") {
    showHistory();
  }

  if (panel === "mode") {
    showModePanel();
  }

  if (panel === "printers") {
    document.getElementById(
      "printers-panel"
    ).style.display =
      "block";
  }
}


function hidePanel(id) {

  const panel =
    document.getElementById(id);

  if (panel)
    panel.style.display =
      "none";
}


function hideAllPanels() {

  [
    "history-panel",
    "catalog-panel",
    "code-form-panel",
    "mode-panel",
    "printers-panel"
  ].forEach(
    function(id) {

      hidePanel(id);

    }
  );
}


/* =========================================================
   SCANNER MODE
========================================================= */

function setScannerMode(mode) {

  scannerMode =
    mode;

  localStorage.setItem(
    "scannerMode",
    mode
  );

  document.body.classList.toggle(
    "qr-mode",
    mode === "qr"
  );

  document.body.classList.toggle(
    "barcode-mode",
    mode === "barcode"
  );

  const description =
    document.getElementById(
      "mode-description"
    );

  if (description) {

    description.textContent =
      mode === "barcode"
        ? "Bar Code Mode uses a wide rectangular scanning area."
        : "QR Code Mode uses a square scanning area.";

  }

  hideModePanel();

  devLog(
    "Scanner mode changed to " +
    mode
  );


  /*
    Restart the scanner so the correct
    supported formats are used.
  */

  if (
    document.getElementById(
      "scanner-screen"
    ).style.display !== "none"
  ) {

    stopScanner().then(
      function() {

        resetScannerUI();

        startScanner();

      }
    );

  }

}


function showModePanel() {

  document.getElementById(
    "mode-panel"
  ).style.display =
    "block";

  document.getElementById(
    "mode-description"
  ).textContent =

    scannerMode === "barcode"
      ? "Bar Code Mode is active. The scanner uses a wide rectangle."
      : "QR Code Mode is active. The scanner uses a square.";

}


function hideModePanel() {

  hidePanel(
    "mode-panel"
  );

}


/* =========================================================
   PRINTER APPS
========================================================= */

function openPrinterLink(url) {

  window.open(
    url,
    "_blank"
  );

  hideAllPanels();

}


/* =========================================================
   NOTES
========================================================= */

function showNotesFromHome() {

  document.getElementById(
    "home-screen"
  ).style.display =
    "none";

  document.getElementById(
    "scanner-screen"
  ).style.display =
    "block";

  showNotes();

}


function showNotes() {

  hideAllPanels();

  loadNotes();

  const notes =
    document.getElementById(
      "notes-panel"
    );

  notes.style.display =
    "block";

  notes.style.pointerEvents =
    "auto";

  devLog(
    "Opened printer status"
  );
}


function hideNotes() {

  const notes =
    document.getElementById(
      "notes-panel"
    );

  if (!notes)
    return;

  notes.style.display =
    "none";

  notes.style.pointerEvents =
    "none";
}


function saveNotes() {

  const data = {

    h2d:
      document.getElementById(
        "h2d-status"
      ).value,

    toybox:
      document.getElementById(
        "toybox-status"
      ).value,

    ender:
      document.getElementById(
        "ender-status"
      ).value

  };

  try {

    localStorage.setItem(
      "printerNotes",
      JSON.stringify(data)
    );

    devLog(
      "Printer statuses saved"
    );

  } catch(error) {

    devLog(
      "Could not save statuses: " +
      error.message
    );

  }

}


function loadNotes() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          "printerNotes"
        )
      );

    if (saved) {

      document.getElementById(
        "h2d-status"
      ).value =
        saved.h2d ||
        "online";

      document.getElementById(
        "toybox-status"
      ).value =
        saved.toybox ||
        "online";

      document.getElementById(
        "ender-status"
      ).value =
        saved.ender ||
        "online";

    }

  } catch(error) {

    devLog(
      "Could not load printer statuses"
    );

  }


  updateStatusColor(
    document.getElementById(
      "h2d-status"
    )
  );

  updateStatusColor(
    document.getElementById(
      "toybox-status"
    )
  );

  updateStatusColor(
    document.getElementById(
      "ender-status"
    )
  );

}


function updateStatusColor(select) {

  if (!select)
    return;

  select.classList.remove(
    "status-online",
    "status-printing",
    "status-offline"
  );

  select.classList.add(
    "status-" +
    select.value
  );

}


/* =========================================================
   HISTORY
========================================================= */

function getHistory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "printerScannerHistory"
      )
    ) || [];

  } catch {

    return [];

  }

}


function saveHistory(
  code,
  name,
  type
) {

  const history =
    getHistory();

  history.unshift({

    code:
      code,

    name:
      name,

    type:
      type,

    time:
      new Date()
        .toLocaleString()

  });

  localStorage.setItem(

    "printerScannerHistory",

    JSON.stringify(
      history.slice(
        0,
        50
      )
    )

  );

}


function showHistory() {

  hideAllPanels();

  const panel =
    document.getElementById(
      "history-panel"
    );

  const list =
    document.getElementById(
      "history-list"
    );

  const history =
    getHistory();

  list.innerHTML =
    "";

  if (
    history.length ===
    0
  ) {

    list.innerHTML =
      '<div class="catalog-empty">No scans yet.</div>';

  } else {

    history.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "history-item";

        div.innerHTML =

          '<div class="history-name">' +
          escapeHTML(
            item.name
          ) +
          "</div>" +

          '<div class="history-url">' +
          escapeHTML(
            item.code
          ) +
          "</div>" +

          '<div class="history-time">' +
          escapeHTML(
            item.type
          ) +
          " · " +
          escapeHTML(
            item.time
          ) +
          "</div>";

        list.appendChild(
          div
        );

      }
    );

  }

  panel.style.display =
    "block";
}


function hideHistory() {

  hidePanel(
    "history-panel"
  );

}


function clearHistory() {

  if (
    !confirm(
      "Clear all scan history?"
    )
  ) {
    return;
  }

  localStorage.removeItem(
    "printerScannerHistory"
  );

  devLog(
    "Scan history cleared"
  );

  hideHistory();

}


function clearHistoryFromHome() {

  if (
    !confirm(
      "Clear all scan history?"
    )
  ) {
    return;
  }

  localStorage.removeItem(
    "printerScannerHistory"
  );

}


/* =========================================================
   CATALOG
========================================================= */

function getCatalog() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "printerScannerCatalog"
      )
    ) || [];

  } catch {

    return [];

  }

}


function saveCatalog(catalog) {

  localStorage.setItem(

    "printerScannerCatalog",

    JSON.stringify(
      catalog
    )

  );

}


function findCatalogCode(code) {

  const catalog =
    getCatalog();

  return catalog.find(
    function(item) {

      return item.code === code;

    }
  ) || null;

}


function saveCatalogCode(
  code,
  name,
  type
) {

  if (!code)
    return;

  const catalog =
    getCatalog();

  const existing =
    catalog.find(
      function(item) {

        return item.code === code;

      }
    );

  if (existing) {

    existing.name =
      name;

    existing.type =
      type;

  } else {

    catalog.push({

      id:
        Date.now().toString(),

      code:
        code,

      name:
        name,

      type:
        type,

      created:
        new Date()
          .toLocaleString()

    });

  }

  saveCatalog(
    catalog
  );

}


function showCatalog() {

  hideAllPanels();

  renderCatalog();

  document.getElementById(
    "catalog-panel"
  ).style.display =
    "block";

}


function hideCatalog() {

  hidePanel(
    "catalog-panel"
  );

}


function renderCatalog() {

  const list =
    document.getElementById(
      "catalog-list"
    );

  const search =
    (
      document.getElementById(
        "catalog-search"
      ).value ||
      ""
    ).toLowerCase();

  const filter =
    document.getElementById(
      "catalog-filter"
    ).value;

  const catalog =
    getCatalog()
      .filter(
        function(item) {

          const matchesSearch =

            !search ||

            item.name
              .toLowerCase()
              .includes(search) ||

            item.code
              .toLowerCase()
              .includes(search);

          const matchesFilter =

            filter === "all" ||
            item.type === filter;

          return (
            matchesSearch &&
            matchesFilter
          );

        }
      )
      .sort(
        function(a,b) {

          return a.name
            .localeCompare(
              b.name
            );

        }
      );

  list.innerHTML =
    "";

  if (
    catalog.length ===
    0
  ) {

    list.innerHTML =
      '<div class="catalog-empty">' +
      'No saved codes found.' +
      '</div>';

    return;
  }


  catalog.forEach(
    function(item) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "catalog-item";

      div.innerHTML =

        '<div class="catalog-name">' +
        escapeHTML(
          item.name
        ) +
        "</div>" +

        '<div class="catalog-type">' +
        (
          item.type === "barcode"
            ? "BAR CODE"
            : "QR CODE"
        ) +
        "</div>" +

        '<div class="catalog-code">' +
        escapeHTML(
          item.code
        ) +
        "</div>" +

        '<div class="catalog-actions">' +

        '<button class="catalog-button" ' +
        'onclick="editCatalogCode(\'' +
        escapeAttribute(
          item.id
        ) +
        '\')">' +
        'Rename' +
        '</button>' +

        '<button class="catalog-button delete" ' +
        'onclick="deleteCatalogCode(\'' +
        escapeAttribute(
          item.id
        ) +
        '\')">' +
        'Delete' +
        '</button>' +

        '</div>';

      list.appendChild(
        div
      );

    }
  );

}

function editCatalogCode(id) {

  const catalog =
    getCatalog();

  const item =
    catalog.find(
      function(code) {

        return code.id === id;

      }
    );

  if (!item)
    return;

  const newName =
    prompt(
      "Enter a new name:",
      item.name
    );

  if (
    newName === null
  )
    return;

  const cleanName =
    newName.trim();

  if (!cleanName)
    return;

  item.name =
    cleanName;

  saveCatalog(
    catalog
  );

  renderCatalog();

}


function deleteCatalogCode(id) {

  const catalog =
    getCatalog();

  const item =
    catalog.find(
      function(code) {

        return code.id === id;

      }
    );

  if (!item)
    return;

  if (
    !confirm(
      'Delete "' +
      item.name +
      '" from the catalog?'
    )
  ) {
    return;
  }

  saveCatalog(

    catalog.filter(
      function(code) {

        return code.id !== id;

      }
    )

  );

  devLog(
    "Deleted catalog code: " +
    item.name
  );

  renderCatalog();

}


/* =========================================================
   ESCAPING
========================================================= */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


function escapeAttribute(text) {

  return String(text)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}


/* =========================================================
   FLASHLIGHT
========================================================= */

async function toggleFlashlight() {

  if (!cameraTrack) {
    reacquireCameraTrack();
  }

  if (!cameraTrack) {

    devLog(
      "Flashlight unavailable"
    );

    return;

  }

  try {

    const capabilities =
      cameraTrack.getCapabilities();

    if (
      !capabilities.torch
    ) {

      devLog(
        "Camera does not support flashlight"
      );

      return;

    }

    flashlightOn =
      !flashlightOn;

    await cameraTrack.applyConstraints({

      advanced: [
        {
          torch:
            flashlightOn
        }
      ]

    });

    document
      .getElementById(
        "flashlight-button"
      )
      .classList.toggle(
        "active",
        flashlightOn
      );

  } catch(error) {

    flashlightOn =
      false;

    devLog(
      "Flashlight error: " +
      error.message
    );

  }

}


/* =========================================================
   SOUND
========================================================= */

function toggleSound() {

  soundEnabled =
    !soundEnabled;

  document
    .getElementById(
      "sound-button"
    )
    .classList.toggle(
      "active",
      soundEnabled
    );

}


function playScanSound() {

  if (!soundEnabled)
    return;

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext)
      return;

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.frequency.value =
      880;

    oscillator.type =
      "sine";

    gain.gain.value =
      0.08;

    oscillator.connect(
      gain
    );

    gain.connect(
      audio.destination
    );

    oscillator.start();

    oscillator.stop(
      audio.currentTime +
      0.12
    );

  } catch {

    devLog(
      "Sound error"
    );

  }

}

/* =========================================================
   CAMERA TRACK
========================================================= */

function reacquireCameraTrack() {

  const video =
    document.querySelector(
      "#reader video"
    );

  if (
    video &&
    video.srcObject
  ) {

    const tracks =
      video.srcObject
        .getVideoTracks();

    if (
      tracks.length > 0
    ) {

      cameraTrack =
        tracks[0];

      return true;

    }

  }

  return false;
}


/* =========================================================
   ZOOM
========================================================= */

async function setZoom(value) {

  const zoom =
    parseFloat(
      value
    );

  document.getElementById(
    "zoom-value"
  ).textContent =
    zoom.toFixed(1) +
    "×";

  if (!cameraTrack) {
    reacquireCameraTrack();
  }

  if (!cameraTrack)
    return;

  try {

    const capabilities =
      cameraTrack.getCapabilities();

    if (!capabilities.zoom)
      return;

    const actualZoom =

      capabilities.zoom.min +

      (
        (zoom - 1) / 4
      ) *

      (
        capabilities.zoom.max -
        capabilities.zoom.min
      );

    await cameraTrack.applyConstraints({

      advanced: [
        {
          zoom:
            actualZoom
        }
      ]

    });

  } catch(error) {

    devLog(
      "Zoom error: " +
      error.message
    );

  }

}

   SCAN REGION
========================================================= */

function positionScanRegion() {

  const region =

  if (!region)

  const barcode =
    scannerMode ===
    "barcode";

  region.style.position =

  region.style.width =
    barcode
      ? BARCODE_WIDTH + "px"
      : QR_SIZE + "px";

  region.style.height =
    barcode
      ? BARCODE_HEIGHT + "px"
      : QR_SIZE + "px";

  region.style.left =
    "50%";

  region.style.top =
    "50%";

  region.style.transform =
    "translate(-50%, -50%)";

  region.style.margin =
    "0";

  region.style.padding =
    "0";

  region.style.border =
    "none";

}


/* =========================================================
   SUPPORTED FORMATS
========================================================= */

function getScannerFormats() {

  if (
    scannerMode ===
    "barcode"
  ) {

    return [

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.CODABAR,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.ITF,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E

    ];

  }

  return [
    Html5QrcodeSupportedFormats.QR_CODE
  ];

}


/* =========================================================
   START SCANNER
========================================================= */

async function startScanner() {

  if (scanner)
    return;

  scanStartTime =
    Date.now();

  firstDetection =
    null;

  detectedText =
    null;

  scanConfirmed =
    false;

  const status =
    document.getElementById(
      "status-bar"
    );

  status.textContent =
    scannerMode === "barcode"
      ? "Starting bar code scanner..."
      : "Starting QR scanner...";

  status.style.display =
    "block";

  document.getElementById(
    "loading"
  ).style.display =
    "flex";

  document.getElementById(
    "reader"
  ).style.display =
    "block";

  document.getElementById(
    "scan-box"
  ).style.display =
    "block";

  document.getElementById(
    "control-bar"
  ).style.display =
    "flex";

  document.getElementById(
    "version-number"
  ).style.display =
    "block";

  scanner =
    new Html5Qrcode(
      "reader"
    );

  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {

        fps:
          30,

        qrbox:

          scannerMode === "barcode"

            ? {
                width:
                  BARCODE_WIDTH,
                height:
                  BARCODE_HEIGHT
              }

            : {
                width:
                  QR_SIZE,
                height:
                  QR_SIZE
              },

        formatsToSupport:
          getScannerFormats(),

        disableFlip:
          false

      },


      async function(decodedText) {

        if (
          scanConfirmed
        ) {
          return;
        }

        status.textContent =
          scannerMode === "barcode"
            ? "Bar code detected"
            : "QR detected";

        status.className =
          "detected";

        reacquireCameraTrack();


        if (
          firstDetection ===
          null
        ) {

          firstDetection =
            Date.now();

          detectedText =
            decodedText;

          document.getElementById(
            "hold-still"
          ).style.display =
            "block";

          return;

        }


        if (
          decodedText !==
          detectedText
        ) {

          firstDetection =
            Date.now();

          detectedText =
            decodedText;

          return;

        }


        if (

          Date.now() -
          firstDetection >=
          HOLD_TIME

        ) {

          scanConfirmed =
            true;

          scannedURL =
            decodedText;

          scannedType =
            scannerMode;

          successfulScans++;

          scanCount++;

          lastScanTime =
            Date.now() -
            scanStartTime;

          playScanSound();


          const catalogEntry =
            findCatalogCode(
              decodedText
            );


          let resultName;


          if (catalogEntry) {

            resultName =
              catalogEntry.name;

          } else {

            resultName =
              scannerMode === "barcode"
                ? "Bar Code: " +
                  decodedText
                : getQRText(
                    decodedText
                  );

            /*
              First-time scans are automatically
              added to the catalog with the code
              as their temporary name.

              The user can rename them later.
            */

            saveCatalogCode(
              decodedText,
              resultName,
              scannerMode
            );

          }


          isPrinterLink =
            false;


          if (
            scannerMode ===
            "qr"
          ) {

            getQRText(
              decodedText
            );

          }


          saveHistory(
            decodedText,
            resultName,
            scannerMode
          );


          document.getElementById(
            "status-bar"
          ).style.display =
            "none";

          document.getElementById(
            "hold-still"
          ).style.display =
            "none";

          document.getElementById(
            "control-bar"
          ).style.display =
            "none";

          document.getElementById(
            "version-number"
          ).style.display =
            "none";


          try {

            await scanner.stop();

          } catch {}


          scanner =
            null;

          cameraTrack =
            null;


          document.getElementById(
            "reader"
          ).style.display =
            "none";

          document.getElementById(
            "scan-box"
          ).style.display =
            "none";


          document.getElementById(
            "result-text"
          ).textContent =
            resultName;

          document.getElementById(
            "result-text"
          ).style.display =
            "block";


          document.getElementById(
            "result-code"
          ).textContent =
            decodedText;

          document.getElementById(
            "result-code"
          ).style.display =
            "block";


          const openButton =
            document.getElementById(
              "open-button"
            );


          if (
            scannerMode ===
            "barcode"
          ) {

            openButton.style.display =
              "none";

          } else {

            openButton.textContent =
              isPrinterLink
                ? "Print"
                : "Open";

            openButton.style.display =
              "block";

          }


          document.getElementById(
            "rescan"
          ).style.display =
            "block";


          devLog(
            (
              scannerMode === "barcode"
                ? "Bar code"
                : "QR"
            ) +
            " accepted: " +
            resultName +
            " [" +
            decodedText +
            "]"
          );

        }

      },


      function() {}

    );


    setTimeout(
      positionScanRegion,
      100
    );

    setTimeout(
      positionScanRegion,
      300
    );

    setTimeout(
      positionScanRegion,
      700
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    status.textContent =
      scannerMode === "barcode"
        ? "Ready for bar code"
        : "Ready for QR code";

    status.className =
      "";


    setTimeout(
      reacquireCameraTrack,
      700
    );


    devLog(
      "Camera started in " +
      scannerMode +
      " mode"
    );

  } catch(error) {

    failedScans++;

    scanner =
      null;

    document.getElementById(
      "loading"
    ).style.display =
      "none";

    status.textContent =
      "Camera unavailable";

    devLog(
      "CAMERA ERROR: " +
      error.message
    );

  }

}

/* =========================================================
   QR NAME
========================================================= */

function getSiteName(url) {

  try {

    let fixedURL =
      url;

    if (

      !fixedURL.startsWith(
        "http://"
      )

      &&

      !fixedURL.startsWith(
        "https://"
      )

    ) {

      fixedURL =
        "https://" +
        fixedURL;

    }

    const parsed =
      new URL(
        fixedURL
      );

    let hostname =
      parsed.hostname.replace(
        /^www\./,
        ""
      );

    const knownSites = {

      "youtube.com":
        "YouTube",

      "google.com":
        "Google",

      "github.com":
        "GitHub",

      "amazon.com":
        "Amazon",

      "apple.com":
        "Apple",

      "facebook.com":
        "Facebook",

      "instagram.com":
        "Instagram",

      "tiktok.com":
        "TikTok",

      "reddit.com":
        "Reddit",

      "microsoft.com":
        "Microsoft",

      "bambulab.com":
        "Bambu Lab",

      "makerworld.com":
        "MakerWorld"

    };

    if (
      knownSites[hostname]
    ) {

      return knownSites[
        hostname
      ];

    }

    const parts =
      hostname.split(".");

    if (
      parts.length >= 2
    ) {

      const name =
        parts[
          parts.length - 2
        ];

      return (

        name
          .charAt(0)
          .toUpperCase() +

        name.slice(1)

      );

    }

    return hostname;

  } catch {

    return "QR Code Found";

  }

}


/* =========================================================
   QR RESULT
========================================================= */

function getQRText(url) {

  try {

    const parsedURL =
      new URL(

        url.startsWith("http")
          ? url
          : "https://" + url

      );

    const cleanURL =
      parsedURL.origin +
      parsedURL.pathname;


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1166269606"

    ) {

      isPrinterLink =
        true;

      return "TOYBOX Found";

    }


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1658133862"

    ) {

      isPrinterLink =
        true;

      return "Ender 3 Found";

    }


    if (

      cleanURL ===
      "https://apps.apple.com/app/id1625671285"

    ) {

      isPrinterLink =
        true;

      return "This is to print with the H2D";

    }


    if (

      parsedURL.origin ===
      "https://makerworld.com"

      &&

      parsedURL.pathname ===
      "/en"

    ) {

      isPrinterLink =
        false;

      return "MakerWorld";

    }


    isPrinterLink =
      false;

    return getSiteName(
      url
    );

  } catch {

    isPrinterLink =
      false;

    return "QR Code Found";

  }

}

function openScannedSite() {

  if (!scannedURL)

  let url =
    scannedURL;

  if (

    !url.startsWith(
      "http://"
    )

    &&

    !url.startsWith(
      "https://"
    )

  ) {

    url =
      "https://" +
      url;

  }

  window.open(
    url,
    "_blank"
  );

}

    );

  }
);


/* =========================================================
   STARTUP
========================================================= */

window.addEventListener(
  "load",
  function() {

    document.body.classList.toggle(
      "qr-mode",
      scannerMode === "qr"
    );

    document.body.classList.toggle(
      "barcode-mode",
      scannerMode === "barcode"
    );


    loadNotes();


    devLog(
      "Printer Scanner 5000"
    );

    devLog(
      "Version " +
      APP_VERSION
    );

    devLog(
      "Scanner mode: " +
      scannerMode
    );

    devLog(
      "Catalog enabled"
    );

    devLog(
      "Named QR/barcode scans enabled"
    );

    devLog(
      "Status colors enabled"
    );

    /*
      Home screen intentionally loads first.
      Scanner starts only after Start Scanning.
    */

  }

);

</script>

</body>

</html>
