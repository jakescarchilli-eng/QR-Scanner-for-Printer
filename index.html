<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin: 20px 0;
    }

    #reader {
      width: min(90vw, 500px);
      margin: auto;
      background: white;
      border-radius: 15px;
      padding: 10px;
    }

    #status {
      margin: 15px;
      font-size: 16px;
    }

    #website {
      width: 95%;
      height: 650px;
      border: none;
      border-radius: 12px;
      background: white;
      margin-top: 10px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
    }
  </style>
</head>

<body>

  <h1>QR Scanner</h1>

  <div id="reader"></div>

  <div id="status">
    Point your camera at a QR code.
  </div>

  <button onclick="scanAgain()">Scan Another QR Code</button>

  <iframe
    id="website"
    src="about:blank"
    allow="fullscreen">
  </iframe>

  <script>
    let scanner;

    function startScanner() {
      scanner = new Html5Qrcode("reader");

      scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },

        (decodedText) => {
          document.getElementById("status").textContent =
            "QR code detected!";

          scanner.stop();

          let url = decodedText;

          // Add https:// if the QR code only contains a domain
          if (!url.startsWith("http://") &&
              !url.startsWith("https://")) {
            url = "https://" + url;
          }

          document.getElementById("website").src = url;
        },

        (errorMessage) => {
          // Ignore normal scanning errors
        }
      ).catch(err => {
        document.getElementById("status").textContent =
          "Camera error: " + err;
      });
    }

    function scanAgain() {
      document.getElementById("website").src = "about:blank";
      document.getElementById("status").textContent =
        "Point your camera at a QR code.";

      startScanner();
    }

    startScanner();
  </script>

</body>
</html>
