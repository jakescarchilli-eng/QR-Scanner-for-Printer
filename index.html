<!--
  QR SCANNER
  VERSION: 3.5
  Added Refresh button to home menu
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Printer Scanner 5000</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
    }

    #top-bar {
      position: relative;
      width: 100%;
      height: 65px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #site-title {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      user-select: none;
    }

    #home-button {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    #home-button:active {
      transform: translateY(-50%) scale(0.94);
    }

    #home-menu {
      position: absolute;
      left: 12px;
      top: 58px;
      width: 180px;
      padding: 10px;
      background: #111;
      border: 1px solid #333;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      z-index: 300;
      display: none;
    }

    .menu-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 10px;
      margin: 4px 0;
      background: #222;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .menu-button:active {
      background: #333;
      transform: scale(0.98);
    }

    #camera {
      position: relative;
      width: 100%;
      height: calc(100% - 65px);
      overflow: hidden;
      border-radius: 28px 28px 0 0;
      background: #000;
    }

    #reader {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #reader__dashboard,
    #reader__header_message {
      display: none !important;
    }

    #reader__scan_region {
      border: none !important;
    }

    #reader__scan_region img {
      display: none !important;
    }

    #reader__scan_region > div {
      border: none !important;
    }

    #scan-box {
      position: absolute;
      width: 250px !important;
      height: 250px !important;
      min-width: 250px;
      min-height: 250px;
      max-width: 250px;
      max-height: 250px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 3px solid white;
      border-radius: 18px;
      pointer-events: none;
      z-index: 10;
    }

    #hold-still {
      position: absolute;
      left: 50%;
      top: calc(50% + 155px);
      transform: translateX(-50%);
      z-index: 15;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      display: none;
    }

    #zoom-container {
      position: absolute;
      left: 50%;
      bottom: 45px;
      transform: translateX(-50%);
      z-index: 100;
      width: min(70%, 350px);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #zoom-label {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    #zoom-slider {
      width: 100%;
      height: 5px;
      accent-color: white;
      cursor: pointer;
    }

    #zoom-value {
      min-width: 35px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 13px;
      text-align: right;
    }

    #loading {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #333;
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #result-text {
      position: absolute;
      left: 50%;
      top: 12%;
      transform: translateX(-50%);
      z-index: 50;
      width: 85%;
      max-width: 700px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 36px;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      display: none;
    }

    .action-button {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      border: none;
      padding: 18px 38px;
      border-radius: 999px;
      background: white;
      color: #111;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
    }

    .action-button:active {
      transform: translateX(-50%) scale(0.95);
    }

    #open-button {
      top: 55%;
      display: none;
    }

    #rescan {
      top: 70%;
      display: none;
    }

    #version-number {
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      z-index: 100;
      color: rgba(255, 255, 255, 0.45);
      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: 400;
      pointer-events: none;
      user-select: none;
    }

  </style>
</head>

<body>

  <div id="app">

    <div id="top-bar">

      <button
        id="home-button"
        onclick="toggleHomeMenu()"
        aria-label="Home"
      >
        ☰
      </button>

      <div id="site-title">
        Printer Scanner 5000
      </div>

      <div id="home-menu">

        <button
          class="menu-button"
          onclick="openPrinterLink('https://apps.apple.com/app/id1625671285')"
        >
          H2D
        </button>

        <button
          class="menu-button"
          onclick="openPrinterLink('https://apps.apple.com/app/id1166269606')"
        >
          TOYBOX
        </button>

        <button
          class="menu-button"
          onclick="openPrinterLink('https://apps.apple.com/app/id1658133862')"
        >
          Ender 3
        </button>

        <button
          class="menu-button"
          onclick="refreshPage()"
        >
          Refresh
        </button>

      </div>

    </div>

    <div id="camera">

      <div id="reader"></div>

      <div id="scan-box"></div>

      <div id="hold-still">
        it’s a bit blurry, try moving a bit
      </div>

      <div id="zoom-container">

        <span id="zoom-label">
          Zoom
        </span>

        <input
          id="zoom-slider"
          type="range"
          min="1"
          max="5"
          step="0.1"
          value="1"
          oninput="setZoom(this.value)"
        >

        <span id="zoom-value">
          1×
        </span>

      </div>

      <div id="loading">
        <div class="spinner"></div>
      </div>

      <div id="result-text"></div>

      <button
        id="open-button"
        class="action-button"
        onclick="openScannedSite()"
      >
        Open
      </button>

      <button
        id="rescan"
        class="action-button"
        onclick="rescan()"
      >
        Rescan
      </button>

      <div id="version-number">
        v3.5
      </div>

    </div>

  </div>


  <script>

    let scanner = null;
    let firstDetection = null;
    let detectedText = null;
    let scanConfirmed = false;
    let scannedURL = null;
    let isPrinterLink = false;
    let cameraTrack = null;

    const HOLD_TIME = 600;


    /*
      HOME MENU
    */

    function toggleHomeMenu() {

      const menu =
        document.getElementById("home-menu");

      menu.style.display =
        menu.style.display === "block"
          ? "none"
          : "block";
    }


    /*
      OPEN PRINTER LINK
    */

    function openPrinterLink(url) {

      window.open(url, "_blank");

      document.getElementById(
        "home-menu"
      ).style.display = "none";

    }


    /*
      REFRESH PAGE
    */

    function refreshPage() {

      window.location.reload();

    }


    /*
      CLOSE MENU WHEN CLICKING OUTSIDE
    */

    document.addEventListener(
      "click",
      function(event) {

        const menu =
          document.getElementById("home-menu");

        const button =
          document.getElementById("home-button");

        if (
          !menu.contains(event.target) &&
          !button.contains(event.target)
        ) {

          menu.style.display = "none";

        }

      }
    );


    /*
      CUSTOM QR RESULTS
    */

    function getQRText(url) {

      try {

        const scannedURL = new URL(
          url.startsWith("http")
            ? url
            : "https://" + url
        );

        const cleanURL =
          scannedURL.origin +
          scannedURL.pathname;


        if (
          cleanURL ===
          "https://apps.apple.com/app/id1166269606"
        ) {

          isPrinterLink = true;

          return "TOYBOX Found";

        }


        if (
          cleanURL ===
          "https://apps.apple.com/app/id1658133862"
        ) {

          isPrinterLink = true;

          return "Ender 3 Found";

        }


        if (
          cleanURL ===
          "https://apps.apple.com/app/id1625671285"
        ) {

          isPrinterLink = true;

          return "This is to print with the H2D";

        }


        if (
          scannedURL.origin ===
            "https://makerworld.com" &&
          scannedURL.pathname === "/en"
        ) {

          isPrinterLink = false;

          return "This opens MakerWorld, which is for the H2D, I just put the wrong text on the QR code :/";

        }


        isPrinterLink = false;

        return "QR Code Found";

      }

      catch (error) {

        isPrinterLink = false;

        return "QR Code Found";

      }

    }


    /*
      ZOOM
    */

    async function setZoom(value) {

      const zoom =
        parseFloat(value);

      document.getElementById(
        "zoom-value"
      ).textContent =
        zoom.toFixed(1) + "×";


      if (!cameraTrack) {
        return;
      }


      try {

        const capabilities =
          cameraTrack.getCapabilities();


        if (!capabilities.zoom) {
          return;
        }


        const min =
          capabilities.zoom.min;

        const max =
          capabilities.zoom.max;


        const actualZoom =
          min +
          ((zoom - 1) / 4) *
          (max - min);


        await cameraTrack.applyConstraints({

          advanced: [
            {
              zoom: actualZoom
            }
          ]

        });

      }

      catch (error) {

        console.log(
          "Zoom not supported:",
          error
        );

      }

    }


    /*
      START CAMERA
    */

    async function startScanner() {

      scanner =
        new Html5Qrcode("reader");

      try {

        await scanner.start(

          {
            facingMode: "environment"
          },

          {
            fps: 30,

            qrbox: {
              width: 250,
              height: 250
            },

            disableFlip: false
          },

          async function(decodedText) {

            if (scanConfirmed) {
              return;
            }


            if (!cameraTrack) {

              const video =
                document.querySelector(
                  "#reader video"
                );

              if (
                video &&
                video.srcObject
              ) {

                const tracks =
                  video.srcObject.getVideoTracks();

                if (tracks.length > 0) {

                  cameraTrack =
                    tracks[0];

                }

              }

            }


            if (
              firstDetection === null
            ) {

              firstDetection =
                Date.now();

              detectedText =
                decodedText;

              document.getElementById(
                "hold-still"
              ).style.display =
                "block";

              return;

            }


            if (
              decodedText !==
              detectedText
            ) {

              firstDetection =
                Date.now();

              detectedText =
                decodedText;

              document.getElementById(
                "hold-still"
              ).style.display =
                "block";

              return;

            }


            if (
              Date.now() -
              firstDetection >=
              HOLD_TIME
            ) {

              scanConfirmed = true;

              scannedURL =
                decodedText;


              document.getElementById(
                "hold-still"
              ).style.display =
                "none";


              document.getElementById(
                "zoom-container"
              ).style.display =
                "none";


              document.getElementById(
                "version-number"
              ).style.display =
                "none";


              if (scanner) {

                try {

                  await scanner.stop();

                }

                catch (error) {

                  console.error(
                    "CAMERA STOP ERROR:",
                    error
                  );

                }

              }


              cameraTrack = null;


              document.getElementById(
                "reader"
              ).style.display =
                "none";

              document.getElementById(
                "scan-box"
              ).style.display =
                "none";

              document.getElementById(
                "loading"
              ).style.display =
                "none";


              const resultText =
                document.getElementById(
                  "result-text"
                );

              resultText.textContent =
                getQRText(
                  decodedText
                );

              resultText.style.display =
                "block";


              const openButton =
                document.getElementById(
                  "open-button"
                );

              openButton.textContent =
                isPrinterLink
                  ? "Print"
                  : "Open";

              openButton.style.display =
                "block";


              document.getElementById(
                "rescan"
              ).style.display =
                "block";

            }

          },

          function(errorMessage) {

            // Normal scanning errors are ignored.

          }

        );


        document.getElementById(
          "loading"
        ).style.display =
          "none";


        setTimeout(function() {

          const video =
            document.querySelector(
              "#reader video"
            );

          if (
            video &&
            video.srcObject
          ) {

            const tracks =
              video.srcObject.getVideoTracks();

            if (tracks.length > 0) {

              cameraTrack =
                tracks[0];

            }

          }

        }, 500);

      }

      catch(error) {

        console.error(
          "CAMERA ERROR:",
          error
        );

        document.getElementById(
          "loading"
        ).style.display =
          "none";

      }

    }


    /*
      OPEN / PRINT
    */

    function openScannedSite() {

      if (!scannedURL) {
        return;
      }

      let url =
        scannedURL;


      if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
      ) {

        url =
          "https://" + url;

      }


      window.open(
        url,
        "_blank"
      );

    }


    /*
      RESCAN
    */

    function rescan() {

      window.location.reload();

    }


    /*
      START
    */

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>
</html>
